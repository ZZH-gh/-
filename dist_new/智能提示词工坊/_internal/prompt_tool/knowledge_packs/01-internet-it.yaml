# ============================================
# 1. meta — 知识包元数据
# ============================================
meta:
  id: "internet_it"
  name: "互联网 / IT"
  version: "1.0.0"
  schema_version: "1.0"
  description: >
    互联网产品、技术开发与运营行业知识包，覆盖产品管理、软件研发、
    数据分析、技术写作、团队管理五大高频场景，适用于产品经理、
    前端工程师、后端工程师、数据分析师、技术负责人等角色。
  last_updated: "2026-06-03"
  icon: "💻"

# ============================================
# 2. terms — 行业术语表（>=30 条）
# ============================================
terms:
  # --- 产品管理类（8 条） ---
  - term: "PRD"
    category: "产品文档"
    definition: "产品需求文档（Product Requirements Document），详细描述产品功能、业务流程、界面要求和验收标准的规范文档。"
    aliases: ["产品需求文档", "需求文档"]
    usage_context: "产品经理在需求分析阶段编写，用于向研发团队传达功能需求"
    related_terms: ["BRD", "MRD", "用户故事"]

  - term: "BRD"
    category: "产品文档"
    definition: "商业需求文档（Business Requirements Document），从商业角度阐述产品价值、市场机会、收益预期和投入成本的战略级文档。"
    aliases: ["商业需求文档", "商业分析文档"]
    usage_context: "产品经理在立项阶段编写，用于向管理层说明产品商业价值"
    related_terms: ["PRD", "MRD", "商业分析"]

  - term: "MRD"
    category: "产品文档"
    definition: "市场需求文档（Market Requirements Document），分析目标市场规模、用户画像、竞品格局和差异化定位的市场策略文档。"
    aliases: ["市场需求文档"]
    usage_context: "产品经理在市场调研阶段编写，用于确定产品定位和方向"
    related_terms: ["BRD", "PRD", "竞品分析"]

  - term: "用户故事"
    category: "产品管理"
    definition: "User Story，以用户视角描述功能需求的简短描述，格式为'作为XX角色，我希望XX，以便XX'的标准化表达。"
    aliases: ["User Story", "用户需求"]
    usage_context: "敏捷开发中用于表达用户需求，每个用户故事代表一个独立可交付的功能单元"
    related_terms: ["需求评审", "验收标准", "Sprint"]

  - term: "验收标准"
    category: "产品管理"
    definition: "定义功能是否完成的量化或定性条件清单，包含正向场景、异常场景和性能指标的详细验收条件。"
    aliases: ["Acceptance Criteria", "验收条件", "完成的定义"]
    usage_context: "产品经理与研发团队共同制定，作为功能交付的验收依据"
    related_terms: ["PRD", "用户故事", "测试用例"]

  - term: "原型"
    category: "产品管理"
    definition: "产品界面和交互流程的低保真或高保真可视化设计稿，用于在开发前验证产品方案和用户体验。"
    aliases: ["Prototype", "线框图", "设计稿"]
    usage_context: "产品经理或设计师在需求阶段产出，用于沟通界面布局和交互流程"
    related_terms: ["PRD", "用户故事", "需求评审"]

  - term: "需求评审"
    category: "产品管理"
    definition: "产品经理组织研发、测试、设计等角色对PRD进行集体审查和确认的正式会议。"
    aliases: ["需求评审会", "PRD评审"]
    usage_context: "PRD完成后由产品经理发起，各方确认需求理解一致后方可进入开发"
    related_terms: ["PRD", "技术评审", "验收标准"]

  - term: "竞品分析"
    category: "产品管理"
    definition: "对竞争对手的产品功能、用户体验、商业模式和市场策略进行系统性对比分析的方法论和输出报告。"
    aliases: ["竞品调研", "竞争分析", "竞品研究"]
    usage_context: "产品规划或功能设计前期，用于了解市场格局和竞品优劣势"
    related_terms: ["BRD", "MRD", "产品定位"]

  # --- 研发类（9 条） ---
  - term: "API"
    category: "研发流程"
    definition: "应用程序编程接口（Application Programming Interface），定义不同软件组件之间的通信协议和数据交换格式。"
    aliases: ["接口", "API接口", "应用程序接口"]
    usage_context: "前后端开发中用于定义服务间调用契约，是系统集成的核心要素"
    related_terms: ["API文档", "REST", "微服务"]

  - term: "微服务"
    category: "技术架构"
    definition: "将单一应用拆分为一组小型、独立部署的服务，每个服务运行在自己的进程中，通过轻量级通信机制协作的架构风格。"
    aliases: ["Microservices", "微服务架构", "微服务化"]
    usage_context: "大型系统架构设计时采用，实现各服务的独立开发、部署和扩展"
    related_terms: ["API", "容器", "Docker", "CI/CD"]

  - term: "CI/CD"
    category: "研发流程"
    definition: "持续集成与持续部署，开发人员频繁地将代码变更合并到主干并自动触发构建、测试和部署的工程实践。"
    aliases: ["持续集成", "持续部署", "持续交付", "CI"]
    usage_context: "研发团队配置自动化流水线，每次代码提交自动触发构建和部署流程"
    related_terms: ["代码审查", "灰度发布", "DevOps"]

  - term: "代码审查"
    category: "研发流程"
    definition: "开发人员提交代码后由其他团队成员逐行审查代码质量、逻辑正确性和规范符合度的质量保障实践。"
    aliases: ["Code Review", "CR", "代码评审"]
    usage_context: "代码合并到主干前必须完成的审查环节，通常通过Pull Request进行"
    related_terms: ["CI/CD", "技术债", "重构"]

  - term: "技术债"
    category: "研发管理"
    definition: "开发团队为追求短期交付速度而采取了低质量的技术方案，导致后续维护和迭代成本不断增加的隐喻性负债。"
    aliases: ["Technical Debt", "技术负债", "代码债"]
    usage_context: "技术负责人评估系统健康度时考量，技术债过高会严重影响开发效率"
    related_terms: ["重构", "代码审查", "架构设计"]

  - term: "重构"
    category: "研发管理"
    definition: "在不改变代码外部行为的前提下，对内部结构进行系统性优化以提高可读性、可维护性和可扩展性的过程。"
    aliases: ["Refactoring", "代码重构", "架构优化"]
    usage_context: "在功能迭代间隙或技术债积累到一定程度时进行，是保持代码健康的关键活动"
    related_terms: ["技术债", "代码审查", "测试"]

  - term: "灰度发布"
    category: "研发流程"
    definition: "将新版本逐步推送给部分用户，在真实环境中验证稳定性后再全量发布的渐进式上线策略。"
    aliases: ["灰度", "灰度上线", "金丝雀发布", "Canary Release"]
    usage_context: "重要功能上线前，先给5%-10%用户使用以发现潜在问题，降低全量发布的失败风险"
    related_terms: ["上线", "回滚", "A/B测试", "CI/CD"]

  - term: "敏捷开发"
    category: "研发管理"
    definition: "以迭代、增量、协作为核心原则的软件开发方法论，强调快速响应需求变化和持续交付价值的开发模式。"
    aliases: ["Agile", "敏捷", "Scrum", "看板"]
    usage_context: "互联网产品开发普遍采用的管理方式，按固定周期（通常1-4周）迭代交付"
    related_terms: ["Sprint", "用户故事", "迭代"]

  - term: "Sprint"
    category: "研发管理"
    definition: "Scrum框架中的短周期开发迭代，通常为1-4周，团队在Sprint内完成固定的用户故事并交付可用的产品增量。"
    aliases: ["冲刺", "迭代周期", "Sprint迭代"]
    usage_context: "敏捷开发中的时间盒管理单元，每个Sprint有明确的待办事项和交付目标"
    related_terms: ["敏捷开发", "用户故事", "迭代", "站会"]

  # --- 数据分析类（8 条） ---
  - term: "DAU"
    category: "数据分析"
    definition: "日活跃用户数（Daily Active Users），统计一天内启动并使用产品的唯一用户数量，衡量产品日常活跃度的核心指标。"
    aliases: ["日活跃", "Daily Active Users", "日活"]
    usage_context: "产品运营和数据分析师日常监控产品活跃度，DAU趋势反映产品的用户粘性和健康度"
    related_terms: ["MAU", "留存率", "用户增长"]

  - term: "MAU"
    category: "数据分析"
    definition: "月活跃用户数（Monthly Active Users），统计一个月内至少使用一次产品的唯一用户数量，反映产品的覆盖规模。"
    aliases: ["月活跃", "Monthly Active Users", "月活"]
    usage_context: "衡量产品长期用户规模和增长趋势，常用于向投资者汇报和业务健康度评估"
    related_terms: ["DAU", "留存率", "用户增长"]

  - term: "留存率"
    category: "数据分析"
    definition: "在特定时间后仍然继续使用产品的用户占初始新增用户的比例，是衡量产品黏性和长期价值的关键指标。"
    aliases: ["Retention Rate", "用户留存", "留存"]
    usage_context: "产品运营和数据分析师评估用户召回和产品改进效果，常用次日/7日/30日留存率"
    related_terms: ["DAU", "MAU", "漏斗分析", "A/B测试"]

  - term: "转化率"
    category: "数据分析"
    definition: "完成特定目标行为的用户数占进入该流程的用户总数的比例，衡量流程效率和功能价值的关键指标。"
    aliases: ["Conversion Rate", "转化", "CVR"]
    usage_context: "产品运营和增长团队评估注册流程、购买链路、功能使用率等各个环节的效率"
    related_terms: ["漏斗分析", "A/B测试", "埋点", "BI看板"]

  - term: "漏斗分析"
    category: "数据分析"
    definition: "追踪用户在多步骤流程中的逐步流失情况，识别各环节转化率并定位优化机会的分析方法。"
    aliases: ["Funnel Analysis", "漏斗模型", "转化漏斗"]
    usage_context: "产品运营分析用户从进入产品到完成核心目标的完整路径，找出流失最严重的环节"
    related_terms: ["转化率", "埋点", "A/B测试", "留存率"]

  - term: "埋点"
    category: "数据分析"
    definition: "在产品前端和后端代码中嵌入数据采集代码，当用户执行特定操作时自动记录行为数据的技术实现方式。"
    aliases: ["事件跟踪", "数据采集", "埋点上报"]
    usage_context: "产品和运营团队在开发阶段规划埋点方案，用于后续用户行为分析和产品优化"
    related_terms: ["漏斗分析", "BI看板", "A/B测试", "数据分析"]

  - term: "BI看板"
    category: "数据分析"
    definition: "商业智能仪表盘（Business Intelligence Dashboard），将核心业务指标以图表形式实时可视化展示的数据管理工具。"
    aliases: ["BI Dashboard", "数据看板", "仪表盘", "数据大屏"]
    usage_context: "管理层和业务团队日常监控业务健康度，快速发现数据异常和趋势变化"
    related_terms: ["埋点", "数据分析", "DAU", "留存率"]

  - term: "A/B测试"
    category: "数据分析"
    definition: "将用户随机分组，向不同组展示不同版本的产品或功能，通过对比数据指标确定最优方案的实验方法。"
    aliases: ["A/B实验", "分流测试", "对比实验", "Split Test"]
    usage_context: "产品和增长团队验证新功能效果、优化UI设计或算法策略时使用，用数据驱动决策"
    related_terms: ["转化率", "漏斗分析", "灰度发布", "数据分析"]

  # --- 技术写作类（5 条） ---
  - term: "API文档"
    category: "技术写作"
    definition: "描述API接口的功能说明、请求参数格式、响应数据结构、错误码定义和调用示例的技术参考资料。"
    aliases: ["API文档", "接口文档", "API Reference"]
    usage_context: "后端开发完成后提供给前端开发或第三方集成方，是服务调用的标准参考手册"
    related_terms: ["API", "技术文档", "RFC", "SDK"]

  - term: "RFC"
    category: "技术写作"
    definition: "请求评议文档（Request for Comments），在实施重大技术变更前向团队征求技术方案反馈的协作文档。"
    aliases: ["技术方案评审", "Request for Comments", "RFC文档"]
    usage_context: "技术方案设计阶段，由技术负责人或架构师发起，邀请相关工程师评议方案可行性"
    related_terms: ["技术方案", "架构图", "代码审查"]

  - term: "README"
    category: "技术写作"
    definition: "项目根目录下的说明文档，包含项目概述、安装方式、使用方法、技术栈和贡献指南等关键信息。"
    aliases: ["项目说明", "自述文件", "Readme"]
    usage_context: "开源项目或内部项目仓库中，新成员入职或外部贡献者了解项目的第一入口"
    related_terms: ["技术文档", "API文档", "变更日志"]

  - term: "架构图"
    category: "技术写作"
    definition: "用图形化方式展示系统组件、模块关系、数据流向和部署拓扑的技术可视化文档。"
    aliases: ["架构图", "系统架构图", "系统设计图", "Architecture Diagram"]
    usage_context: "技术方案设计和文档撰写时，用于直观表达系统结构和各模块间的交互关系"
    related_terms: ["技术方案", "RFC", "API文档"]

  - term: "技术方案"
    category: "技术写作"
    definition: "针对特定业务需求提出的技术实现方案文档，包含技术选型对比、架构设计、风险评估和上线计划。"
    aliases: ["技术设计文档", "技术方案", "设计文档", "Tech Design Doc"]
    usage_context: "开发前由技术负责人或资深工程师编写，经评审通过后作为开发实施的技术纲领"
    related_terms: ["RFC", "架构图", "需求评审", "技术评审"]

  # --- 综合管理类（6 条） ---
  - term: "OKR"
    category: "管理"
    definition: "目标与关键结果（Objectives and Key Results），设定定性目标和量化关键结果的目标管理框架，用于对齐团队方向。"
    aliases: ["目标与关键结果", "OKR管理"]
    usage_context: "公司和团队季度目标设定，目标鼓舞人心，关键结果可量化衡量是否达成"
    related_terms: ["KPI", "迭代", "Sprint"]

  - term: "KPI"
    category: "管理"
    definition: "关键绩效指标（Key Performance Indicators），量化衡量个人、团队或业务表现的标准化度量指标。"
    aliases: ["关键绩效指标", "绩效指标", "KPI指标"]
    usage_context: "绩效考核和业务回顾时使用，用于评估工作成果和业务健康状况"
    related_terms: ["OKR", "数据分析", "BI看板"]

  - term: "迭代"
    category: "研发管理"
    definition: "软件产品分版本持续交付的开发模式，每个迭代周期内完成规划的功能并发布新版本，不断叠加功能和完善产品。"
    aliases: ["版本迭代", "Iteration", "迭代开发"]
    usage_context: "互联网产品采用持续迭代模式，每周或每两周发布一个版本，快速响应用户需求"
    related_terms: ["Sprint", "敏捷开发", "上线"]

  - term: "上线"
    category: "研发流程"
    definition: "将开发完成的软件功能或版本部署到生产环境，正式向用户提供服务的关键发布操作。"
    aliases: ["发布", "发布上线", "Go Live", "Deploy"]
    usage_context: "测试验证通过后执行上线操作，通常配合灰度发布策略降低上线风险"
    related_terms: ["灰度发布", "回滚", "CI/CD", "Sprint"]

  - term: "回滚"
    category: "研发流程"
    definition: "在新版本上线出现严重问题时，将系统恢复到上一个稳定版本的风险应对操作。"
    aliases: ["Rollback", "回退", "版本回退"]
    usage_context: "上线后发现问题时立即触发回滚，是保障线上稳定性的最后一道防线"
    related_terms: ["上线", "灰度发布", "CI/CD", "SLA"]

  - term: "SLA"
    category: "管理"
    definition: "服务等级协议（Service Level Agreement），定义服务提供方应达到的可用性、响应时间和处理时效等质量承诺标准。"
    aliases: ["服务等级协议", "服务可用性承诺", "SLA标准"]
    usage_context: "技术团队与业务方约定的服务质量标准，如系统可用性99.9%、故障响应时间15分钟"
    related_terms: ["上线", "运维", "线上监控"]

  # --- 面试招聘类（5 条） ---
  - term: "行为面试"
    category: "团队管理"
    definition: "通过考察候选人在过去特定情境下的行为表现来预测其未来工作表现的面试方法，以 STAR 法则（情境-任务-行动-结果）为核心框架。"
    aliases: ["BEI面试", "行为事件访谈", "STAR面试"]
    usage_context: "招聘面试中用于评估候选人的实际工作能力和处事方式，特别适用于管理岗位和关键岗位招聘"
    related_terms: ["技术面试", "结构化面试", "胜任力模型"]

  - term: "技术面试"
    category: "团队管理"
    definition: "评估候选人技术能力和编程水平的面试环节，包括算法题、系统设计、技术深度追问和编码实践等考核内容。"
    aliases: ["技术面", "Tech Interview", "技术考核"]
    usage_context: "技术岗位招聘中由技术负责人或资深工程师主导，评估候选人的技术深度和解决问题能力"
    related_terms: ["行为面试", "代码审查", "技术方案", "架构设计"]

  - term: "结构化面试"
    category: "团队管理"
    definition: "按照预先设计的标准化流程和评估维度进行面试的方法，所有候选人被问及相同的问题集并采用统一的评分标准。"
    aliases: ["结构化面谈", "标准化面试", "结构化评估"]
    usage_context: "大规模招聘或校招中确保面试公平性和可比性，减少面试官主观偏差对评估结果的影响"
