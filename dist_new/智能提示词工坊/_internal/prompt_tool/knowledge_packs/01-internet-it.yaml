    aliases: ["Design System", "设计规范", "组件库", "UI规范"]
    usage_context: "设计团队和前端开发团队共同维护，用于保持产品视觉一致性并加速设计与开发协作"
    related_terms: ["原型", "交互设计", "可用性测试", "前端"]

  - term: "可用性测试"
    category: "设计体验"
