    related_terms: ["用户体验", "交互设计", "原型", "A/B测试"]

  # --- 测试策略类（6 条） ---
  - term: "单元测试"
    category: "测试质量"
    definition: "对代码中最小的可测试单元（函数、方法、类）进行独立验证的自动化测试实践，确保每个代码单元按照预期工作。"
    aliases: ["Unit Test", "UT", "单测"]
    usage_context: "开发人员在编码阶段同步编写，用于验证函数逻辑正确性并防止后续修改引入回归问题"
    related_terms: ["集成测试", "端到端测试", "回归测试", "代码审查"]

  - term: "集成测试"
    category: "测试质量"
    definition: "验证多个模块或服务之间交互和协作是否正确的测试层级，检测接口调用、数据传递和外部依赖集成的潜在问题。"
    aliases: ["Integration Test", "集成测试", "联调测试"]
    usage_context: "各模块开发完成后由开发或测试工程师执行，确保前后端接口、服务间调用和数据流畅通"
    related_terms: ["单元测试", "端到端测试", "API", "CI/CD"]

  - term: "端到端测试"
    category: "测试质量"
    definition: "模拟真实用户从开始到完成完整业务流程的自动化测试，覆盖前端界面、后端服务、数据库和第三方集成的全链路验证。"
    aliases: ["E2E Test", "端到端测试", "全链路测试", "E2E"]
    usage_context: "核心业务流程上线前进行全路径验证，确保用户从进入系统到完成目标的每个环节正常工作"
    related_terms: ["集成测试", "单元测试", "回归测试", "自动化测试框架"]

  - term: "回归测试"
    category: "测试质量"
    definition: "在代码修改或功能新增后重新执行已有测试用例，验证原有功能没有被破坏的测试策略，防止修改引入新缺陷。"
    aliases: ["Regression Test", "回归测试", "回测"]
    usage_context: "每次代码变更后由测试工程师执行，确保新代码不会影响已有功能的正常使用"
    related_terms: ["单元测试", "端到端测试", "CI/CD", "自动化测试框架"]

  - term: "压力测试"
    category: "测试质量"
    definition: "通过模拟高并发、大流量或极限负载来评估系统性能瓶颈和稳定性边界的非功能性测试方法。"
    aliases: ["Stress Test", "压测", "负载测试", "性能测试"]
    usage_context: "上线前或大促活动前由测试或运维团队执行，确定系统的最大承载能力和性能衰减曲线"
    related_terms: ["性能剖析", "SLA", "并发优化", "监控告警"]

  - term: "自动化测试框架"
    category: "测试质量"
    definition: "提供测试用例编写、执行调度、报告生成和持续集成集成的标准化测试基础设施，提升测试效率和覆盖率。"
    aliases: ["测试框架", "自动化测试", "Test Framework"]
    usage_context: "测试团队搭建和维护，支持单元/集成/E2E 多层级的自动化测试执行和管理"
    related_terms: ["单元测试", "集成测试", "CI/CD管道", "回归测试"]

  # --- 架构设计类（6 条） ---
  - term: "分层架构"
    category: "架构设计"
    definition: "将系统按职责划分为表现层、业务逻辑层、数据访问层等多个层次，每层只与相邻层通信的经典架构模式。"
    aliases: ["Layered Architecture", "分层架构", "N层架构"]
    usage_context: "系统设计初期由架构师确定整体结构，适用于业务逻辑清晰的中小型系统"
    related_terms: ["微服务", "事件驱动架构", "领域驱动设计", "CQRS"]

  - term: "事件驱动架构"
    category: "架构设计"
    definition: "系统组件通过生产和消费事件进行异步通信的架构模式，事件生产者不关心消费者是谁，实现高度解耦和弹性伸缩。"
    aliases: ["Event-Driven Architecture", "EDA", "事件驱动"]
    usage_context: "高并发、实时处理和复杂工作流场景中使用，适合需要弹性扩展的系统架构"
    related_terms: ["微服务", "CQRS", "异步处理", "服务网格"]

  - term: "CQRS"
    category: "架构设计"
    definition: "命令查询职责分离模式（Command Query Responsibility Segregation），将数据的读写操作分离到不同的模型和存储中，优化查询和写入性能。"
    aliases: ["命令查询职责分离", "CQRS模式", "读写分离架构"]
    usage_context: "复杂业务系统中读写负载差异大时使用，读模型和写模型可以独立优化和扩展"
    related_terms: ["事件驱动架构", "领域驱动设计", "读写分离", "数据库优化"]

  - term: "领域驱动设计"
    category: "架构设计"
    definition: "以业务领域为核心驱动软件设计的开发方法论，通过通用语言、限界上下文、实体和值对象等概念建模复杂业务逻辑。"
    aliases: ["DDD", "Domain-Driven Design", "领域驱动"]
    usage_context: "复杂业务系统的架构设计中，由领域专家和开发团队共同建模，确保软件反映真实业务规则"
    related_terms: ["分层架构", "微服务", "CQRS", "事件驱动架构"]

  - term: "服务网格"
    category: "架构设计"
    definition: "在微服务架构中专门处理服务间通信的中间件基础设施层，负责服务发现、负载均衡、熔断限流和可观测性的统一管理。"
    aliases: ["Service Mesh", "服务网格", "Istio"]
    usage_context: "大规模微服务部署中由架构师和运维团队引入，将通信逻辑从业务代码中剥离到基础设施层"
    related_terms: ["微服务", "Kubernetes", "API", "监控告警"]

  - term: "微服务治理"
    category: "架构设计"
    definition: "对微服务集群进行全生命周期管理的工程实践，涵盖服务注册发现、配置管理、流量控制、熔断降级和链路追踪等能力。"
    aliases: ["微服务管理", "服务治理", "Microservice Governance"]
    usage_context: "大规模微服务架构中的日常运维管理，确保服务集群的健康运行和故障快速恢复"
    related_terms: ["微服务", "服务网格", "Kubernetes", "监控告警"]

  # --- 数据库优化类（5 条） ---
  - term: "索引优化"
    category: "数据库"
    definition: "通过分析查询执行计划，合理设计和管理数据库索引以提升查询性能的优化过程，包括索引创建、调整和维护策略。"
    aliases: ["索引调优", "Index Optimization", "索引策略"]
    usage_context: "后端工程师或DBA在数据库查询缓慢时分析并优化索引，减少全表扫描和提升查询响应速度"
    related_terms: ["查询计划", "分库分表", "读写分离", "缓存策略"]

  - term: "查询计划"
    category: "数据库"
    definition: "数据库执行 SQL 查询时优化器选择的执行路径和执行方法，包括表的访问顺序、索引使用方式、连接算法等关键信息。"
    aliases: ["执行计划", "Query Plan", "Explain Plan"]
    usage_context: "DBA 和开发工程师调优慢查询时使用，通过解读查询计划识别性能瓶颈和优化方向"
    related_terms: ["索引优化", "SQL查询", "性能剖析", "数据库优化"]

  - term: "分库分表"
    category: "数据库"
    definition: "将单一数据库按水平或垂直维度拆分为多个数据库实例和数据表，解决单库数据量过大导致的性能瓶颈和存储限制问题。"
    aliases: ["Sharding", "分片", "数据库分片", "水平拆分"]
    usage_context: "数据量达到单库瓶颈时由 DBA 或架构师设计拆分方案，适用于大规模高并发业务系统"
    related_terms: ["读写分离", "索引优化", "缓存策略", "微服务"]

  - term: "读写分离"
    category: "数据库"
    definition: "将数据库的读操作和写操作分发到不同的数据库实例上，主库处理写入，从库处理读取，提升系统的整体吞吐能力。"
    aliases: ["读写分离架构", "Read-Write Split", "主从分离"]
    usage_context: "读多写少场景下由 DBA 或后端工程师配置，减轻主库压力并利用从库水平扩展读能力"
    related_terms: ["分库分表", "索引优化", "CQRS", "缓存策略"]

  - term: "缓存策略"
    category: "数据库"
    definition: "将频繁访问的数据存储在高速缓存层（如 Redis/Memcached）中以减少数据库查询次数的技术方案，包含缓存更新、淘汰和穿透防护策略。"
    aliases: ["Caching Strategy", "缓存方案", "缓存机制"]
    usage_context: "后端工程师在高并发或读密集场景中实施，通过缓存层降低数据库负载和提升响应速度"
    related_terms: ["读写分离", "分库分表", "性能优化", "并发优化"]

  # --- 安全审计类（6 条） ---
  - term: "渗透测试"
    category: "安全合规"
    definition: "模拟攻击者视角对系统进行安全入侵测试的方法，通过发现和利用安全漏洞评估系统的实际防护能力和风险暴露面。"
    aliases: ["Penetration Test", "渗透测试", "安全测试", "渗透"]
    usage_context: "安全工程师定期或在重大版本上线前执行，识别系统存在的安全漏洞和攻击路径"
    related_terms: ["漏洞扫描", "安全基线", "访问控制", "数据加密"]

  - term: "漏洞扫描"
    category: "安全合规"
    definition: "使用自动化工具对系统、网络和应用进行已知漏洞检测的过程，快速发现 CVE 漏洞、配置缺陷和不安全的第三方组件。"
    aliases: ["Vulnerability Scan", "漏洞检测", "安全扫描"]
    usage_context: "安全团队例行执行的安全检查，作为持续安全监控的一部分，通常集成在 CI/CD 流水线中"
    related_terms: ["渗透测试", "安全基线", "CI/CD管道", "代码审查"]

  - term: "安全基线"
    category: "安全合规"
    definition: "为系统和应用定义的最低安全配置标准和最佳实践集合，包括密码策略、权限控制、网络安全规则和日志审计要求。"
    aliases: ["Security Baseline", "安全基准", "安全配置标准"]
    usage_context: "安全团队制定并推动实施，所有系统和应用上线前必须满足安全基线要求"
    related_terms: ["渗透测试", "漏洞扫描", "访问控制", "SLA"]

  - term: "访问控制"
    category: "安全合规"
    definition: "通过身份认证和授权策略限制用户对系统资源和数据的访问权限，确保只有经过授权的用户才能执行特定操作的安全机制。"
    aliases: ["Access Control", "权限控制", "RBAC", "访问管理"]
    usage_context: "系统设计和运维中贯穿始终的安全机制，按最小权限原则分配用户的系统操作和数据访问权限"
    related_terms: ["安全基线", "数据加密", "零信任架构", "API"]

  - term: "数据加密"
    category: "安全合规"
    definition: "使用加密算法将明文数据转换为密文数据的技术，包括传输加密（TLS/HTTPS）和存储加密（AES/RSA），保护数据的机密性和完整性。"
    aliases: ["Data Encryption", "加密", "信息加密", "加密保护"]
    usage_context: "安全工程师在数据传输和存储环节实施，确保敏感信息在传输和存储过程中不会被非法窃取"
    related_terms: ["访问控制", "安全基线", "渗透测试", "零信任架构"]

  - term: "零信任架构"
    category: "安全合规"
    definition: "一种不信任任何网络位置的安全模型，默认不信任任何用户或设备，每次访问都需经过严格身份验证和授权检查的安全框架。"
    aliases: ["Zero Trust", "零信任", "ZTNA", "零信任网络"]
    usage_context: "安全架构设计时采用的高级安全模型，适用于远程办公、多云环境和云原生架构的安全防护"
    related_terms: ["访问控制", "数据加密", "安全基线", "微服务"]

  # --- 性能优化类（5 条） ---
  - term: "CDN"
    category: "运维部署"
    definition: "内容分发网络（Content Delivery Network），将静态资源缓存到全球分布的边缘节点，使用户从最近的节点获取内容以加速访问速度。"
    aliases: ["内容分发网络", "Content Delivery Network", "CDN加速"]
    usage_context: "前端和运维团队为提升全球用户访问速度配置，适用于图片、视频、JS/CSS 等静态资源加速"
    related_terms: ["性能优化", "懒加载", "缓存策略", "前端性能"]

  - term: "懒加载"
    category: "运维部署"
    definition: "延迟加载非首屏或非立即需要的资源（图片、组件、数据），直到用户需要它们时才加载，以减少初始页面加载时间的优化技术。"
    aliases: ["Lazy Loading", "延迟加载", "按需加载"]
    usage_context: "前端开发中提升页面首屏加载速度，图片较多的页面或长列表滚动加载时尤为有效"
    related_terms: ["CDN", "性能优化", "并发优化", "前端"]

  - term: "并发优化"
    category: "运维部署"
    definition: "通过多线程、协程、异步 I/O 和连接池等技术手段提升系统同时处理多个请求或任务能力的优化技术集合。"
    aliases: ["Concurrency Optimization", "并发处理", "并发性能"]
    usage_context: "后端和高并发系统的性能优化核心手段，适用于高流量 Web 服务和数据处理场景"
    related_terms: ["异步处理", "压力测试", "性能剖析", "缓存策略"]

  - term: "异步处理"
    category: "运维部署"
    definition: "将任务提交后不等待结果立即返回，任务在后台执行完成后通过回调或轮询获取结果的编程模型，提高系统吞吐和响应速度。"
    aliases: ["Async", "异步", "异步编程", "异步处理"]
    usage_context: "I/O 密集型或耗时操作的优化手段，如消息队列处理、文件上传、批量数据处理的非阻塞执行"
    related_terms: ["并发优化", "事件驱动架构", "性能剖析", "消息队列"]

  - term: "性能剖析"
    category: "运维部署"
    definition: "使用性能分析工具对系统运行时的 CPU 占用、内存分配、I/O 操作和函数调用耗时进行采样分析，定位性能瓶颈的方法。"
    aliases: ["Profiling", "性能分析", "性能诊断", "Profile"]
    usage_context: "开发和运维团队在性能调优时使用，通过 profiling 数据精准定位代码层面的性能热点"
    related_terms: ["压力测试", "并发优化", "监控告警", "日志分析"]

  # --- 团队协作类（5 条） ---
  - term: "每日站会"
    category: "团队管理"
    definition: "敏捷开发团队每天早上进行的 15 分钟同步会议，各成员回答昨天做了什么、今天做什么、有什么阻碍三个核心问题。"
    aliases: ["Daily Standup", "站会", "晨会", "每日同步"]
    usage_context: "敏捷团队日常同步信息、暴露风险和协调工作，通常站立进行以控制会议时间"
    related_terms: ["Sprint", "回顾会议", "敏捷开发", "需求梳理"]

  - term: "回顾会议"
    category: "团队管理"
    definition: "Sprint 或项目周期结束后团队进行的反思和持续改进会议，总结做得好的、需要改进的和下一步行动计划。"
    aliases: ["Retrospective", "Sprint回顾", "复盘会", "Retro"]
    usage_context: "每个迭代收尾阶段由 Scrum Master 或项目经理组织，团队共同检视流程并制定改进措施"
    related_terms: ["每日站会", "Sprint", "敏捷开发", "项目复盘"]

  - term: "需求梳理"
    category: "团队管理"
    definition: "产品经理和开发团队共同对用户故事和需求进行细化讨论、拆分和预估的过程，确保需求在进入开发前足够清晰。"
    aliases: ["Backlog Refinement", "需求细化", "待办事项梳理", "Backlog梳理"]
    usage_context: "Sprint 开始前由产品经理主持，与开发团队一起评估需求优先级、拆分任务和估算工时"
    related_terms: ["用户故事", "Sprint", "任务拆解", "需求评审"]

  - term: "任务拆解"
    category: "团队管理"
    definition: "将大型需求或用户故事拆分为较小的、可独立交付和估算的开发任务的技术，使工作量估算更准确和分配更灵活。"
    aliases: ["Task Breakdown", "任务分解", "工作拆分", "WBS"]
    usage_context: "需求梳理和 Sprint 规划阶段由产品经理和开发团队共同完成，确保每个任务都有明确的交付物"
    related_terms: ["需求梳理", "Sprint", "用户故事", "敏捷开发"]

  - term: "跨部门协作"
    category: "团队管理"
    definition: "不同职能部门（产品、研发、运营、市场、销售等）围绕共同目标开展协同工作的模式，需要有效的沟通机制和利益对齐。"
    aliases: ["跨部门合作", "Cross-Functional Collaboration", "部门协同"]
    usage_context: "涉及多部门参与的重大项目或产品上线中，需要建立跨团队的沟通机制和协作流程"
    related_terms: ["需求评审", "项目章程", "风险管理", "团队管理"]

# ============================================
# 3. tasks — 任务场景定义（5 个场景）
# ============================================
tasks:
  - name: "PRD撰写"
    description: >
      撰写产品需求文档（PRD），从用户需求和业务目标出发，定义功能范围、
      用户流程、界面交互和验收标准。需要与业务方对齐需求，与技术团队
      确认可实现性，确保文档清晰可执行。
    typical_output: >
      PRD文档，包含项目背景与目标、功能范围与边界、用户流程图、
      界面原型描述、验收标准、上线计划等内容
    complexity: "medium"
    frequency: "very_high"
    follow_up_tree: "prd_writing"

  - name: "代码生成"
    description: >
      根据功能需求和技术设计，编写高质量、可维护的代码。包括后端API
      接口开发、前端页面组件实现、数据处理脚本编写以及SQL查询优化等，
      需要遵循团队编码规范和最佳实践。
    typical_output: >
      源代码文件、单元测试、接口文档、使用说明，以及相关的技术注释
      和代码示例
    complexity: "high"
    frequency: "very_high"
    follow_up_tree: "code_generation"

  - name: "数据分析"
    description: >
      对业务数据进行系统性分析，包括描述性分析（发生了什么）、诊断性
      分析（为什么会发生）、预测性分析（将会怎样）和建议性分析
      （该怎么做），产出数据洞察驱动业务决策。
    typical_output: >
      数据分析报告、可视化图表、BI看板、关键发现与建议、数据驱动
      的决策方案
    complexity: "medium"
    frequency: "high"
    follow_up_tree: "data_analysis"

  - name: "技术文档"
    description: >
      编写各类技术文档，包括API接口文档、技术设计文档、用户操作手册、
      运维手册等。要求内容准确、结构清晰、示例完整，帮助目标读者快速
      理解和使用技术产品。
    typical_output: >
      结构化技术文档、代码示例、架构图、API参考手册、排错指南、
      使用教程
    complexity: "medium"
    frequency: "high"
    follow_up_tree: "tech_doc"

  - name: "工作总结"
    description: >
      撰写工作总结或述职报告，回顾周期内的工作成果、分析问题和不足、
      规划下一阶段目标和行动方案。适配不同岗位（管理岗、执行岗、
      技术负责人）和不同业绩表现的差异化表达。
    typical_output: >
      工作总结报告，包含业绩回顾、亮点分析、问题反思、改进措施和
      下阶段工作计划的完整汇报材料
    complexity: "low"
    frequency: "medium"
    follow_up_tree: "work_summary"

  - name: "面试招聘"
    description: >
      用户需要准备技术面试题目、行为面试问题，或制定招聘评估标准，
      针对不同岗位和面试类型的专业化面试方案生成。
    typical_output: >
      面试题库、面试评估表、技术面试题集、行为面试STAR问题列表、
      候选人评估报告模板
    complexity: "medium"
    frequency: "high"
    follow_up_tree: "interview_hiring"

  - name: "项目管理"
    description: >
      用户需要制定项目计划、识别风险、跟踪里程碑进度，生成项目
      管理相关文档和工具，确保项目按时按质交付。
    typical_output: >
      项目计划书、风险管理表、里程碑路线图、项目周报模板、
      项目复盘报告
    complexity: "medium"
    frequency: "high"
    follow_up_tree: "project_mgmt"

  - name: "运维部署"
    description: >
      用户需要设计部署方案、配置监控告警、制定容灾策略，生成
      运维相关的规范文档和自动化方案。
    typical_output: >
      部署方案文档、监控告警规则配置、容灾备份方案、运维手册、
      Runbook故障处理流程
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "ops_deployment"

  - name: "UI/UX 设计"
    description: >
      用户需要设计用户交互流程、建立设计系统、进行可用性测试，
      生成用户体验设计相关的规范文档和设计说明。
    typical_output: >
      设计规范文档、交互原型说明、设计系统组件指南、可用性测试报告、
      用户旅程地图
    complexity: "medium"
    frequency: "medium"
    follow_up_tree: "uiux_design"

  - name: "测试策略"
    description: >
      用户需要制定测试方案、设计测试用例、评估测试覆盖率，生成
      系统化的测试计划和质量管理文档。
    typical_output: >
      测试计划文档、测试用例集、自动化测试方案、测试覆盖率报告、
      质量评估报告
    complexity: "medium"
    frequency: "high"
    follow_up_tree: "test_strategy"

  - name: "架构设计"
    description: >
      用户需要进行系统架构设计、技术选型、架构评审，生成技术
      架构相关的方案文档和设计决策记录。
    typical_output: >
      架构设计文档、技术选型对比报告、系统架构图、接口规范文档、
      架构评审记录
    complexity: "high"
    frequency: "high"
    follow_up_tree: "arch_design"

  - name: "数据库优化"
    description: >
      用户需要优化数据库查询性能、设计分库分表方案、制定缓存
      策略，生成数据库优化方案和性能分析报告。
    typical_output: >
      数据库优化方案、慢查询分析报告、分库分表设计方案、
      缓存策略文档、索引优化建议
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "db_optimization"

  - name: "安全审计"
    description: >
      用户需要进行安全评估、制定安全策略、整改安全隐患，生成
      安全审计相关的评估报告和加固方案。
    typical_output: >
      安全审计报告、渗透测试报告、安全加固方案、安全基线文档、
      合规检查清单
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "security_audit"

  - name: "性能优化"
    description: >
      用户需要分析性能瓶颈、制定优化方案、进行压测验证，生成
      性能分析和优化相关的技术方案和评估报告。
    typical_output: >
      性能分析报告、优化方案文档、压测报告、性能基线文档、
      优化前后对比数据
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "perf_optimization"

  - name: "团队协作"
    description: >
      用户需要改善团队协作流程、规范会议制度、提升沟通效率，
      生成团队管理和协作相关的制度和规范文档。
    typical_output: >
      团队协作规范、会议制度文档、沟通流程指南、团队建设方案、
      跨部门协作流程
    complexity: "low"
    frequency: "medium"
    follow_up_tree: "team_collab"

# ============================================
# 4. roles — 角色知识定义（>=4 个角色）
# ============================================
roles:
  - name: "产品经理"
    kpis:
      - name: "功能上线率"
        description: "规划的功能按时上线的比例"
        benchmark: "> 80%"
      - name: "用户满意度"
        description: "产品上线后的用户满意度评分"
        benchmark: "> 4.0/5.0"
      - name: "需求交付周期"
        description: "从需求提出到上线的平均天数"
        benchmark: "< 15天"
    pain_points:
      - "需求频繁变更导致计划被打乱"
      - "与研发团队沟通存在理解偏差"
      - "多项目并行时优先级冲突难以协调"
      - "业务方期望过高与开发资源有限的矛盾"
    common_tasks:
      - "PRD撰写"
      - "需求分析"
      - "竞品分析"
      - "用户调研"
      - "数据分析"
    responsibilities:
      - "负责产品规划和路线图制定"
      - "深入理解用户需求并转化为可执行的产品方案"
      - "协调设计、研发、测试等团队推动产品上线"
      - "持续跟踪产品数据并根据反馈迭代优化"

  - name: "前端工程师"
    kpis:
      - name: "页面加载时间"
        description: "核心页面的首屏加载耗时"
        benchmark: "< 2秒"
      - name: "UI还原度"
        description: "前端实现与设计稿的视觉还原匹配度"
        benchmark: "> 95%"
      - name: "线上Bug率"
        description: "每百行代码引入的线上缺陷数量"
        benchmark: "< 0.5个/百行"
    pain_points:
      - "产品需求频繁变更导致前端返工率高"
      - "多浏览器兼容性问题排查耗时"
      - "设计稿不完整或缺少交互状态说明"
      - "后端接口联调时接口字段频繁变更"
    common_tasks:
      - "页面功能开发"
      - "组件封装与复用"
      - "前端性能优化"
      - "多端适配（PC/移动端/H5）"
      - "技术方案设计"
    responsibilities:
      - "负责前端架构设计和技术选型"
      - "保障用户交互体验的流畅性和一致性"
      - "持续优化页面性能和加载速度"
      - "参与产品需求讨论，从前端视角提供可行性建议"

  - name: "后端工程师"
    kpis:
      - name: "API响应时间"
        description: "核心接口的平均响应耗时"
        benchmark: "< 200ms"
      - name: "系统可用性"
        description: "服务月度可用时间占比"
        benchmark: "> 99.9%"
      - name: "代码覆盖率"
        description: "单元测试对业务代码的覆盖比例"
        benchmark: "> 80%"
    pain_points:
      - "需求文档不清晰导致技术方案反复修改"
      - "接口频繁变更影响开发和联调进度"
      - "线上问题排查困难，缺乏有效日志和监控"
      - "历史遗留系统代码难以维护和扩展"
    common_tasks:
      - "API接口开发"
      - "数据库设计与优化"
      - "系统性能调优"
      - "微服务架构设计与拆分"
      - "技术方案撰写"
    responsibilities:
      - "负责服务端架构设计和核心代码开发"
      - "保障系统的高可用性、安全性和可扩展性"
      - "优化数据库查询和系统性能"
      - "参与技术评审和代码审查，把控代码质量"

  - name: "数据分析师"
    kpis:
      - name: "数据准确率"
        description: "数据分析结果与实际情况的匹配度"
        benchmark: "> 98%"
      - name: "报表产出时效"
        description: "定期报表按计划交付的及时率"
        benchmark: "> 95%"
      - name: "洞察采纳率"
        description: "分析建议被业务方采纳并落地的比例"
        benchmark: "> 60%"
    pain_points:
      - "不同部门数据口径不一致导致分析结果互相矛盾"
      - "大量临时取数需求挤压深度分析时间"
      - "业务方看不懂分析报告或对数据结论有质疑"
      - "埋点数据质量差影响分析结果可信度"
    common_tasks:
      - "数据提取与清洗"
      - "报表开发与BI看板搭建"
      - "归因分析与漏斗分析"
      - "A/B实验设计与效果评估"
      - "专题分析与业务洞察报告"
    responsibilities:
      - "建设和维护数据指标体系"
      - "输出高质量数据分析和业务洞察"
      - "保障数据质量和数据治理规范"
      - "推动数据驱动决策文化在团队落地"

  - name: "技术负责人"
    kpis:
      - name: "项目交付准时率"
        description: "负责项目按计划时间交付的比例"
        benchmark: "> 85%"
      - name: "系统稳定性"
        description: "负责系统的P0级故障发生频率"
        benchmark: "< 1次/季度"
      - name: "团队技术成长"
        description: "团队成员的技能提升和职级晋升情况"
        benchmark: "每年至少2人晋升"
    pain_points:
      - "技术债积累导致新功能开发效率持续下降"
      - "团队成员技术水平参差不齐，代码质量难以统一"
      - "业务压力与技术规范之间的平衡难以把握"
      - "跨团队协作时技术方案对齐和资源协调困难"
    common_tasks:
      - "技术架构设计与评审"
      - "核心代码Review"
      - "技术方案决策与选型"
      - "团队技术规划与人才培养"
      - "线上事故应急指挥"
    responsibilities:
      - "负责技术团队管理和技术方向规划"
      - "制定编码规范和工程技术标准"
      - "评估技术风险和推动技术升级"
      - "培养团队成员并建设技术文化"

  # --- 新增角色: 项目经理 ---
  - name: "项目经理"
    kpis:
      - name: "项目交付及时率"
        description: "项目按计划里程碑交付的比例"
        benchmark: "> 85%"
      - name: "需求变更响应速度"
        description: "从需求变更提出到重新排期的平均时间"
        benchmark: "< 3天"
      - name: "干系人满意度"
        description: "项目干系人对项目进展和沟通的满意度评分"
        benchmark: "> 4.0/5.0"
    pain_points:
      - "需求频繁变更导致项目计划反复调整"
      - "跨部门资源协调困难，各团队优先级不一致"
      - "项目信息不透明，管理层得不到及时进展更新"
      - "风险评估不足导致突发问题影响交付"
    common_tasks:
      - "制定项目计划"
      - "风险管理"
      - "跨团队协作推进"
      - "里程碑跟踪"
      - "项目复盘总结"
    responsibilities:
      - "制定项目计划和时间线，管理关键路径"
      - "协调跨团队资源，推动项目按计划交付"
      - "识别和管理项目风险，制定应对策略"
      - "定期向干系人汇报项目进展和风险状态"

  # --- 新增角色: QA 测试工程师 ---
  - name: "QA测试工程师"
    kpis:
      - name: "缺陷检出率"
        description: "测试阶段发现的缺陷占总量比例"
        benchmark: "> 90%"
      - name: "测试覆盖率"
        description: "核心功能的自动化测试覆盖比例"
        benchmark: "> 80%"
      - name: "线上漏测率"
        description: "上线后每版本发现的漏测缺陷数"
        benchmark: "< 2个/版本"
    pain_points:
      - "需求文档不完整导致测试用例设计困难"
      - "开发联调延期挤压测试时间"
      - "回归测试工作量大，手动测试效率低"
      - "测试环境不稳定影响测试进度"
    common_tasks:
      - "测试计划制定"
      - "测试用例设计和评审"
      - "功能测试和回归测试执行"
      - "自动化测试脚本编写"
      - "缺陷跟踪和验证"
    responsibilities:
      - "制定测试策略和测试计划"
      - "设计全面的测试用例覆盖正常和异常场景"
      - "搭建和维护自动化测试框架"
      - "跟踪缺陷生命周期并推动修复"
      - "评估产品质量风险并给出上线建议"

  # --- 新增角色: 运维/SRE 工程师 ---
  - name: "运维/SRE工程师"
    kpis:
      - name: "系统可用性"
        description: "生产服务月度可用时间占比"
        benchmark: "> 99.95%"
      - name: "故障恢复时间"
        description: "P0级故障从发现到恢复的平均时长"
        benchmark: "< 30分钟"
      - name: "部署成功率"
        description: "自动化部署的成功率"
        benchmark: "> 99%"
    pain_points:
      - "线上故障时定位问题耗时过长"
      - "凌晨被 oncall 电话打扰影响生活质量"
      - "手动运维操作多且容易出错"
      - "容量规划不足导致大流量时系统不稳定"
    common_tasks:
      - "线上监控告警配置"
      - "故障应急响应和处理"
      - "CI/CD流水线维护"
      - "容量规划和性能优化"
      - "容器集群管理"
    responsibilities:
      - "保障生产系统的高可用性和稳定性"
      - "建立和完善监控、告警和自动化运维体系"
      - "制定容灾备份方案并定期演练"
      - "优化部署流程和 CI/CD 管道效率"

  # --- 新增角色: UI/UX 设计师 ---
  - name: "UI/UX设计师"
    kpis:
      - name: "设计交付满意度"
        description: "设计和开发团队对设计稿的满意度评分"
        benchmark: "> 4.5/5.0"
      - name: "UI还原度"
        description: "前端实现与设计稿的视觉匹配度"
        benchmark: "> 95%"
      - name: "可用性问题数"
        description: "用户测试中每轮发现的严重可用性问题"
        benchmark: "< 3个"
    pain_points:
      - "产品需求不清晰导致设计方向反复调整"
      - "开发实现与设计稿差异大，还原度不达标"
      - "缺乏用户研究机会，设计方案全靠经验判断"
      - "多平台适配工作量大，设计规范难以统一"
    common_tasks:
      - "用户界面设计"
      - "交互原型制作"
      - "设计系统维护"
      - "可用性测试"
      - "设计规范制定"
    responsibilities:
      - "负责产品视觉设计和交互体验"
      - "建立和维护设计系统与组件库"
      - "进行用户研究和可用性测试"
      - "与开发团队协作确保设计高还原度实现"

  # --- 新增角色: 安全工程师 ---
  - name: "安全工程师"
    kpis:
      - name: "漏洞修复周期"
        description: "高危漏洞从发现到修复的平均天数"
        benchmark: "< 7天"
      - name: "安全事件数"
        description: "每季度发生的安全事件数量"
        benchmark: "< 1次"
      - name: "安全培训覆盖率"
        description: "全员安全培训的完成比例"
        benchmark: "> 90%"
    pain_points:
      - "业务方认为安全措施拖慢开发进度"
      - "安全漏洞被忽略直到出现安全事故"
      - "缺乏自动化安全工具，大量依赖人工检查"
      - "开发团队缺乏安全意识，反复出现同类漏洞"
    common_tasks:
      - "安全漏洞扫描和渗透测试"
      - "安全架构评审"
      - "安全策略制定和基线检查"
      - "安全事件应急响应"
      - "安全培训和意识提升"
    responsibilities:
      - "制定和执行信息安全策略和标准"
      - "定期执行安全评估和渗透测试"
      - "监控和响应安全事件"
      - "推动安全左移，在开发阶段发现和修复漏洞"
      - "建立安全合规体系满足行业监管要求"

# ============================================
# 5. workflows — 核心流程定义（>=2 个流程）
# ============================================
workflows:
  - name: "功能上线流程"
    category: "研发流程"
    steps:
      - step: 1
        name: "需求评审"
        owner: "产品经理"
        deliverables:
          - "评审通过的PRD"
          - "产品原型图"
      - step: 2
        name: "技术设计"
        owner: "技术负责人"
        deliverables:
          - "技术方案文档"
          - "架构设计图"
      - step: 3
        name: "开发实现"
        owner: "研发团队"
        deliverables:
          - "功能代码"
          - "单元测试报告"
      - step: 4
        name: "代码审查"
        owner: "研发团队"
        deliverables:
          - "审查通过的Pull Request"
          - "审查意见记录"
      - step: 5
        name: "测试验证"
        owner: "测试工程师"
        deliverables:
          - "测试报告"
          - "Bug清单"
      - step: 6
        name: "灰度发布"
        owner: "运维/SRE"
        deliverables:
          - "灰度环境部署报告"
          - "灰度数据监控报表"
      - step: 7
        name: "全量上线"
        owner: "运维/SRE"
        deliverables:
          - "上线确认报告"
      - step: 8
        name: "线上监控"
        owner: "运维/SRE"
        deliverables:
          - "线上监控看板"
          - "异常告警规则"
    decision_points:
      - point: "代码审查是否通过？"
        yes: "继续到测试验证"
        no: "返回开发修改后重新审查"
      - point: "灰度数据是否达标？"
        yes: "执行全量上线"
        no: "回滚修复后重新灰度"
    failure_modes:
      - name: "跳过灰度直接全量上线"
        impact: "潜在线上事故风险，故障影响面大"
        prevention: "强制灰度流程作为上线前置条件"
      - name: "测试覆盖不足导致回归Bug"
        impact: "上线后已有功能出现异常"
        prevention: "建立测试覆盖率红线并自动化检查"
      - name: "代码审查流于形式"
        impact: "低质量代码流入主干，积累技术债"
        prevention: "审查清单标准化，设置审查通过率指标"

  - name: "需求管理流程"
    category: "产品流程"
    steps:
      - step: 1
        name: "需求收集"
        owner: "产品经理"
        deliverables:
          - "需求记录表"
      - step: 2
        name: "优先级排序"
        owner: "产品经理"
        deliverables:
          - "优先级排序列表"
      - step: 3
        name: "PRD撰写"
        owner: "产品经理"
        deliverables:
          - "PRD初稿"
      - step: 4
        name: "需求评审"
        owner: "产品经理"
        deliverables:
          - "评审通过的PRD"
      - step: 5
        name: "技术评审"
        owner: "技术负责人"
        deliverables:
          - "技术方案评审结论"
      - step: 6
        name: "进入开发"
        owner: "研发团队"
        deliverables:
          - "开发排期计划"
      - step: 7
        name: "验收上线"
        owner: "产品经理"
        deliverables:
          - "验收确认报告"
          - "上线通知"
    decision_points:
      - point: "是否需要技术评审？"
        yes: "进入技术评审环节"
        no: "直接进入开发阶段"
      - point: "需求评审是否通过？"
        yes: "进入技术评审或开发阶段"
        no: "修改PRD后重新评审"
    failure_modes:
      - name: "需求未经评审直接进入开发"
        impact: "理解和范围偏差导致返工，浪费开发资源"
        prevention: "强制需求评审作为开发前置条件"
      - name: "验收标准不明确导致上线争议"
        impact: "功能上线后业务方不认可，多次返工"
        prevention: "PRD中明确可量化的验收标准并双方确认"

  - name: "数据分析流程"
    category: "数据流程"
    steps:
      - step: 1
        name: "需求沟通"
        owner: "数据分析师"
        deliverables:
          - "分析需求确认文档"
      - step: 2
        name: "数据提取"
        owner: "数据分析师"
        deliverables:
          - "原始数据集"
      - step: 3
        name: "数据清洗"
        owner: "数据分析师"
        deliverables:
          - "清洗后的干净数据集"
      - step: 4
        name: "分析建模"
        owner: "数据分析师"
        deliverables:
          - "分析模型或统计结果"
      - step: 5
        name: "报告输出"
        owner: "数据分析师"
        deliverables:
          - "数据分析报告"
          - "可视化图表"
      - step: 6
        name: "业务落地"
        owner: "业务方"
        deliverables:
          - "落地行动计划"
    decision_points:
      - point: "数据质量是否达标？"
        yes: "进入分析建模阶段"
        no: "返回数据清洗阶段重新处理"
      - point: "分析结果是否确认？"
        yes: "输出正式报告并推动落地"
        no: "返回分析建模阶段调整方法"
    failure_modes:
      - name: "数据口径不一致导致结论偏差"
        impact: "分析结论不可信，业务方不采纳"
        prevention: "分析前统一指标定义和数据口径"
      - name: "分析结果缺乏业务可操作性"
        impact: "报告停留在数据层面，无法推动行动"
        prevention: "分析过程中与业务方保持沟通，确保洞察可落地"

  - name: "敏捷开发Sprint流程"
    category: "研发流程"
    steps:
      - step: 1
        name: "Sprint规划"
        owner: "产品经理 + 研发团队"
        deliverables:
          - "Sprint待办事项列表"
          - "Sprint目标和交付承诺"
      - step: 2
        name: "需求梳理"
        owner: "产品经理"
        deliverables:
          - "细化的用户故事"
          - "任务拆分和估算结果"
      - step: 3
        name: "开发实现"
        owner: "研发团队"
        deliverables:
          - "功能代码"
          - "单元测试"
      - step: 4
        name: "代码审查"
        owner: "研发团队"
        deliverables:
          - "通过的Pull Request"
          - "审查记录"
      - step: 5
        name: "测试验证"
        owner: "QA测试工程师"
        deliverables:
          - "测试报告"
          - "缺陷清单"
      - step: 6
        name: "Sprint评审"
        owner: "产品经理 + 研发团队"
        deliverables:
          - "功能演示"
          - "产品增量"
      - step: 7
        name: "Sprint回顾"
        owner: "Scrum Master"
        deliverables:
          - "回顾会议纪要"
          - "改进行动计划"
    decision_points:
      - point: "Sprint目标是否完成？"
        yes: "进入Sprint评审"
        no: "未完成故事退回Backlog重新排期"
      - point: "代码审查是否通过？"
        yes: "进入测试验证阶段"
        no: "修改后重新提交审查"
    failure_modes:
      - name: "需求范围蔓延（Scope Creep）"
        impact: "Sprint目标无法按时完成，团队加班赶工"
        prevention: "严格限制Sprint中的需求变更，新增需求排入下个Sprint"
      - name: "回顾改进不落地"
        impact: "团队重复犯同样的错误，改进流于形式"
        prevention: "回顾会议产生具体的改进行动，下个Sprint跟踪完成情况"

  - name: "代码审查流程"
    category: "研发流程"
    steps:
      - step: 1
        name: "代码提交"
        owner: "开发工程师"
        deliverables:
          - "功能代码变更"
          - "变更说明描述"
      - step: 2
        name: "分配审查人"
        owner: "开发工程师"
        deliverables:
          - "审查请求通知"
      - step: 3
        name: "代码审查"
        owner: "审查人"
        deliverables:
          - "审查意见列表"
          - "问题标注"
      - step: 4
        name: "修改反馈"
        owner: "开发工程师"
        deliverables:
          - "修改后的代码"
          - "问题回复说明"
      - step: 5
        name: "二次审查"
        owner: "审查人"
        deliverables:
          - "审查通过确认"
      - step: 6
        name: "合并入库"
        owner: "审查人"
        deliverables:
          - "合并提交记录"
    decision_points:
      - point: "审查是否有阻塞性问题？"
        yes: "开发工程师修改后重新审查"
        no: "进入二次审查或合并入库"
      - point: "是否满足代码覆盖率要求？"
        yes: "允许合并"
        no: "补充测试用例后重新提交"
    failure_modes:
      - name: "审查流于形式走马观花"
        impact: "低质量代码合入主干，积累技术债"
        prevention: "审查清单标准化，规定每位审查人的最低审查时间"
      - name: "审查等待时间过长"
        impact: "开发效率降低，上下文切换成本高"
        prevention: "设置SLA目标（如4小时内完成审查），轮换审查人分担负载"

# ============================================
# 6. docs — 文档规范模板（>=3 个模板）
# ============================================
docs:
  - name: "PRD模板"
    task_type: "PRD撰写"
    sections:
      - title: "项目背景与目标"
        prompt_hint: "为什么要做这个功能？解决什么用户痛点？核心指标是什么？"
      - title: "功能范围与边界"
        prompt_hint: "这个版本包含哪些功能？明确不做什么，第一期范围是什么？"
      - title: "用户流程图"
        prompt_hint: "用户从进入到完成核心目标的完整流程，分支路径如何处理？"
      - title: "界面原型描述"
        prompt_hint: "主要页面的布局、交互方式、按钮文案、异常状态说明"
      - title: "验收标准"
        prompt_hint: "满足什么条件算完成？包含正常场景、异常场景和边界条件"
      - title: "上线计划"
        prompt_hint: "灰度策略、上线时间窗口、回滚方案、监控指标"
    tone: "专业，数据驱动，逻辑清晰"
    common_mistakes:
      - "技术细节过多，业务方和研发关注点混淆"
      - "缺少量化验收标准，上线后争议不断"
      - "未区分P0/P1/P2需求优先级，关键功能不突出"
      - "只写了功能列表，缺少用户视角的流程说明"

  - name: "API文档模板"
    task_type: "代码生成"
    sections:
      - title: "接口概述"
        prompt_hint: "接口的用途说明、适用场景和调用方说明"
      - title: "请求方法"
        prompt_hint: "HTTP方法（GET/POST/PUT/DELETE）、请求URL、Headers说明"
      - title: "请求参数"
        prompt_hint: "参数名、类型、是否必填、默认值、示例值、校验规则"
      - title: "响应格式"
        prompt_hint: "成功响应的数据结构、字段说明、类型定义和示例JSON"
      - title: "错误码说明"
        prompt_hint: "所有错误码的定义、含义和排查建议"
      - title: "调用示例"
        prompt_hint: "curl或代码示例，包含请求和响应的完整演示"
    tone: "精确，规范，无歧义"
    common_mistakes:
      - "缺少错误码说明，调用方无法正确处理异常"
      - "示例代码不可运行，缺少必要的上下文环境说明"
      - "未标注废弃字段和兼容性说明，调用方升级困难"
      - "参数校验规则不明确，调用方传参容易出错"

  - name: "技术方案模板"
    task_type: "技术文档"
    sections:
      - title: "背景与目标"
        prompt_hint: "业务需求背景、技术目标、约束条件和成功标准"
      - title: "技术选型对比"
        prompt_hint: "至少2-3种可行方案的对比表格，包含优劣势和适用场景分析"
      - title: "架构设计"
        prompt_hint: "系统模块划分、核心类图/组件图、数据流向和交互时序"
      - title: "关键流程图"
        prompt_hint: "核心业务流程的技术视角序列图，异常流程的处理路径"
      - title: "风险评估"
        prompt_hint: "技术难点、潜在风险、安全合规评估和应对措施"
      - title: "上线方案"
        prompt_hint: "发布策略、灰度计划、回滚方案、监控告警和验证步骤"
    tone: "理性，全面，务实"
    common_mistakes:
      - "技术方案过于简略，只有一个方案没有对比选项"
      - "未考虑回滚方案，出现问题后无法快速恢复"
      - "忽略了非功能需求（性能、安全、可扩展性）"
      - "方案缺乏量化数据支撑，仅凭经验判断"

  - name: "数据分析报告模板"
    task_type: "数据分析"
    sections:
      - title: "分析背景与目的"
        prompt_hint: "为什么做这个分析？业务方想解决什么问题？决策点是什么？"
      - title: "数据说明"
        prompt_hint: "数据来源、时间范围、指标口径定义、数据量说明和局限性"
      - title: "核心发现"
        prompt_hint: "最重要的3-5个数据洞察，用数据可视化图表呈现关键趋势"
      - title: "深入分析"
        prompt_hint: "分维度拆解分析，对比分析、漏斗分析、归因分析等详细方法"
      - title: "结论与建议"
        prompt_hint: "基于数据分析的明确结论，以及可落地的具体行动建议"
    tone: "数据驱动，客观，可执行"
    common_mistakes:
      - "堆砌数据但缺乏洞察，没有提炼出有价值的结论"
      - "结论和建议脱节，建议没有数据支撑和优先级排序"
      - "未说明数据口径和局限，导致结论被轻易质疑"
      - "图表选择不当，信息传递效率低"

  - name: "项目计划模板"
    task_type: "项目管理"
    sections:
      - title: "项目背景与目标"
        prompt_hint: "项目的起因、商业目标和成功标准是什么？关键干系人有哪些？"
      - title: "范围定义"
        prompt_hint: "项目包含的范围和边界，明确不做什么，以及假设和约束条件"
      - title: "工作分解结构"
        prompt_hint: "将项目工作拆分为可管理的任务包，每个任务的负责人、工时和依赖关系"
      - title: "里程碑计划"
        prompt_hint: "关键节点的交付物和时间点，用于度量项目进度"
      - title: "风险登记册"
        prompt_hint: "识别的主要风险、影响程度、发生概率和应对措施，含优先级排序"
    tone: "结构化，可量化，务实"
    common_mistakes:
      - "计划过于详细导致难以维护，与实际偏差越来越大"
      - "风险识别流于形式，没有真正的应对措施"
      - "里程碑之间依赖关系不清晰，一处延迟影响全局"
      - "忽略了沟通计划和干系人管理"

  - name: "测试方案模板"
    task_type: "测试策略"
    sections:
      - title: "测试范围与策略"
        prompt_hint: "本次测试的范围、测试层级（单元/集成/E2E）和测试类型（功能/性能/安全）"
      - title: "测试环境"
        prompt_hint: "测试环境配置、数据准备方案、第三方依赖Mock策略"
      - title: "测试用例设计"
        prompt_hint: "核心功能的测试场景、边界条件、异常流程和预期结果"
      - title: "自动化策略"
        prompt_hint: "哪些用例需要自动化，自动化框架选择和覆盖率目标"
      - title: "缺陷管理"
        prompt_hint: "缺陷等级定义、处理流程、回归策略和上线标准"
    tone: "全面，可操作，严谨"
    common_mistakes:
      - "测试范围过于理想化，时间和资源不足时无法执行"
      - "测试数据准备不充分，耽误测试执行进度"
      - "自动化测试用例维护成本高，频繁变更导致大量失败"
      - "缺陷等级定义不明确，导致关键Bug被忽略"

# ============================================
# 7. follow_up_trees — 追问逻辑树（5 棵树）
# ============================================
follow_up_trees:

  # --- 追问树 1: PRD撰写 ---
  - task_type: "prd_writing"
    root_node_id: "prd_q1"
    nodes:
      prd_q1:
        node_id: "prd_q1"
        question_text: "这个PRD的主要受众是谁？"
        question_type: "single_choice"
        info_key: "prd_audience"
        depth: 1
        options:
          - value: "dev_team"
            label: "研发团队（需要技术细节和实现说明）"
          - value: "management"
            label: "管理层（关注ROI、时间线和商业价值）"
          - value: "cross_dept"
            label: "跨部门协作（涉及运营、市场等多方）"
        children:
          dev_team: "prd_q2_scope"
          management: "prd_q3_mgmt"
          cross_dept: "prd_q4_stakeholders"
        fallback_node_id: "prd_q2_scope"
        is_leaf: false

      prd_q2_scope:
        node_id: "prd_q2_scope"
        question_text: "功能涉及的范围是什么？"
        question_type: "multi_choice"
        info_key: "prd_scope"
        depth: 2
        options:
          - value: "new_feature"
            label: "全新功能"
          - value: "optimization"
            label: "优化改进"
          - value: "migration"
            label: "技术迁移"
        children:
          new_feature: "prd_q5_detail"
          optimization: "prd_q5_detail"
          migration: "prd_q5_detail"
        fallback_node_id: "prd_q5_detail"
        is_leaf: false

      prd_q3_mgmt:
        node_id: "prd_q3_mgmt"
        question_text: "管理层关注的核心目标是什么？"
        question_type: "single_choice"
        info_key: "prd_mgmt_goal"
        depth: 2
        options:
          - value: "revenue"
            label: "提升营收或转化率"
          - value: "efficiency"
            label: "降低运营成本或提升效率"
          - value: "competitive"
            label: "应对竞争或抢占市场份额"
        children:
          revenue: "prd_q6_constraint"
          efficiency: "prd_q6_constraint"
          competitive: "prd_q6_constraint"
        fallback_node_id: "prd_q6_constraint"
        is_leaf: false

      prd_q4_stakeholders:
        node_id: "prd_q4_stakeholders"
        question_text: "涉及哪些协作部门？"
        question_type: "multi_choice"
        info_key: "prd_stakeholders"
        depth: 2
        options:
          - value: "ops"
            label: "运营团队"
          - value: "market"
            label: "市场/营销团队"
          - value: "legal"
            label: "法务/合规团队"
          - value: "cs"
            label: "客服团队"
        children:
          ops: "prd_q7_output"
          market: "prd_q7_output"
          legal: "prd_q7_output"
          cs: "prd_q7_output"
        fallback_node_id: "prd_q7_output"
        is_leaf: false

      prd_q5_detail:
        node_id: "prd_q5_detail"
        question_text: "产品所处的阶段是？"
        question_type: "single_choice"
        info_key: "prd_stage"
        depth: 3
        options:
          - value: "0to1"
            label: "从0到1（全新产品线）"
          - value: "growth"
            label: "快速增长期（快速迭代验证）"
          - value: "mature"
            label: "成熟稳定期（精细化优化）"
        children:
          "0to1": "prd_q6_constraint"
          growth: "prd_q6_constraint"
          mature: "prd_q6_constraint"
        fallback_node_id: "prd_q6_constraint"
        is_leaf: false

      prd_q6_constraint:
        node_id: "prd_q6_constraint"
        question_text: "有哪些已知约束条件？"
        question_type: "multi_choice"
        info_key: "prd_constraints"
        depth: 3
        options:
          - value: "time"
            label: "时间紧迫（deadline压力大）"
          - value: "resource"
            label: "人力不足（团队资源有限）"
          - value: "tech_debt"
            label: "技术债严重（现有代码扩展困难）"
          - value: "compliance"
            label: "合规要求（需满足行业监管）"
        children:
          time: "prd_q7_output"
          resource: "prd_q7_output"
          tech_debt: "prd_q7_output"
          compliance: "prd_q7_output"
        fallback_node_id: "prd_q7_output"
        is_leaf: false

      prd_q7_output:
        node_id: "prd_q7_output"
        question_text: "你希望PRD包含哪些核心部分？"
        question_type: "multi_choice"
        info_key: "prd_sections"
        depth: 4
        options:
          - value: "bg"
            label: "项目背景与目标"
          - value: "scope"
            label: "功能范围与边界"
          - value: "flow"
            label: "用户流程图"
          - value: "ui"
            label: "界面原型描述"
          - value: "acceptance"
            label: "验收标准"
        children: {}
        fallback_node_id: null
        is_leaf: true

  # --- 追问树 2: 代码生成 ---
  - task_type: "code_generation"
    root_node_id: "code_q1"
    nodes:
      code_q1:
        node_id: "code_q1"
        question_text: "你需要生成什么类型的代码？"
        question_type: "single_choice"
        info_key: "code_type"
        depth: 1
        options:
          - value: "api"
            label: "后端API接口"
          - value: "frontend"
            label: "前端页面/组件"
          - value: "script"
            label: "脚本/工具"
          - value: "sql"
            label: "SQL查询"
        children:
          api: "code_q2_tech"
          frontend: "code_q2_tech"
          script: "code_q2_tech"
          sql: "code_q2_tech"
        fallback_node_id: "code_q2_tech"
        is_leaf: false

      code_q2_tech:
        node_id: "code_q2_tech"
        question_text: "使用的技术栈是什么？（语言、框架、版本等）"
        question_type: "text_input"
        info_key: "code_tech_stack"
        depth: 2
        options: []
        children:
          "_any": "code_q3_style"
        fallback_node_id: "code_q3_style"
        is_leaf: false

      code_q3_style:
        node_id: "code_q3_style"
        question_text: "代码风格和质量的偏好是什么？"
        question_type: "multi_choice"
        info_key: "code_style"
        depth: 3
        options:
          - value: "clean"
            label: "简洁清晰（代码易读）"
          - value: "performance"
            label: "性能优先（运行效率优先）"
          - value: "robust"
            label: "健壮防御（全面校验和异常处理）"
          - value: "testable"
            label: "可测试性好（便于写UT和Mock）"
        children:
          clean: "code_q4_env"
          performance: "code_q4_env"
          robust: "code_q4_env"
          testable: "code_q4_env"
        fallback_node_id: "code_q4_env"
        is_leaf: false

      code_q4_env:
        node_id: "code_q4_env"
        question_text: "代码运行的上下文环境是什么？（部署环境、依赖约束等）"
        question_type: "text_input"
        info_key: "code_context"
        depth: 3
        options: []
        children:
          "_any": "code_q5_output"
        fallback_node_id: "code_q5_output"
        is_leaf: false

      code_q5_output:
        node_id: "code_q5_output"
        question_text: "期望的输出格式是什么？"
        question_type: "multi_choice"
        info_key: "code_output"
        depth: 4
        options:
          - value: "code_only"
            label: "纯代码（简洁输出）"
          - value: "with_comment"
            label: "含详细注释"
          - value: "with_test"
            label: "含单元测试"
          - value: "with_doc"
            label: "含使用文档"
        children: {}
        fallback_node_id: null
        is_leaf: true

      code_q6_constraint:
        node_id: "code_q6_constraint"
        question_text: "有什么特殊约束条件？（安全要求、兼容性、性能指标等）"
        question_type: "text_input"
        info_key: "code_constraints"
        depth: 4
        options: []
        children: {}
        fallback_node_id: null
        is_leaf: true

  # --- 追问树 3: 数据分析 ---
  - task_type: "data_analysis"
    root_node_id: "data_q1"
    nodes:
      data_q1:
        node_id: "data_q1"
        question_text: "你需要什么类型的分析？"
        question_type: "single_choice"
        info_key: "analysis_type"
        depth: 1
        options:
          - value: "descriptive"
            label: "描述性分析（发生了什么？）"
          - value: "diagnostic"
            label: "诊断性分析（为什么会发生？）"
          - value: "predictive"
            label: "预测性分析（将会怎样？）"
          - value: "prescriptive"
            label: "建议性分析（该怎么办？）"
        children:
          descriptive: "data_q2_data"
          diagnostic: "data_q2_data"
          predictive: "data_q2_data"
          prescriptive: "data_q2_data"
        fallback_node_id: "data_q2_data"
        is_leaf: false

      data_q2_data:
        node_id: "data_q2_data"
        question_text: "数据来源和格式是什么？"
        question_type: "text_input"
        info_key: "data_source"
        depth: 2
        options: []
        children:
          "_any": "data_q3_dim"
        fallback_node_id: "data_q3_dim"
        is_leaf: false

      data_q3_dim:
        node_id: "data_q3_dim"
        question_text: "关注哪些分析维度？"
        question_type: "multi_choice"
        info_key: "data_dimensions"
        depth: 3
        options:
          - value: "user"
            label: "用户行为（活跃、留存、转化）"
          - value: "revenue"
            label: "营收/收入（GMV、ARPU、利润率）"
          - value: "product"
            label: "产品功能（使用率、功能渗透）"
          - value: "operation"
            label: "运营效率（成本、人效、ROI）"
        children:
          user: "data_q4_output"
          revenue: "data_q4_output"
          product: "data_q4_output"
          operation: "data_q4_output"
        fallback_node_id: "data_q4_output"
        is_leaf: false

      data_q4_output:
        node_id: "data_q4_output"
        question_text: "分析结果的呈现方式是什么？"
        question_type: "single_choice"
        info_key: "data_output"
        depth: 3
        options:
          - value: "dashboard"
            label: "BI看板（实时可视化展示）"
          - value: "report"
            label: "分析报告（结构化文档）"
          - value: "insight"
            label: "关键洞察（一句话结论）"
          - value: "presentation"
            label: "汇报PPT（面向管理层）"
        children:
          dashboard: "data_q5_detail"
          report: "data_q5_detail"
          insight: "data_q5_detail"
          presentation: "data_q5_detail"
        fallback_node_id: "data_q5_detail"
        is_leaf: false

      data_q5_detail:
        node_id: "data_q5_detail"
        question_text: "有哪些特殊分析要求？"
        question_type: "multi_choice"
        info_key: "data_special"
        depth: 4
        options:
          - value: "comparison"
            label: "同比/环比对比分析"
          - value: "segment"
            label: "用户分层/分群分析"
          - value: "funnel"
            label: "漏斗转化分析"
          - value: "cohort"
            label: "Cohort留存分析"
        children: {}
        fallback_node_id: null
        is_leaf: true

      data_q6_goal:
        node_id: "data_q6_goal"
        question_text: "分析的最终目的是什么？"
        question_type: "single_choice"
        info_key: "data_goal"
        depth: 2
        options:
          - value: "exploration"
            label: "探索性发现（在数据中找趋势和模式）"
          - value: "reporting"
            label: "定期汇报（按固定指标出报表）"
          - value: "decision"
            label: "决策支持（为具体问题提供数据依据）"
        children:
          exploration: "data_q2_data"
          reporting: "data_q2_data"
          decision: "data_q2_data"
        fallback_node_id: "data_q2_data"
        is_leaf: false

  # --- 追问树 4: 技术文档 ---
  - task_type: "tech_doc"
    root_node_id: "doc_q1"
    nodes:
      doc_q1:
        node_id: "doc_q1"
        question_text: "需要写什么类型的技术文档？"
        question_type: "single_choice"
        info_key: "doc_type"
        depth: 1
        options:
          - value: "api_doc"
            label: "API接口文档"
          - value: "design_doc"
            label: "技术设计文档"
          - value: "user_guide"
            label: "用户操作手册"
          - value: "runbook"
            label: "运维手册/Runbook"
        children:
          api_doc: "doc_q2_audience"
