# ============================================
# 2. terms — 行业术语表（>=60 条）
# ============================================
terms:
  # --- 销售指标类（10 条） ---
  - term: "转化率"
    category: "销售指标"
    definition: "完成购买或目标行为的用户数占进入销售流程总用户数的比例，衡量从流量到成交的转化效率，电商场景指访问-下单转化率，门店指进店-成交转化率。"
    aliases: ["Conversion Rate", "CVR", "转化"]
    usage_context: "销售经理和电商运营日常监控，用于识别销售漏斗瓶颈环节并制定优化策略"
    related_terms: ["销售漏斗", "客单价", "成交率"]

  - term: "客单价"
    category: "销售指标"
    definition: "每位顾客单次消费的平均金额，计算方式为总销售额除以总交易笔数，反映顾客的消费能力和产品搭配水平。"
    aliases: ["Average Transaction Value", "ATV", "单均消费"]
    usage_context: "零售店长和运营经理评估销售质量和连带销售效果，客单价提升直接带动营业额增长"
    related_terms: ["连带率", "客件数", "AOV"]

  - term: "复购率"
    category: "销售指标"
    definition: "在一定周期内再次购买的用户占全部购买用户的比例，衡量客户忠诚度和产品粘性，是评估客户长期价值的关键指标。"
    aliases: ["Repeat Purchase Rate", "回购率", "二次购买率"]
    usage_context: "客户管理团队评估会员运营和客户留存策略效果，复购率提升意味着客户生命周期价值增加"
    related_terms: ["LTV", "沉默客户", "会员体系"]

  - term: "客流量"
    category: "销售指标"
    definition: "统计周期内进入门店或访问线上店铺的用户总数量，是衡量门店位置价值和线上引流效果的基础流量指标。"
    aliases: ["Customer Traffic", "流量", "进店人数"]
    usage_context: "店铺运营团队评估选址效果、营销活动引流能力和时段客流分布规律"
    related_terms: ["转化率", "客单价", "坪效"]

  - term: "连带率"
    category: "销售指标"
    definition: "单笔交易中购买的商品件数，计算方式为总销售件数除以总交易笔数，反映销售人员的推荐和搭配能力。"
    aliases: ["Attachment Rate", "连单率", "客件数"]
    usage_context: "门店销售管理和培训中用于评估导购的搭配推荐能力，连带率越高说明一客多买效果越好"
    related_terms: ["客单价", "客件数", "销售话术设计"]

  - term: "成交率"
    category: "销售指标"
    definition: "成功完成交易的顾客数占全部进店或咨询顾客数的比例，直接反映销售团队的攻单能力和产品吸引力。"
    aliases: ["Close Rate", "成交转化率", "签单率"]
    usage_context: "销售经理评估团队每日销售表现，成交率低需要分析是产品问题还是销售技巧问题"
    related_terms: ["转化率", "销售漏斗", "销售话术设计"]

  - term: "客诉率"
    category: "销售指标"
    definition: "产生投诉的客户数占总服务客户数的比例，反映产品质量、服务水平和客户满意度的重要反向指标。"
    aliases: ["Complaint Rate", "投诉率", "客户投诉率"]
    usage_context: "客户服务和品质管理部门监控服务质量，客诉率异常升高需要立即排查产品和服务问题"
    related_terms: ["客户满意度", "退货率", "流失预警"]

  - term: "退货率"
    category: "销售指标"
    definition: "退货订单数占总订单数的比例，电商和零售行业衡量产品满意度、描述准确性和售后成本的通用指标。"
    aliases: ["Return Rate", "退款率", "逆向率"]
    usage_context: "电商运营和品类经理评估产品描述准确性和质量，高退货率意味着需要优化页面描述或改善品控"
    related_terms: ["客诉率", "毛利率", "电商详情页文案"]

  - term: "毛利率"
    category: "销售指标"
    definition: "销售收入减去销售成本后的毛利占销售收入的比例，反映产品或业务的盈利能力和定价策略的有效性。"
    aliases: ["Gross Margin", "毛利", "毛利额"]
    usage_context: "品类采购经理和财务团队评估产品盈利能力，毛利率过低需要调整定价或优化采购成本"
    related_terms: ["促销ROI", "GMV", "供应链优化方案"]

  - term: "坪效"
    category: "销售指标"
    definition: "门店每平方米面积创造的年销售额，衡量门店空间利用效率和经营质量的核心零售指标。"
    aliases: ["Sales per Square Foot", "面积效率", "平效"]
    usage_context: "零售店长和运营管理层评估门店布局效率和陈列效果，坪效提升需要优化商品陈列和动线设计"
    related_terms: ["客单价", "客流量", "陈列(VMD)"]

  # --- 电商指标类（10 条） ---
  - term: "GMV"
    category: "电商指标"
    definition: "商品交易总额（Gross Merchandise Volume），统计周期内电商平台或店铺达成的所有订单总金额，含已付款和未付款订单的营收规模指标。"
    aliases: ["商品交易总额", "总交易额", "成交总额"]
    usage_context: "电商运营和管理层评估平台或店铺整体营收规模，GMV增长反映业务扩张速度"
    related_terms: ["ROI", "客单价", "销售额完成率"]

  - term: "ROI"
    category: "电商指标"
    definition: "投资回报率（Return on Investment），销售活动中投入产出比，计算方式为(产出收益-投入成本)/投入成本，衡量营销和促销活动盈利效率。"
    aliases: ["投资回报率", "投产比", "ROAS"]
    usage_context: "市场增长经理和电商运营评估广告投放和促销活动的资金使用效率，ROI>1表示活动盈利"
    related_terms: ["促销ROI", "CAC", "流量成本"]

  - term: "LTV"
    category: "电商指标"
    definition: "客户生命周期价值（Lifetime Value），单个客户在与品牌合作全周期内贡献的总利润现值，决定可接受的获客成本和留存投入上限。"
    aliases: ["客户生命周期价值", "CLV", "全生命周期价值"]
    usage_context: "客户管理和增长团队评估获客和留存预算分配，LTV>CAC是健康的商业模式"
    related_terms: ["CAC", "复购率", "会员体系"]

  - term: "CAC"
    category: "电商指标"
    definition: "获客成本（Customer Acquisition Cost），获取一位新客户所花费的营销和销售总成本，包含广告费、渠道佣金、销售人力等综合成本。"
    aliases: ["Customer Acquisition Cost", "获客成本", "客获成本"]
    usage_context: "增长团队和财务部门评估各渠道获客效率，CAC需低于LTV的三分之一才具可持续性"
    related_terms: ["LTV", "ROI", "流量成本"]

  - term: "客件数"
    category: "电商指标"
    definition: "每位顾客单次购买的平均商品数量，电商场景中指每笔订单包含的商品件数，反映商品搭配和促销策略的效果。"
    aliases: ["Items per Transaction", "件单价", "笔均件数"]
    usage_context: "电商运营通过搭配推荐和满减策略提升客件数，客件数增长直接带动GMV提升"
    related_terms: ["连带率", "客单价", "AOV"]

  - term: "渗透率"
    category: "电商指标"
    definition: "在某特定市场或客群中使用产品或品牌的目标用户比例，衡量品牌在目标市场中的覆盖广度和增长潜力。"
    aliases: ["Penetration Rate", "市场渗透率", "品牌渗透率"]
    usage_context: "市场增长经理评估品牌在各区域和客群中的占有率，低渗透率意味着增长空间大"
    related_terms: ["客户分群", "渠道运营优化", "会员运营方案"]

  - term: "购物车放弃率"
    category: "电商指标"
    definition: "将商品加入购物车但未完成支付的用户占全部加购用户的比例，衡量支付流程效率和用户购买意愿的重要电商指标。"
    aliases: ["Cart Abandonment Rate", "弃单率", "加购未付款率"]
    usage_context: "电商运营评估结账流程和支付体验，高放弃率需要优化结算流程、运费政策或增加支付方式"
    related_terms: ["转化率", "电商详情页文案", "客户分群"]

  - term: "AOV"
    category: "电商指标"
    definition: "平均订单金额（Average Order Value），所有订单的平均金额，是衡量定价策略和促销效果的基础电商指标。"
    aliases: ["平均订单金额", "Average Order Value", "笔单价"]
    usage_context: "电商运营评估满减门槛设置是否合理，通过捆绑销售和升级推荐提升AOV"
    related_terms: ["客单价", "GMV", "连带率"]

  - term: "流量成本"
    category: "电商指标"
    definition: "获取单次流量（一次访问或一个点击）所花费的平均营销成本，包含搜索广告、信息流广告、KOL投放等渠道费用分摊。"
    aliases: ["Traffic Cost", "单次曝光成本", "CPC"]
    usage_context: "电商运营和市场经理评估各流量渠道的性价比，流量成本上涨时需要调整投放策略和渠道组合"
    related_terms: ["CAC", "ROI", "渗透率"]

  - term: "点击率"
    category: "电商指标"
    definition: "广告或商品链接被点击的次数占其曝光次数的比例（CTR），衡量创意吸引力、投放精准度和用户兴趣匹配度的核心指标。"
    aliases: ["CTR", "Click-Through Rate", "点曝率"]
    usage_context: "电商运营和广告投放团队评估主图、标题和广告创意的吸引力，CTR低需要优化视觉和文案"
    related_terms: ["转化率", "流量成本", "电商详情页文案"]

  # --- CRM/客户管理类（8 条） ---
  - term: "RFM分析"
    category: "客户管理"
    definition: "基于最近购买时间（Recency）、购买频率（Frequency）和消费金额（Monetary）三个维度分析客户价值的经典模型，用于客户分群和差异化运营。"
    aliases: ["RFM模型", "RFM评分", "Recency/Frequency/Monetary"]
    usage_context: "CRM和运营团队对客户进行分层管理，高R高F高M客户为重点维护对象，低R低F低M客户需促活唤醒"
    related_terms: ["客户分群", "客户生命周期", "会员运营方案"]

  - term: "线索评分"
    category: "客户管理"
    definition: "根据潜在客户的属性特征和行为数据对其购买意向和价值进行量化打分的过程，帮助销售人员优先跟进高意向客户。"
    aliases: ["Lead Scoring", "潜客评分", "线索评级"]
    usage_context: "销售和CRM团队对销售线索自动评分排序，高评分线索优先分配给资深销售跟进"
    related_terms: ["商机管理", "销售漏斗", "客户分群"]

  - term: "客户分群"
    category: "客户管理"
    definition: "根据客户的人口属性、行为特征、消费偏好和生命周期阶段将客户划分为不同群体的分析方法和运营策略。"
    aliases: ["Customer Segmentation", "客群细分", "客群分层"]
    usage_context: "市场和运营团队针对不同客群制定差异化营销策略，提升营销精准度和资源利用效率"
    related_terms: ["RFM分析", "客户生命周期", "精准营销"]

  - term: "客户生命周期"
    category: "客户管理"
    definition: "客户从初次接触到品牌、完成首购、持续复购到最终流失的全过程阶段划分，通常包括潜客、新客、活跃、沉默和流失五个阶段。"
    aliases: ["Customer Lifecycle", "客户全周期", "客户旅程"]
    usage_context: "CRM团队根据客户所处阶段制定对应的运营策略，不同阶段匹配不同的促活留存手段"
    related_terms: ["客户分群", "流失预警", "沉默客户"]

  - term: "沉默客户"
    category: "客户管理"
    definition: "超过一定周期（通常90-180天）未产生购买行为的已有客户，处于流失边缘需要及时唤醒激活的客户群体。"
    aliases: ["Dormant Customer", "休眠客户", "静默客户"]
    usage_context: "会员运营团队重点激活对象，通过优惠券、新品推荐和专属活动唤醒沉默客户重新购买"
    related_terms: ["客户生命周期", "流失预警", "会员运营方案"]

  - term: "流失预警"
    category: "客户管理"
    definition: "通过分析客户行为数据（如访问频次下降、客单价降低、投诉增加）提前识别可能即将流失的客户并触发干预机制的预测模型。"
    aliases: ["Churn Warning", "流失预测", "流失预警模型"]
    usage_context: "客户成功团队在客户流失前主动干预，通过优惠激励和专属服务挽回即将流失的客户"
    related_terms: ["沉默客户", "客户生命周期", "复购率"]

  - term: "精准营销"
    category: "客户管理"
    definition: "基于客户数据分析和分群结果，在合适的时间通过合适的渠道向合适的客户推送个性化的营销内容和优惠信息的营销方法。"
    aliases: ["Targeted Marketing", "精准投放", "定向营销"]
    usage_context: "市场和运营团队利用客户标签和画像进行精准推送，提高营销转化率同时减少对非目标客户的打扰"
    related_terms: ["客户分群", "私域流量", "会员体系"]

  - term: "私域流量"
    category: "客户管理"
    definition: "品牌自有的、可反复触达和运营的客户流量池，通常沉淀在企业微信、公众号、小程序、APP等自有渠道中，无需持续付费。"
    aliases: ["Private Domain Traffic", "私域", "自有流量池"]
    usage_context: "品牌和零售商通过私域流量降低对电商平台和广告的依赖，实现低成本反复触达和深度运营"
    related_terms: ["精准营销", "会员体系", "渠道运营优化"]

  # --- 供应链/零售运营类（8 条） ---
  - term: "库存周转率"
    category: "供应链管理"
    definition: "在一定周期内库存商品被销售并补充的次数，计算方式为销售成本除以平均库存金额，衡量库存管理效率和资金使用效率。"
    aliases: ["库存周转", "Inventory Turnover", "库存周转次数"]
    usage_context: "品类采购经理和供应链团队评估库存健康度，高周转率意味着资金利用效率高，太低则存在积压风险"
    related_terms: ["缺货率", "库龄", "安全库存"]

  - term: "SCM"
    category: "供应链管理"
    definition: "供应链管理（Supply Chain Management），对从原材料采购、生产制造、仓储配送到终端销售的全链条进行计划、协调和优化的管理方法。"
    aliases: ["供应链管理", "Supply Chain Management", "供应管理"]
    usage_context: "供应链经理和采购团队协调供应商、仓库和门店之间的物流和信息流，提升整体供应链效率"
    related_terms: ["供应链协同", "订货点", "库存周转率"]

  - term: "缺货率"
    category: "供应链管理"
    definition: "库存无法满足客户需求的比率，计算方式为缺货SKU数占总SKU数的比例或缺货天数占总销售天数的比例。"
    aliases: ["Stockout Rate", "断货率", "缺货比例"]
    usage_context: "品类经理和门店运营监控热销商品的库存状态，缺货率高直接影响销售机会和客户满意度"
    related_terms: ["库存周转率", "安全库存", "补货"]

  - term: "动销率"
    category: "供应链管理"
    definition: "在一定周期内有销售记录的商品SKU数占全部SKU数的比例，反映商品品类的整体销售活跃度和选品质量。"
    aliases: ["Sell-Through Rate", "动销比例", "SKU活跃度"]
    usage_context: "品类采购经理评估选品效果和品类结构，动销率低的品类需要优化SKU组合或清理滞销品"
    related_terms: ["库存周转率", "缺货率", "商品选品分析"]

  - term: "库龄"
    category: "供应链管理"
    definition: "商品在仓库中存放的时间长度，通常以天或月为单位计算，反映商品从入库到出库的仓储周期长短。"
    aliases: ["Inventory Age", "库存龄", "库存天数"]
    usage_context: "仓储管理和采购团队监控库存老化情况，库龄过长意味着商品滞销需打折清仓或退货处理"
    related_terms: ["库存周转率", "损耗率", "盘点"]

  - term: "安全库存"
    category: "供应链管理"
    definition: "为应对需求波动和供应不确定性而设置的额外库存缓冲量，在正常补货周期之外保留的库存量以防断货风险。"
    aliases: ["Safety Stock", "缓冲库存", "保险库存"]
    usage_context: "供应链计划和采购团队根据历史销售波动和供应商交货稳定性计算安全库存水平"
    related_terms: ["缺货率", "订货点", "库存周转率"]

  - term: "订货点"
    category: "供应链管理"
    definition: "库存降低到需要触发补货的阈值水平，当库存量达到订货点时自动生成采购订单，确保在安全库存耗尽前新货到达。"
    aliases: ["Reorder Point", "补货点", "再订货点"]
    usage_context: "供应链和门店运营设置自动补货参数，订货点=日均销量×补货周期+安全库存"
    related_terms: ["安全库存", "补货", "缺货率"]

  - term: "供应链协同"
    category: "供应链管理"
    definition: "供应链各环节企业（供应商、制造商、物流商、零售商之间）通过信息共享、计划同步和流程对接实现高效协作的管理模式。"
    aliases: ["Supply Chain Collaboration", "供应链协作", "协同供应"]
    usage_context: "供应链经理推动上下游企业数据互通和计划协同，减少牛鞭效应和库存冗余"
    related_terms: ["SCM", "库存周转率", "供应商评估"]

  # --- 市场营销/促销类（10 条） ---
  - term: "促销ROI"
    category: "市场营销"
    definition: "促销活动投入产出比，评估促销活动效果的综合性财务指标，计算方式为(促销带来的增量毛利-促销投入成本)/促销投入成本。"
    aliases: ["Promotion ROI", "促销回报率", "活动ROI"]
    usage_context: "市场经理和电商运营在大促后评估活动效果，用于判断各渠道和促销机制的投入效率"
    related_terms: ["ROI", "满减", "秒杀"]

  - term: "满减"
    category: "市场营销"
    definition: "消费者购买商品达到一定金额后可减免部分价款的促销方式（如满200减30），是电商和零售最常用的提升客单价的促销手段。"
    aliases: ["Spend-and-Save", "满减活动", "满额减"]
    usage_context: "电商运营设置促销门槛引导消费者凑单提升客单价，满减门槛设计直接影响活动效果和毛利"
    related_terms: ["促销ROI", "客单价", "秒杀"]

  - term: "秒杀"
    category: "市场营销"
    definition: "限时限量的超低价促销活动，在极短时间内以大幅折扣限量销售热门商品，制造紧迫感快速拉动流量和转化。"
    aliases: ["Flash Sale", "限时抢购", "秒杀活动"]
    usage_context: "电商运营在大促期间或新品首发时使用，快速聚集流量和提升转化率，但需控制库存避免超卖"
    related_terms: ["促销ROI", "满减", "裂变营销"]

  - term: "裂变营销"
    category: "市场营销"
    definition: "通过现有用户社交分享驱动新用户增长的营销方式（如拼团、砍价、邀请有礼），利用社交关系链实现低成本获客。"
    aliases: ["Viral Marketing", "社交裂变", "裂变增长"]
    usage_context: "增长团队在获客成本上升时采用，利用老带新机制降低CAC，适合社交电商和私域运营场景"
    related_terms: ["CAC", "私域流量", "KOL营销"]

  - term: "KOL营销"
    category: "市场营销"
    definition: "与关键意见领袖（Key Opinion Leader）合作推广品牌或产品，利用其在特定领域的影响力和粉丝信任度提升品牌认知和转化。"
    aliases: ["KOL Marketing", "达人营销", "网红推广"]
    usage_context: "品牌市场和电商团队在新品上市或品牌推广时选择匹配的KOL合作，需评估粉丝画像和带货能力"
    related_terms: ["内容营销", "裂变营销", "ROI"]

  - term: "内容营销"
    category: "市场营销"
    definition: "通过创建和分发有价值的、相关的内容（图文、视频、直播等）吸引和留住目标用户，最终驱动用户采取盈利行为的营销策略。"
    aliases: ["Content Marketing", "内容运营", "内容种草"]
    usage_context: "品牌团队通过小红书笔记、抖音短视频、直播等内容形式建立品牌认知和用户信任，长期影响购买决策"
    related_terms: ["KOL营销", "私域流量", "电商详情页文案"]

  - term: "会员体系"
    category: "市场营销"
    definition: "基于会员等级、积分、权益和成长机制设计的客户忠诚度管理系统，通过差异化权益激励客户持续复购和升级消费。"
    aliases: ["Membership System", "会员制度", "会员计划"]
    usage_context: "零售和电商品牌建立会员分层体系，不同等级会员享受不同折扣、积分倍率和专属权益"
    related_terms: ["积分体系", "复购率", "会员运营方案"]

  - term: "积分体系"
    category: "市场营销"
    definition: "消费者通过购买商品、参与活动等方式积累积分，积分可用于抵扣现金、兑换礼品或升级会员等级的忠诚度激励机制。"
    aliases: ["Points System", "积分制度", "积分计划"]
    usage_context: "会员运营团队设置积分获取和消耗规则，积分体系完善度直接影响会员活跃度和留存率"
    related_terms: ["会员体系", "复购率", "会员运营方案"]

  - term: "大促活动"
    category: "市场营销"
    definition: "年度大型集中促销活动（如双11、618、年货节等），平台和商家投入大量营销资源，在短期内集中释放优惠以达成爆发式销售增长。"
    aliases: ["大促", "购物节", "促销节点"]
    usage_context: "电商运营和品牌团队提前1-2个月筹备大促活动，涉及备货、定价、推广、客服和物流全链路规划"
    related_terms: ["促销ROI", "秒杀", "年度销售计划"]

  - term: "直播带货"
    category: "市场营销"
    definition: "通过实时视频直播形式展示和销售商品，主播实时互动讲解产品卖点并引导观众下单购买的新型电商销售模式。"
    aliases: ["Live Streaming", "直播电商", "直播销售"]
    usage_context: "电商和品牌团队搭建直播间或合作达人直播，通过限时优惠和互动氛围促进即时转化"
    related_terms: ["KOL营销", "内容营销", "转化率"]

  # --- 销售流程类（6 条） ---
  - term: "销售漏斗"
    category: "销售流程"
    definition: "从潜在客户认知品牌到最终成交的全过程分层模型，通常分为认知、兴趣、考虑、意向、评估、成交等阶段，各阶段逐步筛选过滤客户。"
    aliases: ["Sales Funnel", "销售管道", "销售渠道漏斗"]
    usage_context: "销售经理管理团队客户跟进进度，通过漏斗分析识别各环节转化率并找出流失最严重的阶段"
    related_terms: ["转化率", "商机管理", "线索评分"]

  - term: "商机管理"
    category: "销售流程"
    definition: "对从线索识别到成交关闭的销售机会进行全流程跟踪和管理的过程，包括商机评估、跟进策略制定、竞争分析和赢单预测。"
    aliases: ["Opportunity Management", "销售机会管理", "商机跟进"]
    usage_context: "销售团队使用CRM系统记录和跟踪每个商机状态，确保高价值商机得到优先资源和及时跟进"
    related_terms: ["销售漏斗", "线索评分", "跟单"]

  - term: "跟单"
    category: "销售流程"
    definition: "从客户表达购买意向到最终成交的全程跟进服务，包括报价、议价、合同确认、订单处理和付款催收等环节的持续沟通和推动。"
    aliases: ["Order Follow-up", "订单跟进", "客户跟进"]
    usage_context: "销售或跟单人员在交易关键期持续跟进客户，及时处理客户的疑问和异议以推动成交"
    related_terms: ["商机管理", "回款", "销售话术设计"]

  - term: "回款"
    category: "销售流程"
    definition: "销售完成后向客户收取货款的过程，包含账期管理、发票开具、催收跟进和逾期处理等环节，直接影响企业现金流健康度。"
    aliases: ["Payment Collection", "收款", "货款回收"]
    usage_context: "销售经理和财务团队跟踪应收账款，回款率是评估销售质量和客户信用的重要指标"
    related_terms: ["跟单", "渠道管理", "年度销售计划"]

  - term: "渠道管理"
    category: "销售流程"
    definition: "对销售渠道（线上平台、线下门店、经销商、代理商等）进行选择、激励、评估和优化的系统性管理工作，确保各渠道高效协同。"
    aliases: ["Channel Management", "通路管理", "渠道运营"]
    usage_context: "销售总监和渠道经理管理多通路销售体系，平衡各渠道利益避免渠道冲突，最大化全渠道销售效率"
    related_terms: ["经销商管理", "渠道运营优化", "渠道冲突"]

  - term: "经销商管理"
    category: "销售流程"
    definition: "对经销商的招募筛选、合同管理、库存管理、价格维护、市场支持和绩效评估的全过程管理，确保经销商合规运营并达成销售目标。"
    aliases: ["Dealer Management", "代理管理", "分销管理"]
    usage_context: "渠道经理和区域销售负责人管理经销商网络，定期评估经销商绩效并制定改善计划"
    related_terms: ["渠道管理", "回款", "缺货率"]

  # --- 门店运营类（8 条） ---
  - term: "巡店"
    category: "门店运营"
    definition: "管理人员定期到门店现场检查运营状况、商品陈列、员工服务质量和环境卫生的日常管理活动，是保证门店标准化运营的重要手段。"
    aliases: ["Store Inspection", "巡场", "门店巡查"]
    usage_context: "区域经理和运营督导定期巡店检查标准执行情况，巡店结果纳入门店绩效考核"
    related_terms: ["陈列(VMD)", "店铺运营报告", "排班"]

  - term: "排班"
    category: "门店运营"
    definition: "根据客流预测和业务需求，合理安排门店员工的工作时间和岗位分配，在保障服务质量的前提下控制人力成本。"
    aliases: ["Staff Scheduling", "班次安排", "排岗"]
    usage_context: "店长根据客流高峰期和平峰期合理安排人员，需兼顾员工休息权益和运营效率"
    related_terms: ["巡店", "收银效率", "客流量"]

  - term: "陈列(VMD)"
    category: "门店运营"
    definition: "视觉营销（Visual Merchandising），通过商品陈列布局、橱窗设计、灯光搭配和动线规划提升商品吸引力和顾客购买欲望的综合性视觉管理技术。"
    aliases: ["Visual Merchandising", "视觉陈列", "VMD"]
    usage_context: "陈列师和门店运营团队按照品牌标准进行商品陈列，好的VMD能直接提升进店率和客单价"
    related_terms: ["坪效", "客单价", "连带率"]

  - term: "补货"
    category: "门店运营"
    definition: "当门店或仓库库存低于设定阈值时向仓库或供应商发起商品补充的过程，确保货架不断货、不缺品。"
    aliases: ["Replenishment", "上货", "货品补充"]
    usage_context: "门店员工和供应链团队根据销售速度和库存水平及时补货，节假日和促销前需加大补货频次"
    related_terms: ["订货点", "缺货率", "安全库存"]

  - term: "盘点"
    category: "门店运营"
    definition: "对门店或仓库的实际库存商品进行逐一清点和核对的过程，核实账面库存与实际库存是否一致，发现差异并查明原因。"
    aliases: ["Inventory Count", "库存盘点", "盘库"]
    usage_context: "门店和财务团队定期（月度/季度/年度）进行盘点，盘点差异需分析原因并调整账面库存"
    related_terms: ["损耗率", "库存周转率", "库龄"]

  - term: "损耗率"
    category: "门店运营"
    definition: "商品在运输、仓储和销售过程中因破损、过期、被盗等原因造成的损失占全部商品价值的比例，是门店运营效率的关键反向指标。"
    aliases: ["Shrinkage Rate", "损耗", "货损率"]
    usage_context: "门店经理和防损团队监控损耗率，通过加强安保、优化仓储和减少过期处理来降低损耗"
    related_terms: ["盘点", "毛利率", "供应链优化方案"]

  - term: "收银效率"
    category: "门店运营"
    definition: "收银台处理顾客结账的速度和服务能力，包含单笔交易处理时间、排队等待时长和支付方式多样性的综合效率指标。"
    aliases: ["Checkout Efficiency", "收银速度", "结账效率"]
    usage_context: "门店运营评估收银台配置和人员培训效果，高峰期效率低下会导致顾客流失和差评"
    related_terms: ["客流量", "排班", "客单价"]

  - term: "会员管理"
    category: "门店运营"
    definition: "对会员信息采集、积分记录、等级维护、权益发放和互动沟通的全流程管理，是门店进行精准营销和客户留存的基础运营工作。"
    aliases: ["Member Management", "会员维护", "会员运营"]
    usage_context: "门店运营团队通过会员管理系统记录消费行为和偏好，向会员推送专属优惠和活动信息"
    related_terms: ["会员体系", "积分体系", "复购率"]

# ============================================
# 3. tasks — 任务场景定义（12 个场景）
# ============================================
tasks:
  - name: "促销方案策划"
    description: >
      针对特定商品或品类，设计包含促销目标、活动规则、预算分配、
      执行计划和效果预估的完整促销方案。需要结合销售数据分析确定
      促销时机和力度，平衡销售额增长与利润之间的关系。
    typical_output: >
      促销方案文档（含活动主题、目标客群、促销机制、预算明细、
      执行时间表、效果预估指标和风险预案）
    complexity: "medium"
    frequency: "high"
    follow_up_tree: "promo_planning"

  - name: "销售数据分析"
    description: >
      对销售数据进行系统性分析，包括销售额趋势分析、品类结构分析、
      区域对比分析、销售预测和异常定位。发现销售增长机会和问题点，
      为销售策略调整和管理决策提供数据支撑。
    typical_output: >
      销售数据分析报告，含关键指标看板、趋势图表、品类结构分析、
      区域对比、异常预警和改善建议
    complexity: "medium"
    frequency: "very_high"
    follow_up_tree: "sales_data_analysis"

  - name: "客户分群策略"
    description: >
      基于客户消费行为、人口属性和偏好特征，运用RFM分析等方法
      将客户划分为不同价值群体，制定差异化运营策略。明确各客群的
      优先级、触达策略和资源分配方案。
    typical_output: >
      客户分群方案（含分群维度说明、客群画像、规模占比、价值评估
      和各客群运营策略建议）
    complexity: "medium"
    frequency: "high"
    follow_up_tree: "customer_segmentation"

  - name: "渠道运营优化"
    description: >
      对线上线下各销售渠道（电商平台、门店、私域、经销商等）的
      运营效率进行评估和分析，找出瓶颈和改进机会，优化渠道组合
      和资源配置，实现全渠道协同增效。
    typical_output: >
      渠道运营优化方案，含渠道效率评估、问题诊断、优化建议、
      资源配置调整计划和预期效果
    complexity: "medium"
    frequency: "medium"
    follow_up_tree: "channel_optimization"

  - name: "商品选品分析"
    description: >
      基于历史销售数据、市场趋势和竞争分析，对商品品类结构和
      单品进行评估和筛选，确定引入新品、淘汰滞销品和优化品类
      组合的策略，提升整体品类健康度和盈利能力。
    typical_output: >
      选品分析报告（含品类结构分析、SKU健康度评估、新品引入
      建议、滞销品淘汰清单和品类优化路线图）
    complexity: "high"
    frequency: "high"
    follow_up_tree: "product_selection"

  - name: "店铺运营报告"
    description: >
      汇总门店或线上店铺的核心运营数据，生成周期性的运营报告，
      涵盖销售额、客流量、转化率、客单价、库存状态和人员表现等
      关键维度，全面反映店铺运营健康度。
    typical_output: >
      店铺运营报告（含核心指标概览、数据趋势图、问题诊断、
      原因分析和改善行动清单）
    complexity: "low"
    frequency: "high"
    follow_up_tree: "store_ops_report"

  - name: "电商详情页文案"
    description: >
      撰写电商平台商品详情页的营销文案，包括商品标题、卖点提炼、
      详情描述、参数说明和用户问答等内容，通过有说服力的文案
      提升商品转化率和搜索排名。
    typical_output: >
      商品详情页文案（含主标题、副标题、核心卖点、详细描述、
      参数规格、使用场景、常见问答和下单引导话术）
    complexity: "low"
    frequency: "very_high"
    follow_up_tree: "product_page_copy"

  - name: "会员运营方案"
    description: >
      设计会员全生命周期运营策略，包括会员招募机制、成长路径、
      积分和权益体系、分层运营策略和流失召回方案，提升会员活跃度、
      留存率和生命周期价值。
    typical_output: >
      会员运营方案（含会员体系设计、等级权益、积分规则、
      分层运营策略、触达计划和效果预估指标）
    complexity: "medium"
    frequency: "medium"
    follow_up_tree: "member_ops_plan"

  - name: "销售话术设计"
    description: >
      针对不同销售场景（门店接待、电话销售、在线客服等）和不同
      客户类型，设计有说服力的标准销售话术，包含开场白、需求挖掘、
      产品介绍、异议处理和成交引导等各环节的对话模板。
    typical_output: >
      销售话术手册（含各场景话术模板、常见客户问题应答、
      异议处理流程、成交话术和跟进话术）
    complexity: "low"
    frequency: "high"
    follow_up_tree: "sales_script_design"

  - name: "供应链优化方案"
    description: >
      对供应链全链条（采购、仓储、配送、库存管理）进行评估和优化，
      识别瓶颈和浪费环节，提出降本增效的改进方案，提升供应链
      响应速度和整体运营效率。
    typical_output: >
      供应链优化方案（含现状诊断、优化目标、改措施、实施计划、
      预期效果和风险评估）
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "supply_chain_opt"

  - name: "年度销售计划"
    description: >
      制定年度销售战略和行动计划，包括销售目标设定、市场策略、
      渠道布局、团队配置、预算分配和里程碑规划，为公司全年
      销售工作提供纲领性指导。
    typical_output: >
      年度销售计划书（含总体目标、市场分析、策略规划、渠道/区域
      分解、预算方案、执行时间表和关键监控指标）
    complexity: "medium"
    frequency: "low"
    follow_up_tree: "annual_sales_plan"

  - name: "竞品调研报告"
    description: >
      对主要竞争对手的产品、定价、渠道、营销和运营策略进行
      系统性调研和分析，识别竞争优势和差距，为自身产品定位
      和市场策略调整提供决策依据。
    typical_output: >
      竞品调研报告（含竞品选择、对比维度、价格/渠道/营销分析、
      优劣势评估、威胁与机会分析和应对建议）
    complexity: "medium"
    frequency: "medium"
    follow_up_tree: "competitor_research"

# ============================================
# 4. roles — 角色知识定义（6 个角色）
# ============================================
roles:
  - name: "销售经理"
    kpis:
      - name: "销售额完成率"
        description: "实际销售额占目标销售额的比例"
        benchmark: ">= 90%"
      - name: "回款率"
        description: "到期应收账款的实际回收比例"
        benchmark: ">= 95%"
      - name: "客户增长率"
        description: "周期内新客户数量占期初客户基数的比例"
        benchmark: ">= 15%"
    pain_points:
      - "销售目标设定不合理，与市场实际情况脱节"
      - "团队成员销售能力参差不齐，新人培养周期长"
      - "跨区域客户信息和资源分配冲突"
      - "回款周期长，应收账款压力大"
    common_tasks:
      - "销售数据分析"
      - "年度销售计划"
      - "促销方案策划"
      - "客户分群策略"
      - "销售话术设计"
    responsibilities:
      - "制定销售策略和目标，推动团队达成销售业绩"
      - "管理销售团队，包括培训、激励和绩效评估"
      - "维护重点客户关系，处理重大客户投诉"
      - "分析市场趋势和竞争动态，调整销售策略"
      - "协调跨部门资源支持销售业务开展"

  - name: "电商运营"
    kpis:
      - name: "GMV达成率"
        description: "实际成交总额占目标GMV的比例"
        benchmark: ">= 90%"
      - name: "转化率"
        description: "访问到下单的转化比例"
        benchmark: ">= 3%（行业均值以上）"
      - name: "流量留存率"
        description: "访客在平台停留时长和回访率综合指标"
        benchmark: "次日回访率 >= 15%"
    pain_points:
      - "平台规则频繁变动，运营策略需要不断调整"
      - "流量成本持续上涨，ROI压力越来越大"
      - "大促期间运营压力大，各环节协调复杂"
      - "跨部门（设计、仓储、客服）协作效率低"
    common_tasks:
      - "店铺运营报告"
      - "电商详情页文案"
      - "促销方案策划"
      - "销售数据分析"
      - "渠道运营优化"
    responsibilities:
      - "负责电商平台的日常运营和维护"
      - "优化商品详情页和店铺装修提升转化率"
      - "策划和执行线上促销活动及大促方案"
      - "监控和分析运营数据，制定改善计划"
      - "协调供应链、客服和设计团队保障运营效率"

  - name: "客户成功经理"
    kpis:
      - name: "复购率"
        description: "周期内再次购买的客户占活跃客户的比例"
        benchmark: ">= 40%"
      - name: "客户满意度"
        description: "客户满意度调查评分"
        benchmark: ">= 4.5/5.0"
      - name: "客户流失率"
        description: "周期内流失客户数占期初客户数的比例"
        benchmark: "< 5%"
    pain_points:
      - "客户沉默周期难以精准识别，错失干预窗口"
      - "缺乏高效的工具支撑大规模客户精细化运营"
      - "售后问题处理复杂，客户期望管理困难"
      - "各部门客户数据不互通，难以形成完整客户画像"
    common_tasks:
      - "客户分群策略"
      - "会员运营方案"
      - "销售数据分析"
      - "渠道运营优化"
    responsibilities:
      - "负责客户全生命周期管理和关系维护"
      - "制定分层运营策略，提升客户活跃度和留存率"
      - "协调处理客户投诉和售后问题"
      - "分析客户行为数据，设计促活和召回方案"
      - "建立客户成功案例库，推动服务标准化"

  - name: "品类采购经理"
    kpis:
      - name: "缺货率"
        description: "负责品类的SKU缺货比例"
        benchmark: "< 3%"
      - name: "毛利率"
        description: "负责品类的综合毛利率水平"
        benchmark: ">= 行业平均水平"
      - name: "供应商准时率"
        description: "供应商按期交货的订单比例"
        benchmark: ">= 95%"
    pain_points:
      - "供应商质量参差不齐，到货品质不稳定"
      - "市场行情波动大，采购成本和定价难以把控"
      - "库存积压和缺货并存的矛盾难以平衡"
      - "新品引入评估缺乏有效的数据和工具支撑"
    common_tasks:
      - "商品选品分析"
      - "供应链优化方案"
      - "销售数据分析"
      - "竞品调研报告"
      - "年度销售计划"
    responsibilities:
      - "负责品类规划、供应商寻源和商品采购"
      - "管理供应商关系，谈判采购合同和价格"
      - "监控品类销售和库存数据，优化品类结构"
      - "控制采购成本，确保品类毛利率达标"
      - "跟踪市场趋势和消费者需求变化"

  - name: "零售店长"
    kpis:
      - name: "坪效"
        description: "门店每平方米创造的月销售额"
        benchmark: ">= 3000元/平米/月"
      - name: "客单价"
        description: "每位顾客平均消费金额"
        benchmark: ">= 100元"
      - name: "损耗率"
        description: "门店商品损耗占总销售额的比例"
        benchmark: "< 1%"
    pain_points:
      - "客流下降趋势明显，门店获客能力有限"
      - "优秀导购难招难留，人员流动率高"
      - "线上冲击导致门店客流持续下降"
      - "总部标准化要求与本地化运营的矛盾"
    common_tasks:
      - "店铺运营报告"
      - "促销方案策划"
      - "商品选品分析"
      - "销售数据分析"
      - "销售话术设计"
    responsibilities:
      - "全面负责门店日常运营和销售管理"
      - "管理门店团队，包括排班、培训和考核"
      - "监控门店运营指标并持续改善"
      - "维护门店商品陈列和环境标准"
      - "处理客户投诉和突发门店事件"

  - name: "市场/增长经理"
    kpis:
      - name: "获客成本(CAC)"
        description: "获取每位新客户的平均营销成本"
        benchmark: "<= LTV的1/3"
      - name: "活动ROI"
        description: "营销活动的投入产出比"
        benchmark: ">= 3.0"
      - name: "品牌渗透率"
        description: "目标客群中品牌认知和购买比例"
        benchmark: "年增长 >= 5%"
    pain_points:
      - "各渠道ROI难以精确归因，预算分配缺乏依据"
      - "市场活动与销售转化之间的脱节，效果难量化"
      - "市场竞争激烈，同质化严重难以打出差异化"
      - "预算有限但KPI要求高，资源分配矛盾突出"
    common_tasks:
      - "促销方案策划"
      - "渠道运营优化"
      - "竞品调研报告"
      - "年度销售计划"
      - "销售数据分析"
    responsibilities:
      - "制定市场增长策略和年度营销计划"
      - "管理各营销渠道的投放和ROI优化"
      - "策划品牌推广和获客活动"
      - "分析市场趋势和竞争格局"
      - "协同销售和产品团队推动增长目标达成"

# ============================================
# 5. workflows — 核心流程定义（3 个流程）
# ============================================
workflows:
  - name: "促销活动执行流程"
    category: "销售运营"
    steps:
      - step: 1
        name: "活动策划"
        owner: "市场/运营经理"
        deliverables:
          - "促销活动方案"
          - "预算审批表"
      - step: 2
        name: "商品选品和备货"
        owner: "品类采购经理"
        deliverables:
          - "促销商品清单"
          - "备货计划"
      - step: 3
        name: "定价和优惠方案"
        owner: "商品定价团队"
        deliverables:
          - "促销价格表"
          - "优惠规则说明"
      - step: 4
        name: "渠道和物料准备"
        owner: "运营 + 设计团队"
        deliverables:
          - "各渠道活动页面/物料"
          - "推广素材"
      - step: 5
        name: "预热推广"
        owner: "市场增长团队"
        deliverables:
          - "预热推广计划"
          - "各渠道投放排期"
      - step: 6
        name: "活动执行和监控"
        owner: "运营团队"
        deliverables:
          - "实时销售数据看板"
          - "库存预警报告"
      - step: 7
        name: "活动复盘"
        owner: "市场/运营经理"
        deliverables:
          - "活动效果复盘报告"
          - "改善建议清单"
    decision_points:
      - point: "备货量是否匹配预估销量？"
        yes: "进入定价和优惠方案环节"
        no: "调整备货计划后重新审核"
      - point: "活动ROI是否达到预期？"
        yes: "固化活动模板持续优化"
        no: "分析原因调整下一期活动策略"
    failure_modes:
      - name: "库存预估偏差大"
        impact: "热销商品过早断货或滞销品大量积压"
        prevention: "基于历史数据建立销量预测模型，预留安全库存弹性"
      - name: "各渠道价格不一致导致投诉"
        impact: "客户比价后产生不满，品牌信誉受损"
        prevention: "建立统一的价格管控机制和渠道价格协议"
      - name: "活动页面和系统承载不足"
        impact: "高并发时页面加载慢或系统崩溃，流失大量订单"
        prevention: "提前进行压力测试，配置弹性扩容和熔断降级"

  - name: "客户生命周期管理流程"
    category: "客户管理"
    steps:
      - step: 1
        name: "新客获取"
        owner: "市场增长团队"
        deliverables:
          - "获客渠道分析报告"
          - "新客注册数据"
      - step: 2
        name: "首购转化"
        owner: "运营团队"
        deliverables:
          - "新客首购引导方案"
          - "首购优惠策略"
      - step: 3
        name: "活跃培养"
        owner: "客户成功经理"
        deliverables:
          - "活跃度提升计划"
          - "定期触达内容日历"
      - step: 4
        name: "忠诚度建设"
        owner: "会员运营团队"
        deliverables:
          - "会员体系和权益方案"
          - "积分激励计划"
      - step: 5
        name: "流失预警和干预"
        owner: "客户成功经理"
        deliverables:
          - "流失预警客户清单"
          - "召回干预方案"
      - step: 6
        name: "流失客户分析"
        owner: "数据分析团队"
        deliverables:
          - "流失原因分析报告"
          - "客户留存改善建议"
    decision_points:
      - point: "客户是否达到活跃标准？"
        yes: "进入忠诚度建设阶段"
        no: "继续活跃培养或启动召回流程"
      - point: "流失预警客户是否值得挽回？"
        yes: "分配专属客服进行1对1召回"
        no: "纳入自动化召回序列批量触达"
    failure_modes:
      - name: "客户沉默周期过长未被识别"
        impact: "错过最佳干预窗口，客户真正流失后召回成本高"
        prevention: "建立自动化行为监控，设置沉默客户自动预警机制"
      - name: "过度营销导致客户反感"
        impact: "频繁推送营销信息导致客户取消关注或拉黑"
        prevention: "设置触达频次上限，根据客户偏好个性化推送内容和频率"

  - name: "门店日常运营流程"
    category: "门店管理"
    steps:
      - step: 1
        name: "开店准备"
        owner: "值班店长"
        deliverables:
          - "开店检查清单"
          - "早会记录"
      - step: 2
        name: "商品检查和补货"
        owner: "店员"
        deliverables:
          - "缺货登记表"
          - "补货申请单"
      - step: 3
        name: "日常销售服务"
        owner: "全体店员"
        deliverables:
          - "销售台账"
          - "客户咨询记录"
      - step: 4
        name: "高峰期运营"
        owner: "店长 + 全体店员"
        deliverables:
          - "客流高峰期应对方案"
          - "临时加派岗位安排"
      - step: 5
        name: "收银和结算"
        owner: "收银员"
        deliverables:
          - "收银核对表"
          - "现金/刷卡汇总"
      - step: 6
        name: "闭店清场"
        owner: "值班店长"
        deliverables:
          - "日销售统计"
          - "闭店检查清单"
          - "次日工作备忘"
    decision_points:
      - point: "当前库存是否能满足当天销售？"
        yes: "正常运营，关注高峰期销售"
        no: "紧急调货或调整陈列策略"
      - point: "客流量是否达到高峰阈值？"
        yes: "启动高峰期预案，增开收银台"
        no: "安排员工进行商品整理和培训"
    failure_modes:
      - name: "高峰期人手不足导致服务下滑"
        impact: "顾客等待时间长、体验差，导致差评和客户流失"
        prevention: "根据历史客流数据排班，高峰期预留弹性人力"
      - name: "收银差错导致日结对不上"
        impact: "账实不符，耗费大量时间排查差错原因"
        prevention: "规范收银操作流程，每班次结束后及时核对交接"

# ============================================
# 6. docs — 文档规范模板（6 个模板）
# ============================================
docs:
  - name: "促销方案模板"
    task_type: "促销方案策划"
    sections:
      - title: "活动背景与目标"
        prompt_hint: "为什么要做这次促销？当前销售状况如何？要达成什么量化目标（GMV、客单价、新增用户）？"
      - title: "促销机制设计"
        prompt_hint: "采用什么促销方式（满减/秒杀/满赠/裂变）？优惠力度和门槛设置？是否叠加平台优惠？"
      - title: "商品选品策略"
        prompt_hint: "哪些商品参与促销？引流款、利润款和形象款的搭配比例？库存是否充足？"
      - title: "预算与投入"
        prompt_hint: "促销总预算多少？各渠道预算分配？预期ROI是多少？亏损可控范围是多少？"
      - title: "执行时间表"
        prompt_hint: "预热期、爆发期和返场期的具体时间节点？各阶段核心动作和责任人是谁？"
      - title: "风险预案"
        prompt_hint: "库存不足、系统过载、价格错误等突发情况的应对方案？客服话术准备？"
    tone: "数据驱动，目标导向，可执行"
    common_mistakes:
      - "促销力度过大导致利润严重受损，赚了GMV亏了利润"
      - "选品单一缺乏搭配策略，促销期后流量断崖式下跌"
      - "忽略库存和物流能力限制，超卖无法发货引发客诉"
      - "复盘指标不全面，只看了销售额没有评估ROI和利润"

  - name: "销售数据分析报告模板"
    task_type: "销售数据分析"
    sections:
      - title: "分析概述"
        prompt_hint: "分析的数据范围（时间/区域/渠道）？分析目的和决策点是什么？"
      - title: "整体销售概览"
        prompt_hint: "总销售额、同比/环比变化、目标达成率、主要指标趋势图"
      - title: "品类结构分析"
        prompt_hint: "各品类销售额占比、增速排名、毛利贡献度、热销/滞销TOP10"
      - title: "区域/渠道对比"
        prompt_hint: "各区域和渠道的业绩对比、增速差异、转化率和客单价对比"
      - title: "核心发现与建议"
        prompt_hint: "最重要的3-5个数据洞察是什么？建议采取的改进措施和预估效果？"
    tone: "客观，精准，数据驱动"
    common_mistakes:
      - "堆砌大量图表但没有提炼核心结论和建议"
      - "数据口径不一致导致分析结论前后矛盾"
      - "缺少同比/环比对比，无法判断趋势好坏"
      - "建议空泛不具备可操作性，业务方无法落地执行"

  - name: "电商详情页文案模板"
    task_type: "电商详情页文案"
    sections:
      - title: "商品标题"
        prompt_hint: "包含核心关键词（品牌+品名+核心卖点+场景词），字数控制在30字以内"
      - title: "核心卖点提炼"
        prompt_hint: "3-5个差异化卖点，每个卖点一句话总结加详细展开，突出用户利益而非产品参数"
      - title: "详情描述"
        prompt_hint: "从用户痛点出发，按FAB法则（属性-优势-利益）组织内容，包含使用场景和效果展示"
      - title: "参数规格"
        prompt_hint: "清晰的表格形式列出材质、尺寸、重量、颜色等关键参数，标注检测认证信息"
      - title: "售后保障"
        prompt_hint: "退换货政策、质保承诺、客服响应时间等打消用户顾虑的内容"
    tone: "吸引力强，信任感，促转化"
    common_mistakes:
      - "标题关键词堆砌，可读性差且不符合平台规则"
      - "卖点描述停留在产品参数层面，没有转化为用户利益"
      - "详情页缺少使用场景和效果展示，用户无法想象使用价值"
      - "忽视移动端阅读体验，图片文字过小或段落过长"

  - name: "客户分群方案模板"
    task_type: "客户分群策略"
    sections:
      - title: "分群目标"
        prompt_hint: "为什么需要客户分群？要解决什么业务问题？分群后的使用场景是什么？"
      - title: "数据来源和维度"
        prompt_hint: "使用哪些数据（交易/行为/属性）？分群维度如何选择（RFM/消费偏好/生命周期）？"
      - title: "客户群定义和画像"
        prompt_hint: "分几类客群？每类的划分标准、规模占比、典型画像特征"
      - title: "运营策略"
        prompt_hint: "各客群的差异化策略（促活/转化/留存/召回）、触达渠道和频次"
      - title: "效果评估指标"
        prompt_hint: "如何衡量分群策略的效果？关键指标和预期提升幅度"
    tone: "逻辑清晰，数据支撑，可执行"
    common_mistakes:
      - "分群过细导致运营资源分散，无法集中兵力打透重点客群"
      - "分群维度单一只用了消费金额，忽略了行为偏好等维度"
      - "分群后缺乏差异化的运营策略，分了等于没分"
      - "未建立效果评估机制，无法验证分群策略的有效性"

  - name: "年度销售计划模板"
    task_type: "年度销售计划"
    sections:
      - title: "市场分析"
        prompt_hint: "宏观市场环境、行业趋势、竞争格局、目标市场规模和增长率预测"
      - title: "总体目标"
        prompt_hint: "年度总销售额目标、毛利目标、市场份额目标和增长率目标"
      - title: "策略规划"
        prompt_hint: "核心增长策略（产品/价格/渠道/促销）？差异化竞争优势如何打造？"
      - title: "渠道/区域分解"
        prompt_hint: "各渠道和各区域的销售目标分解、资源配置、重点突破方向"
      - title: "执行时间表"
        prompt_hint: "按季度/月度分解里程碑节点、关键活动排期、重点项目的交付时间"
      - title: "预算和资源"
        prompt_hint: "营销预算、人力配置、系统投入和其他资源需求的总额和分配方案"
    tone: "战略高度，数据支撑，务实可行"
    common_mistakes:
      - "目标设定过于激进或保守，与历史数据和市场实际脱节"
      - "计划只有目标没有落地路径，执行层不知道如何达成"
      - "排期过满没有预留缓冲时间，一个环节出问题全盘受影响"
      - "缺少季度复盘和滚动调整机制，计划做完就束之高阁"

  - name: "竞品调研报告模板"
    task_type: "竞品调研报告"
    sections:
      - title: "竞品选择范围"
        prompt_hint: "选取哪几家竞品？选择依据是什么（直接竞争/间接竞争/潜在替代）？"
      - title: "产品对比分析"
        prompt_hint: "产品功能、定价策略、目标客群、核心差异化点对比"
      - title: "渠道和营销分析"
        prompt_hint: "竞品覆盖哪些渠道？营销策略和推广方式？品牌声量对比"
      - title: "运营效率对比"
        prompt_hint: "门店布局、供应链效率、客户服务质量、用户评价对比"
      - title: "SWOT分析"
        prompt_hint: "自身的优势劣势，竞品的优劣势，市场机会和威胁"
      - title: "应对建议"
        prompt_hint: "基于分析的差异化竞争策略建议、优先级和实施路线图"
    tone: "客观中立，洞察深入，行动导向"
    common_mistakes:
      - "只罗列竞品信息不做深度分析，缺乏可操作的结论"
      - "对比维度选择片面，只看价格不看服务和体验"
      - "忽略间接竞品和潜在替代品的威胁"
      - "分析报告完成后没有转化为具体的行动方案"

# ============================================
# 7. follow_up_trees — 追问逻辑树（12 棵树）
# ============================================
follow_up_trees:

  # --- 追问树 1: 促销方案策划 ---
  - task_type: "promo_planning"
    root_node_id: "promo_q1"
    nodes:
      promo_q1:
        node_id: "promo_q1"
        question_text: "你策划的促销类型是什么？"
        question_type: "single_choice"
        info_key: "promo_type"
        depth: 1
        options:
          - value: "spend_save"
            label: "满减/满赠（提升客单价和连带率）"
          - value: "flash"
            label: "秒杀/限时抢购（快速引流和冲销量）"
          - value: "viral"
            label: "裂变营销（拼团/砍价，低成本拉新）"
          - value: "member"
            label: "会员专享（维护核心客户忠诚度）"
        children:
          spend_save: "promo_q2_target"
          flash: "promo_q2_target"
          viral: "promo_q2_audience"
          member: "promo_q2_target"
        fallback_node_id: "promo_q2_target"
        is_leaf: false

      promo_q2_target:
        node_id: "promo_q2_target"
        question_text: "促销的目标客群是什么？"
        question_type: "single_choice"
        info_key: "promo_target"
        depth: 2
        options:
          - value: "all"
            label: "全量客户（面向所有消费者）"
          - value: "new"
            label: "新客为主（吸引首次购买用户）"
          - value: "existing"
            label: "老客召回（唤醒沉默和流失客户）"
          - value: "vip"
            label: "高价值客户（VIP和核心会员）"
        children:
          all: "promo_q3_budget"
          new: "promo_q3_budget"
          existing: "promo_q3_budget"
          vip: "promo_q3_budget"
        fallback_node_id: "promo_q3_budget"
        is_leaf: false

      promo_q2_audience:
        node_id: "promo_q2_audience"
        question_text: "裂变活动的参与人群特征是什么？"
        question_type: "single_choice"
        info_key: "promo_fission_audience"
        depth: 2
        options:
          - value: "young"
            label: "年轻群体（18-30岁，社交活跃度高）"
          - value: "mom"
            label: "宝妈群体（家庭消费决策者）"
          - value: "office"
            label: "白领人群（办公室场景易传播）"
        children:
          young: "promo_q3_budget"
          mom: "promo_q3_budget"
          office: "promo_q3_budget"
        fallback_node_id: "promo_q3_budget"
        is_leaf: false

      promo_q3_budget:
        node_id: "promo_q3_budget"
        question_text: "促销预算规模如何？"
        question_type: "single_choice"
        info_key: "promo_budget"
        depth: 3
        options:
          - value: "small"
            label: "小预算（< 5万，聚焦单渠道精细化运营）"
          - value: "medium"
            label: "中等预算（5-20万，多渠道组合投放）"
          - value: "large"
            label: "大预算（20万+，全渠道覆盖重点推广）"
        children:
          small: "promo_q4_output"
          medium: "promo_q4_output"
          large: "promo_q4_output"
        fallback_node_id: "promo_q4_output"
        is_leaf: false

      promo_q4_output:
        node_id: "promo_q4_output"
        question_text: "期望的产出物包含哪些内容？"
        question_type: "multi_choice"
        info_key: "promo_output"
        depth: 4
        options:
          - value: "full_plan"
            label: "完整促销方案（含目标/机制/预算/排期）"
          - value: "budget"
            label: "预算和ROI预估"
          - value: "copy"
            label: "推广文案和视觉创意方案"
          - value: "execution"
            label: "执行排期表和Checklist"
        children: {}
        fallback_node_id: null
        is_leaf: true

  # --- 追问树 2: 销售数据分析 ---
  - task_type: "sales_data_analysis"
    root_node_id: "sales_q1"
    nodes:
      sales_q1:
        node_id: "sales_q1"
        question_text: "数据分析的关注维度是什么？"
        question_type: "single_choice"
        info_key: "sales_dimension"
        depth: 1
        options:
          - value: "customer"
            label: "客户分析（客户构成、复购、分层）"
          - value: "product"
            label: "产品分析（品类结构、热销/滞销）"
          - value: "channel"
            label: "渠道分析（各渠道业绩和效率对比）"
          - value: "time"
            label: "时间趋势（同比/环比、季节性分析）"
        children:
          customer: "sales_q2_scope"
          product: "sales_q2_scope"
          channel: "sales_q2_scope"
          time: "sales_q2_scope"
        fallback_node_id: "sales_q2_scope"
        is_leaf: false

      sales_q2_scope:
        node_id: "sales_q2_scope"
        question_text: "数据分析的数据范围是什么？"
        question_type: "single_choice"
        info_key: "sales_scope"
        depth: 2
        options:
          - value: "month"
            label: "月度数据（近1-3个月，侧重近期表现）"
          - value: "quarter"
            label: "季度数据（近1年，看趋势和季节变化）"
          - value: "full_year"
            label: "全年数据（多年对比，看长期趋势）"
        children:
          month: "sales_q3_depth"
          quarter: "sales_q3_depth"
          full_year: "sales_q3_depth"
        fallback_node_id: "sales_q3_depth"
        is_leaf: false

      sales_q3_depth:
        node_id: "sales_q3_depth"
        question_text: "分析的深度要求如何？"
        question_type: "single_choice"
        info_key: "sales_depth"
        depth: 3
        options:
          - value: "overview"
            label: "概览型（核心指标趋势，快照式报表）"
          - value: "diagnostic"
            label: "诊断型（深入分析原因和归因）"
          - value: "predictive"
            label: "预测型（趋势预测和模拟分析）"
        children:
          overview: "sales_q4_output"
          diagnostic: "sales_q4_output"
          predictive: "sales_q4_output"
        fallback_node_id: "sales_q4_output"
        is_leaf: false

      sales_q4_output:
        node_id: "sales_q4_output"
        question_text: "期望的产出格式是什么？"
        question_type: "multi_choice"
        info_key: "sales_output"
        depth: 4
        options:
          - value: "report"
            label: "完整分析报告（图文并茂的详细文档）"
          - value: "dashboard"
            label: "数据看板（核心指标实时展示）"
          - value: "presentation"
            label: "汇报PPT（面向管理层的精简版）"
          - value: "insights"
            label: "关键洞察摘要（一页纸核心发现+建议）"
        children: {}
        fallback_node_id: null
        is_leaf: true

  # --- 追问树 3: 客户分群策略 ---
  - task_type: "customer_segmentation"
    root_node_id: "cust_q1"
    nodes:
      cust_q1:
        node_id: "cust_q1"
        question_text: "客户分群的主要目的是什么？"
        question_type: "single_choice"
        info_key: "cust_goal"
        depth: 1
        options:
          - value: "retention"
            label: "提升留存（降低流失率，提高复购）"
          - value: "activation"
            label: "激活沉默客户（唤醒长期未购用户）"
          - value: "upsell"
            label: "交叉销售和升级销售（提升客单价）"
          - value: "acquisition"
            label: "精准获客（找到高价值潜客画像）"
        children:
          retention: "cust_q2_data"
          activation: "cust_q2_data"
          upsell: "cust_q2_data"
          acquisition: "cust_q2_data"
        fallback_node_id: "cust_q2_data"
        is_leaf: false

      cust_q2_data:
        node_id: "cust_q2_data"
        question_text: "可用的客户数据来源有哪些？"
        question_type: "multi_choice"
        info_key: "cust_data_sources"
        depth: 2
        options:
          - value: "transaction"
            label: "交易数据（购买记录、消费金额、频次）"
          - value: "behavior"
            label: "行为数据（浏览、点击、收藏、加购）"
          - value: "profile"
            label: "画像数据（年龄、性别、地域、职业）"
          - value: "feedback"
            label: "反馈数据（评价、投诉、问卷）"
        children:
          transaction: "cust_q3_method"
          behavior: "cust_q3_method"
          profile: "cust_q3_method"
          feedback: "cust_q3_method"
        fallback_node_id: "cust_q3_method"
        is_leaf: false

      cust_q3_method:
        node_id: "cust_q3_method"
        question_text: "倾向采用什么分群方法？"
        question_type: "single_choice"
        info_key: "cust_method"
        depth: 3
        options:
          - value: "rfm"
            label: "RFM模型（基于最近购买/频次/金额）"
          - value: "behavioral"
            label: "行为分群（基于浏览和购买偏好）"
          - value: "lifecycle"
            label: "生命周期分群（潜客/新客/活跃/沉睡/流失）"
        children:
          rfm: "cust_q4_output"
          behavioral: "cust_q4_output"
          lifecycle: "cust_q4_output"
        fallback_node_id: "cust_q4_output"
        is_leaf: false

      cust_q4_output:
        node_id: "cust_q4_output"
        question_text: "期望的产出格式是什么？"
        question_type: "multi_choice"
        info_key: "cust_output"
        depth: 4
        options:
          - value: "plan"
            label: "完整分群方案（含画像和运营策略）"
          - value: "visual"
            label: "可视化客群画像（各客群特征一目了然）"
          - value: "rules"
            label: "分群规则和打分模型说明"
          - value: "actions"
            label: "差异化运营策略建议（各客群行动方案）"
        children: {}
        fallback_node_id: null
        is_leaf: true

  # --- 追问树 4: 渠道运营优化 ---
  - task_type: "channel_optimization"
    root_node_id: "chan_q1"
    nodes:
      chan_q1:
        node_id: "chan_q1"
        question_text: "需要优化的渠道类型是什么？"
        question_type: "single_choice"
        info_key: "chan_type"
        depth: 1
        options:
          - value: "online"
            label: "线上渠道（电商平台/官网/小程序）"
          - value: "offline"
            label: "线下渠道（门店/专柜/展会）"
          - value: "private"
            label: "私域渠道（微信群/企微/公众号）"
          - value: "distributor"
            label: "分销渠道（经销商/代理商）"
        children:
          online: "chan_q2_pain"
          offline: "chan_q2_pain"
          private: "chan_q2_pain"
          distributor: "chan_q2_pain"
        fallback_node_id: "chan_q2_pain"
        is_leaf: false

      chan_q2_pain:
        node_id: "chan_q2_pain"
        question_text: "当前渠道的主要痛点是什么？"
        question_type: "single_choice"
        info_key: "chan_pain"
        depth: 2
        options:
