# ============================================
# 8. pain_points — 行业痛点清单（5 条）
# ============================================
pain_points:
  - name: "客户流失严重"
    description: "新客获取成本持续走高但老客留存率难以提升，大量客户在首购后不再复购，投入产出严重不成比例"
    why_happens: "品牌和客户之间缺乏持续互动纽带，售后服务不到位，竞品低价分流，会员权益吸引力不足"
    who_feels_it: "销售经理、客户成功经理、市场增长经理"
    typical_phrases:
      - "做了那么多活动，客户买一次就不来了"
      - "新客获取成本越来越高，老客又留不住"
      - "隔壁一打折客户就跑过去了"
    what_not_to_do: "假设所有客户都需要同样的保留策略，使用同一套促活方案触达全部客户群体"

  - name: "库存积压严重"
    description: "采购预测与实际需求偏差大导致大量库存积压，资金被占用无法周转，季末不得不大幅折扣清仓影响利润"
    why_happens: "需求预测缺乏数据支撑凭经验拍脑袋，采购周期和销售节奏不匹配，品类结构不合理"
    who_feels_it: "品类采购经理、零售店长、财务团队"
    typical_phrases:
      - "这批货进多了，半年都卖不完"
      - "不打折卖不掉，打折又不赚钱"
      - "去年卖得好的款今年突然不行了"
    what_not_to_do: "假设去年的销售数据可以直接预测今年的需求，忽略市场趋势和竞争变化的影响"

  - name: "渠道冲突加剧"
    description: "线上线下渠道价格不一致导致客户比价和投诉，经销商之间恶性竞争乱价，各渠道利益难以平衡"
    why_happens: "缺乏统一的渠道价格管理机制，各渠道KPI独立不协同，线上低价冲击线下渠道利益"
    who_feels_it: "销售经理、渠道经理、经销商管理团队"
    typical_phrases:
      - "线上比门店便宜那么多，谁还来店里买"
      - "隔壁经销商又在乱价了"
      - "线上线下的货是不是同一批？价格差这么多"
    what_not_to_do: "假设各渠道可以独立定价而不相互影响，忽视全渠道价格一致性的品牌形象影响"

  - name: "促销ROI难以评估"
    description: "大促和日常促销投入成本高，但各渠道的转化效果难以精确归因，无法判断哪些投入真正有效"
    why_happens: "用户多触点多渠道下单，归因模型选择困难，缺乏统一的数据追踪体系和效果评估标准"
    who_feels_it: "市场增长经理、电商运营、财务团队"
    typical_phrases:
      - "投了那么多钱做活动，到底赚没赚钱"
      - "这个客户到底是看了哪个广告来的"
      - "各渠道都在说自己贡献最大，数据对不上"
    what_not_to_do: "假设最后一次点击就是客户转化的唯一原因，忽视品牌曝光和其他触点的辅助贡献"

  - name: "客户数据孤岛"
    description: "CRM、ERP、电商平台、门店POS等各系统之间的客户数据不互通，无法形成完整的客户画像和统一视图"
    why_happens: "各业务系统独立建设缺乏统一数据标准，线上线下数据割裂，缺乏数据中台和客户统一ID体系"
    who_feels_it: "客户成功经理、运营团队、数据分析师"
    typical_phrases:
      - "线上会员到店里查不到购买记录"
      - "三个系统导出的客户数据对不上"
      - "我们其实有客户的数据，但不知道他们到底喜欢什么"
    what_not_to_do: "假设各系统数据天然就对齐和互通，直接使用单一系统的数据做全渠道客户分析"
