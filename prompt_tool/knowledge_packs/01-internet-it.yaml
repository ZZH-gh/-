# ============================================
# 8. pain_points — 行业痛点清单（>=5 条）
# ============================================
pain_points:
  - name: "需求频繁变更"
    description: "产品经理不断修改需求，导致开发团队反复返工和资源浪费"
    why_happens: "前期需求调研不充分、业务方中途产生新想法、市场环境快速变化导致优先级调整"
    who_feels_it: "研发团队、测试工程师、项目经理"
    typical_phrases:
      - "需求又变了"
      - "这个需求很急，这周就要"
      - "改改改，说改就改"
    what_not_to_do: "假设需求一旦确定就不再变更，直接按锁定需求生成完整技术方案"

  - name: "技术债积累"
    description: "为了赶进度采用快捷方案，导致代码质量持续下降，后续迭代越来越慢"
    why_happens: "上线压力大缺乏重构时间、代码审查流于形式、团队缺乏统一编码规范"
    who_feels_it: "研发团队、技术负责人、新入职工程师"
    typical_phrases:
      - "先上线再说，后面再优化"
      - "这段代码看不懂，不敢改"
      - "又踩坑了，又是之前的历史遗留问题"
    what_not_to_do: "假设代码质量完美无瑕，不需要考虑技术债的影响"

  - name: "跨部门协作困难"
    description: "产品、研发、运营、市场等部门之间信息不对称、目标不一致、沟通效率低"
    why_happens: "部门墙导致信息孤岛、KPI各自为政缺乏统一目标、缺乏高效的跨部门沟通机制"
    who_feels_it: "产品经理、项目经理、技术负责人"
    typical_phrases:
      - "这不是我的KPI"
      - "他们不懂技术，没法沟通"
      - "PM又不懂，这是技术问题"
    what_not_to_do: "假设各部门自动对齐目标，不需要额外的沟通协调工作"

  - name: "数据口径不统一"
    description: "不同部门使用不同的数据源和计算方式，同一指标得出不同结论，互相矛盾"
    why_happens: "缺乏统一的数据中台和指标管理体系、埋点规范不统一、指标定义文档缺失"
    who_feels_it: "数据分析师、运营团队、产品经理、管理层"
    typical_phrases:
      - "这个数据不对，和后台对不上"
      - "口径是什么？你怎么算的？"
      - "你们的数据和我们差好多"
    what_not_to_do: "假设所有团队对数据指标的定义和理解一致，直接使用各方数据做对比分析"

  - name: "线上事故频发"
    description: "上线后出现严重Bug、性能下降或服务不可用，影响用户体验和业务运转"
    why_happens: "测试覆盖不足缺乏边界测试、灰度发布流程不完善、监控告警缺失、回滚机制不健全"
    who_feels_it: "SRE/运维、研发团队、终端用户、客服团队"
    typical_phrases:
      - "又挂了"
      - "紧急回滚"
      - "怎么上线前没发现这个问题"
      - "oncall电话又响了"
    what_not_to_do: "假设无Bug无事故的完美上线，不制定回滚预案和监控策略"

  - name: "人员流动导致知识断层"
    description: "核心成员离职导致业务知识、技术决策背景和系统认知出现断层，新人上手困难"
    why_happens: "文档缺失或过时、关键决策没有记录、代码注释不足、缺乏知识传承机制"
    who_feels_it: "技术负责人、HR、新入职员工、管理层"
    typical_phrases:
      - "这人走了我们怎么办"
      - "这段逻辑为什么这么设计，没人知道"
      - "文档太老了，跟实际不一样"
    what_not_to_do: "假设核心知识已经沉淀在文档中，不需要额外做知识传承和交接工作"
