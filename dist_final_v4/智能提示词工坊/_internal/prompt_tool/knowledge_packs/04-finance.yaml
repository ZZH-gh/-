# ============================================
# 2. terms — 行业术语表（>=65 条）
# ============================================
terms:
  # --- 信贷/银行类（10 条） ---
  - term: "信贷"
    category: "信贷管理"
    definition: "银行或其他金融机构以借款人信用为基础，按照约定利率和期限向借款人提供资金融通的授信业务活动。"
    aliases: ["贷款", "授信", "融资"]
    usage_context: "银行对公和对私业务的核心资产端业务，包括流动资金贷款、固定资产贷款、个人消费贷款等品种"
    related_terms: ["授信额度", "利率", "还款计划"]

  - term: "不良率"
    category: "信贷管理"
    definition: "不良贷款率（Non-Performing Loan Ratio），指次级类、可疑类和损失类贷款余额占各项贷款余额的比例，衡量银行信贷资产质量的核心指标。"
    aliases: ["NPL Ratio", "不良贷款率", "坏账率"]
    usage_context: "监管机构监测银行资产质量的关键指标，不良率上升意味着信贷风险暴露增加"
    related_terms: ["信用风险", "拨备覆盖率", "贷后管理"]

  - term: "贷前审核"
    category: "信贷管理"
    definition: "在发放贷款前对借款人的资质、信用状况、还款能力和担保条件进行全面调查和评估的信贷审批前置环节。"
    aliases: ["贷前调查", "贷前审查", "贷前尽职调查"]
    usage_context: "信贷审批经理在放款前执行，包含资料真实性核查、还款能力评估和担保品价值测算"
    related_terms: ["贷后管理", "征信", "抵押率"]

  - term: "贷后管理"
    category: "信贷管理"
    definition: "贷款发放后对借款人经营状况、资金用途、还款能力和抵质押物价值进行持续跟踪监控的信贷管理全过程。"
    aliases: ["贷后监控", "贷后检查", "贷后跟踪"]
    usage_context: "贷款发放后由信贷经理定期执行，包括现场检查、财务分析、风险预警和逾期催收"
    related_terms: ["不良率", "风险预警", "信用风险"]

  - term: "风控"
    category: "风险管理"
    definition: "风险控制（Risk Control），通过识别、评估、监测和应对各类风险的系统性管理活动，确保机构在可承受风险范围内运营。"
    aliases: ["风险控制", "风控体系", "风控管理"]
    usage_context: "金融机构核心职能，覆盖信贷审批、交易监控、合规检查等各业务环节的风险管理实践"
    related_terms: ["信用风险", "操作风险", "内控"]

  - term: "征信"
    category: "信贷管理"
    definition: "依法收集、整理、保存和加工个人或企业的信用信息，向合法机构提供信用报告和信用评价服务的信用管理体系。"
    aliases: ["信用报告", "信用记录", "征信报告"]
    usage_context: "银行在贷前审核时查询借款人的信用报告，了解其历史还款记录和负债情况作为授信依据"
    related_terms: ["贷前审核", "不良率", "授信额度"]

  - term: "抵押率"
    category: "信贷管理"
    definition: "贷款金额与抵质押物评估价值的比率（Loan-to-Value Ratio），反映银行贷款的抵押担保充足程度，越低则风险敞口越小。"
    aliases: ["LTV", "贷款价值比", "质押率"]
    usage_context: "信贷审批中确定贷款额度的关键参数，房产抵押贷款通常设定不超过70%的抵押率上限"
    related_terms: ["贷前审核", "授信额度", "信用风险"]

  - term: "授信额度"
    category: "信贷管理"
    definition: "银行根据借款人的信用状况、还款能力和担保条件，核定的可循环使用的最高贷款金额上限。"
    aliases: ["授信", "额度", "信贷额度"]
    usage_context: "银行在对客户进行综合评估后授予，客户在额度有效期内可循环使用，单笔用款不超过总额度"
    related_terms: ["信贷", "利率", "贷前审核"]

  - term: "利率"
    category: "信贷管理"
    definition: "资金借贷的价格，即借款人在一定时期内使用资金所支付的利息与本金的比例，分为固定利率和浮动利率两种基本形式。"
    aliases: ["利息率", "贷款利率", "基准利率"]
    usage_context: "贯穿信贷业务全流程的核心定价参数，受央行政策利率、市场资金供求和借款人信用风险等多因素影响"
    related_terms: ["信贷", "还款计划", "年化收益"]

  - term: "还款计划"
    category: "信贷管理"
    definition: "借贷双方约定的贷款本金和利息的分期偿还安排，包括还款周期、每期还款金额和还款方式（等额本息/等额本金）等要素。"
    aliases: ["还款方案", "还款表", "还款安排"]
    usage_context: "贷款发放前由借贷双方确定，作为合同附件明确各期还款义务，是贷后管理的基础依据"
    related_terms: ["信贷", "利率", "贷后管理"]

  # --- 理财类（9 条） ---
  - term: "理财"
    category: "财富管理"
    definition: "个人或机构根据自身的财务目标和风险承受能力，通过合理配置各类金融资产以实现资产保值增值的财务规划活动。"
    aliases: ["财富管理", "理财规划", "财务规划"]
    usage_context: "理财顾问为客户提供资产配置建议的核心业务，涵盖风险评估、产品选择和组合管理全流程"
    related_terms: ["资产配置", "风险测评", "基金净值"]

  - term: "基金净值"
    category: "财富管理"
    definition: "基金资产净值（Net Asset Value），基金资产总值减去负债后的净资产值除以基金总份额得到的每份额价值，是基金申购赎回的计价基础。"
    aliases: ["NAV", "单位净值", "基金单位净值"]
    usage_context: "投资者评估基金表现的核心参考指标，每个交易日公布，反映基金投资组合的市值变动"
    related_terms: ["理财", "年化收益", "公募"]

  - term: "年化收益"
    category: "财富管理"
    definition: "将一定期限内的投资收益率换算为按年计算的收益率，便于不同期限产品之间的收益比较，不构成对未来收益的承诺。"
    aliases: ["年化收益率", "年回报率", "年化回报"]
    usage_context: "理财产品宣传中使用的标准化收益表达方式，需注意历史年化收益不代表未来实际收益"
    related_terms: ["浮动收益", "理财", "基金净值"]

  - term: "资产配置"
    category: "财富管理"
    definition: "根据投资者的风险承受能力、投资目标和时间期限，将资金在不同资产类别（股票、债券、现金、商品等）之间进行分配的投资策略。"
    aliases: ["资产分配", "组合配置", "投资配置"]
    usage_context: "投资经理和理财顾问为客户制定投资方案的核心工作，核心目标是平衡风险与收益，不推荐具体产品"
    related_terms: ["风险测评", "理财", "投资策略分析"]

  - term: "风险测评"
    category: "财富管理"
    definition: "通过标准化问卷和专业评估方法，对投资者的风险承受能力、风险偏好和投资经验进行系统评估和等级划分的过程。"
    aliases: ["风险评估", "风险承受能力评估", "投资者评估"]
    usage_context: "理财顾问在推荐产品前必须执行的前置环节，根据测评结果匹配合适风险等级的理财产品"
    related_terms: ["适当性管理", "资产配置", "投资者保护"]

  - term: "浮动收益"
    category: "财富管理"
    definition: "理财产品收益不固定，根据底层资产的实际运作情况浮动的收益方式，可能高于也可能低于业绩比较基准，投资者需自行承担收益波动风险。"
    aliases: ["浮动收益型", "非保本浮动收益", "浮动回报"]
    usage_context: "净值型理财产品的主要收益形式，打破刚兑后市场上主流产品均采用浮动收益机制"
    related_terms: ["年化收益", "净值型理财", "理财"]

  - term: "保本收益"
    category: "财富管理"
    definition: "过去理财产品中承诺保障本金不受损失的收益方式，但在打破刚兑政策和资管新规要求下，金融机构不得承诺保障本金和固定收益，投资者需自行承担投资风险。"
    aliases: ["保本", "保本型理财", "本金保障"]
    usage_context: "资管新规实施后，合规理财产品不得以保障本金和固定收益作为宣传卖点，投资者应关注产品风险等级而非保本承诺"
    related_terms: ["浮动收益", "净值型理财", "投资者保护"]

  - term: "净值型理财"
    category: "财富管理"
    definition: "以净值形式反映产品运作情况的理财产品类型，收益随底层资产市场价值波动，不设预期收益率，投资者按实际净值获取收益并承担损失风险。"
    aliases: ["净值型产品", "净值化管理", "净值化理财"]
    usage_context: "资管新规后银行理财向净值化转型，取代了原有的预期收益型产品，是理财市场的主流产品形态"
    related_terms: ["浮动收益", "理财", "年化收益"]

  - term: "业绩比较基准"
    category: "财富管理"
    definition: "理财产品设定的收益参考基准，用于衡量产品运作表现的目标值，不代表产品未来实际收益，更不是对保本和固定收益的承诺。"
    aliases: ["业绩基准", "比较基准", "Benchmark"]
    usage_context: "理财产品说明书中作为收益参考指标列示，实际收益可能高于或低于基准，投资者需关注此差异"
    related_terms: ["年化收益", "浮动收益", "净值型理财"]

  # --- 保险类（9 条） ---
  - term: "精算"
    category: "保险"
    definition: "运用数学、统计和金融理论对保险业务中的风险进行评估和定价的专业技术，是保险产品费率厘定和准备金评估的核心方法。"
    aliases: ["精算学", "精算评估", "精算分析"]
    usage_context: "精算师基于历史理赔数据、生命表和投资收益率假设，计算保险产品的纯保费和各项准备金"
    related_terms: ["保费", "理赔", "核保"]

  - term: "核保"
    category: "保险"
    definition: "保险公司对投保申请进行风险评估和审核的过程，决定是否接受投保以及以何种条件（费率、免赔额等）承保。"
    aliases: ["核保审核", "承保审核", "风险选择"]
    usage_context: "投保人提交申请后由保险公司核保人员执行，根据被保险人的健康状况、职业风险等信息做出承保决策"
    related_terms: ["保费", "理赔", "精算"]

  - term: "理赔"
    category: "保险"
    definition: "保险事故发生后，被保险人向保险公司提出索赔申请，保险公司根据保险合同约定进行审核、定损和赔付的完整流程。"
    aliases: ["索赔", "保险理赔", "理赔处理"]
    usage_context: "保险事故发生后的核心服务环节，包括报案受理、单证审核、损失核定、赔款计算和支付等步骤"
    related_terms: ["核保", "保费", "保额"]

  - term: "保费"
    category: "保险"
    definition: "投保人按照保险合同约定向保险公司支付的费用，是获取保险保障的对价，其金额由精算定价、风险状况和市场竞争等因素共同决定。"
    aliases: ["保险费", "保险费用", "缴纳保费"]
    usage_context: "投保人按约定周期（年/季/月）缴纳，保险公司据此承担保险责任，保费充足性是保险公司偿付能力的基础"
    related_terms: ["精算", "保额", "续保"]

  - term: "保额"
    category: "保险"
    definition: "保险金额（Sum Insured），保险合同中约定的保险公司承担赔偿或给付保险金责任的最高限额，是计算保费的重要基础。"
    aliases: ["保险金额", "保额限额", "保障额度"]
    usage_context: "投保时由投保人与保险公司约定，保额越高对应的保费也越高，理赔时赔付金额不得超过保额上限"
    related_terms: ["保费", "理赔", "免赔额"]

  - term: "免赔额"
    category: "保险"
    definition: "保险合同中约定的由被保险人自行承担损失的最低金额，损失在免赔额以内的部分保险公司不予赔付。"
    aliases: ["免赔额", "起付线", "Deductible"]
    usage_context: "常见于健康险和车险中，设置免赔额可以降低小额理赔频次从而控制保费水平，投保人需自行承担免赔额以内的费用"
    related_terms: ["保额", "保费", "理赔"]

  - term: "等待期"
    category: "保险"
    definition: "保险合同生效后至保险责任正式开始承担之间的一段时间，在等待期内发生的保险事故保险公司通常不承担赔付责任。"
    aliases: ["观察期", "等待期", "免责期"]
    usage_context: "常见于健康险和医疗险中，通常为30-90天，目的是防止投保人带病投保的道德风险"
    related_terms: ["核保", "理赔", "续保"]

  - term: "续保"
    category: "保险"
    definition: "保险期满后投保人继续向同一保险公司购买同款或类似保险产品的行为，续保条件和费率可能根据被保险人的风险状况变化而调整。"
    aliases: ["续保行为", "续期", "续保"]
    usage_context: "保险到期前由保险公司通知投保人办理续保，健康险续保时可能因被保险人健康状况变化而调整费率或拒保"
    related_terms: ["保费", "核保", "等待期"]

  - term: "保险责任"
    category: "保险"
    definition: "保险合同中约定的保险公司承担赔偿或给付保险金责任的具体范围和条件，明确哪些风险事故在保障范围之内。"
    aliases: ["保障范围", "承保责任", "责任范围"]
    usage_context: "保险合同的核心条款，投保前需仔细阅读以了解保障的具体内容和除外责任"
    related_terms: ["保额", "理赔", "免赔额"]

  # --- 证券/投资类（11 条） ---
  - term: "K线"
    category: "证券投资"
    definition: "将股票等金融产品的开盘价、收盘价、最高价和最低价以图形方式展示的技术分析图表，每一根K线代表一个交易周期的价格变动。"
    aliases: ["蜡烛图", "K线图", "日本蜡烛线", "Candlestick"]
    usage_context: "技术分析师和投资者用于判断市场趋势和价格形态的基础工具，常用日K、周K和月K等不同周期分析"
    related_terms: ["技术分析", "波动率", "量化交易"]

  - term: "市盈率"
    category: "证券投资"
    definition: "股价与每股收益的比率（Price-to-Earnings Ratio），衡量股票估值水平的核心指标，反映市场愿意为每一元盈利支付的价格。"
    aliases: ["PE", "PE Ratio", "市盈率倍数"]
    usage_context: "基本面分析师评估股票估值高低的重要指标，高PE可能意味着高增长预期或估值泡沫，低PE可能意味着低估或基本面恶化"
    related_terms: ["基本面分析", "市销率", "投资策略分析"]

  - term: "市销率"
    category: "证券投资"
    definition: "股价与每股销售额的比率（Price-to-Sales Ratio），适用于尚未盈利企业的估值参考指标，衡量市场对企业营收的定价水平。"
    aliases: ["PS", "PS Ratio", "市销率倍数"]
    usage_context: "多用于评估互联网、生物医药等早期高成长企业的估值水平，可与同行业公司进行横向对比"
    related_terms: ["市盈率", "基本面分析", "投资策略分析"]

  - term: "技术分析"
    category: "证券投资"
    definition: "通过分析历史市场价格、成交量和图表形态来预测未来价格走势的投资分析方法，以市场行为反映一切信息为核心假设。"
    aliases: ["Technical Analysis", "技术面分析", "技术派"]
    usage_context: "交易员和短期投资者用于择时和判断买卖点的常用方法，包括趋势分析、形态识别和技术指标运用"
    related_terms: ["K线", "基本面分析", "量化交易"]

  - term: "基本面分析"
    category: "证券投资"
    definition: "通过分析宏观经济、行业周期、公司财务状况和经营竞争力等基本面因素来评估投资标的的内在价值和长期投资潜力的分析方法。"
    aliases: ["Fundamental Analysis", "基本面", "基本分析"]
    usage_context: "价值投资者和长期投资者用于选股和定价的核心方法，关注财报数据、行业地位和管理层质量"
    related_terms: ["市盈率", "市销率", "投资策略分析"]

  - term: "量化交易"
    category: "证券投资"
    definition: "利用数学模型、统计方法和计算机程序来自动化执行交易策略的投资方式，通过系统化的信号生成和风险控制机制进行市场操作。"
    aliases: ["量化投资", "程序化交易", "量化策略", "Quant"]
    usage_context: "机构投资者和对冲基金使用的高级交易方式，需要强大的数据处理能力和策略回测验证"
    related_terms: ["技术分析", "波动率", "回撤"]

  - term: "波动率"
    category: "证券投资"
    definition: "衡量金融资产价格变动幅度的统计指标，通常以收益率的标准差表示，是评估投资风险和市场不确定性的核心参数。"
    aliases: ["波动性", "Volatility", "历史波动率"]
    usage_context: "风险管理和衍生品定价中的关键输入参数，高波动率意味着价格波动剧烈、投资风险增大"
    related_terms: ["VaR", "回撤", "风险敞口"]

  - term: "回撤"
    category: "证券投资"
    definition: "投资组合或资产净值从近期最高点回落到最低点的幅度，最大回撤是衡量投资策略风险水平的重要指标。"
    aliases: ["Drawdown", "最大回撤", "回撤幅度"]
    usage_context: "投资者评估策略风险承受能力时关注的核心指标，回撤越小说明策略波动越平稳"
    related_terms: ["波动率", "止损", "量化交易"]

  - term: "止损"
    category: "证券投资"
    definition: "当投资标的的价格下跌到预设水平时自动或手动卖出以限制损失的风险管理策略，是控制单笔投资最大亏损的有效手段。"
    aliases: ["止损位", "Stop Loss", "止损策略"]
    usage_context: "投资者在建立头寸时设定，当市场走势不利时自动执行以控制亏损在可接受范围内"
    related_terms: ["回撤", "波动率", "风险敞口"]

  - term: "杠杆"
    category: "证券投资"
    definition: "借用资金放大投资规模的操作方式，可以在市场方向正确时放大收益，但同时在方向错误时也会放大亏损，极端情况下可能导致本金全部损失。"
    aliases: ["Leverage", "杠杆交易", "融资融券"]
    usage_context: "投资者使用融资融券或衍生品工具放大投资头寸，杠杆率越高风险越大，需严格设置风险控制措施"
    related_terms: ["止损", "波动率", "量化交易"]

  - term: "衍生品"
    category: "证券投资"
    definition: "其价值来源于标的资产（股票、债券、商品、利率等）价格变动的金融合约，包括期货、期权、互换和远期合约等品种，具有高风险高杠杆特征。"
    aliases: ["Derivatives", "金融衍生品", "衍生工具"]
    usage_context: "机构投资者用于对冲风险、套利和投机的高级金融工具，个人投资者参与需具备专业知识和风险承受能力"
    related_terms: ["杠杆", "量化交易", "波动率"]

  # --- 合规/监管类（9 条） ---
  - term: "反洗钱"
    category: "合规监管"
    definition: "AML（Anti-Money Laundering），金融机构依法采取客户身份识别、交易监测、可疑交易报告等措施防范和打击洗钱活动的合规管理体系。"
    aliases: ["AML", "反洗钱管理", "反洗钱合规"]
    usage_context: "金融机构的法定义务，包括客户尽职调查、大额交易报告、可疑交易分析和制裁名单筛查等核心工作"
    related_terms: ["适当性管理", "合规审查", "CRS"]

  - term: "适当性管理"
    category: "合规监管"
    definition: "金融机构在销售产品时，必须将适当的产品销售给适当的客户，确保客户的风险承受能力与产品风险等级相匹配的合规要求。"
    aliases: ["投资者适当性", "适当性", "Suitability"]
    usage_context: "理财顾问和客户经理在推荐产品前必须执行客户风险测评，不得向低风险承受能力的客户推荐高风险产品"
    related_terms: ["风险测评", "投资者保护", "信息披露"]

  - term: "信息披露"
    category: "合规监管"
    definition: "金融机构按照法律法规和监管要求，向投资者、监管机构和公众及时、准确、完整地披露财务信息、产品信息和风险信息的义务。"
    aliases: ["信息披", "信息披露义务", "披露要求"]
    usage_context: "上市公司和金融机构的持续合规义务，包括定期报告、临时公告和产品说明书等各类披露文件"
    related_terms: ["投资者保护", "合规审查", "CRS"]

  - term: "合规审查"
    category: "合规监管"
    definition: "对金融机构的业务活动、内部制度和操作流程是否符合法律法规、监管规定和行业标准的系统性检查和评估工作。"
    aliases: ["合规检查", "合规审计", "Compliance Review"]
    usage_context: "合规部门定期或不定期执行，覆盖各业务条线的合规风险评估，发现问题后出具整改意见并跟踪落实"
    related_terms: ["内控", "反洗钱", "监管评级"]

  - term: "CRS"
    category: "合规监管"
    definition: "共同申报准则（Common Reporting Standard），经济合作与发展组织制定的全球金融账户信息自动交换标准，用于防范跨境逃税行为。"
    aliases: ["共同申报准则", "CRS标准", "金融账户信息交换"]
    usage_context: "金融机构按照CRS要求对非居民金融账户进行尽职调查和信息报送，是跨境金融合规的重要环节"
    related_terms: ["反洗钱", "信息披露", "合规审查"]

  - term: "投资者保护"
    category: "合规监管"
    definition: "通过法律法规、监管制度和市场机制保障投资者合法权益的综合性保护体系，包括知情权、公平交易权和求偿权等基本权利保障。"
    aliases: ["投资者权益保护", "消费者保护", "投资保护"]
    usage_context: "金融市场监管的核心理念之一，贯穿产品设计、销售、信息披露和投诉处理全流程"
    related_terms: ["适当性管理", "信息披露", "合规审查"]

  - term: "监管评级"
    category: "合规监管"
    definition: "监管机构根据金融机构的资本充足性、资产质量、管理能力、盈利水平和流动性状况等维度进行综合评估的分级制度。"
    aliases: ["监管评级", "CAMELS评级", "监管评估"]
    usage_context: "监管机构对商业银行等金融机构实施分类监管的依据，评级结果影响机构的业务范围和监管力度"
    related_terms: ["合规审查", "内控", "信用风险"]

  - term: "内控"
    category: "合规监管"
    definition: "内部控制（Internal Control），金融机构为保障经营合规、资产安全和信息真实完整而建立的内部管理制度、流程和措施的有机整体。"
    aliases: ["内部控制", "内控体系", "内控制度"]
    usage_context: "金融机构风险管理的基础设施，覆盖授权审批、岗位分离、监督检查等各环节的控制措施"
    related_terms: ["合规审查", "操作风险", "风控"]

  - term: "金融消费者权益"
    category: "合规监管"
    definition: "金融消费者在购买金融产品和接受金融服务过程中依法享有的财产安全权、知情权、自主选择权、公平交易权和依法求偿权等基本权利。"
    aliases: ["消保", "金融消费者保护", "消费者权益"]
    usage_context: "金融机构在产品设计和销售中需充分尊重消费者的合法权益，不得强制搭售、隐瞒风险或虚假宣传"
    related_terms: ["投资者保护", "信息披露", "适当性管理"]

  # --- 风险管理类（9 条） ---
  - term: "信用风险"
    category: "风险管理"
    definition: "借款人或交易对手未能按照合同约定履行还款义务而导致金融机构遭受损失的风险，是银行和信贷机构面临的最主要风险类型。"
    aliases: ["信用风险", "违约风险", "Credit Risk"]
    usage_context: "信贷审批和贷后管理中核心关注的风险类型，通过信用评级、抵押担保和风险定价等手段进行管理"
    related_terms: ["不良率", "市场风险", "操作风险"]

  - term: "市场风险"
    category: "风险管理"
    definition: "因市场价格（利率、汇率、股票价格、商品价格等）不利变动导致金融资产价值损失的风险，是交易类和投资类业务面临的主要风险。"
    aliases: ["Market Risk", "市场价格风险", "交易风险"]
    usage_context: "投资经理和交易员日常管理的风险类型，通过多元化配置、对冲工具和风险限额等手段控制"
    related_terms: ["信用风险", "波动率", "VaR"]

  - term: "操作风险"
    category: "风险管理"
    definition: "因内部流程不完善、人员失误、系统故障或外部事件导致金融机构遭受损失的风险，覆盖欺诈、IT系统崩溃和业务中断等多种场景。"
    aliases: ["Operational Risk", "操作风险", "运营风险"]
    usage_context: "金融机构各部门均需管理的风险类型，通过内控流程、系统备份和员工培训等手段防范"
    related_terms: ["内控", "流动性风险", "风控"]

  - term: "流动性风险"
    category: "风险管理"
    definition: "金融机构无法以合理成本及时获取充足资金以应对资产增长或到期债务支付的风险，严重时可能导致机构偿付能力危机。"
    aliases: ["Liquidity Risk", "流动性", "资金链风险"]
    usage_context: "银行资产负债管理中的核心风险，通过流动性覆盖率和净稳定资金比率等指标进行监管"
    related_terms: ["市场风险", "操作风险", "压力测试"]

  - term: "集中度风险"
    category: "风险管理"
    definition: "因授信或投资过于集中于某一行业、区域、客户群体或单一资产而导致的风险集中暴露，分散化不足会放大整体风险敞口。"
    aliases: ["Concentration Risk", "风险集中度", "集中度"]
    usage_context: "金融机构资产组合管理中需监测和控制的风险，监管机构会对单一借款人集中度设置上限"
    related_terms: ["信用风险", "市场风险", "风险敞口"]

  - term: "压力测试"
    category: "风险管理"
    definition: "通过模拟极端但可能发生的市场情景（如经济衰退、利率骤升、市场暴跌），评估金融资产组合或机构整体在极端条件下的风险承受能力。"
    aliases: ["Stress Testing", "压力测试", "情景分析"]
    usage_context: "风险管理部门定期执行，是监管机构要求的重要风险管理工具，测试结果用于评估资本充足性和风险应对预案"
    related_terms: ["VaR", "市场风险", "信用风险"]

  - term: "VaR"
    category: "风险管理"
    definition: "风险价值（Value at Risk），在一定的置信水平和持有期内，金融资产或组合可能遭受的最大潜在损失金额，是衡量市场风险的标准量化指标。"
    aliases: ["风险价值", "VaR值", "在险价值"]
    usage_context: "投资经理和风控人员日常监控市场风险暴露的工具，通常设定95%或99%置信水平，但无法预测极端尾部风险"
    related_terms: ["市场风险", "波动率", "压力测试"]

  - term: "风险敞口"
    category: "风险管理"
    definition: "金融机构在特定风险因素下可能遭受损失的最大暴露金额，是衡量风险承担规模的核心指标，需与资本和风险限额相匹配。"
    aliases: ["风险暴露", "Risk Exposure", "敞口"]
    usage_context: "风控部门监控各业务线的风险承担情况，确保总敞口不超过董事会批准的风险限额"
    related_terms: ["VaR", "集中度风险", "信用风险"]

  - term: "拨备覆盖率"
    category: "风险管理"
    definition: "贷款损失准备金与不良贷款余额的比率，衡量银行对不良贷款损失的吸收能力和财务稳健程度的核心监管指标。"
    aliases: ["拨备率", "准备金覆盖率", "Provision Coverage"]
    usage_context: "监管机构监测银行风险抵御能力的关键指标，拨备覆盖率越高意味着银行对不良贷款损失的准备越充足"
    related_terms: ["不良率", "信用风险", "压力测试"]

  # --- 金融产品类（7 条） ---
  - term: "结构化产品"
    category: "金融产品"
    definition: "将固定收益证券与衍生品相结合而设计的复杂金融产品，收益与标的资产（股票、指数、利率等）表现挂钩，具有较高的结构复杂性和投资风险。"
    aliases: ["结构化理财", "结构化产品", "结构性产品"]
    usage_context: "面向合格投资者的高端理财产品，其收益结构复杂，投资者需充分理解挂钩标的、参与率和收益计算规则后再做决策"
    related_terms: ["衍生品", "私募", "银行理财"]

  - term: "信托"
    category: "金融产品"
    definition: "信托公司作为受托人，基于信托合同为受益人的利益或特定目的管理、运用和处分信托财产的金融服务，涉及融资类、投资类和事务管理类等多种模式。"
    aliases: ["信托产品", "信托计划", "信托业务"]
    usage_context: "高净值客户的重要投资渠道，信托产品通常投资门槛较高，投资者需评估信托公司的管理能力和项目的底层资产质量"
    related_terms: ["私募", "结构化产品", "银行理财"]

  - term: "私募"
    category: "金融产品"
    definition: "以非公开方式向合格投资者募集资金的投资基金，包括私募证券基金、私募股权基金和创业投资基金等类型，投资门槛高且信息披露要求低于公募。"
    aliases: ["私募基金", "私募投资", "Private Equity"]
    usage_context: "面向合格投资者的高端投资产品，起投金额通常为100万元人民币，投资者需具备相应的风险识别和承受能力"
    related_terms: ["公募", "信托", "结构化产品"]

  - term: "公募"
    category: "金融产品"
    definition: "以公开方式向社会公众投资者募集资金的投资基金，受到严格监管，信息披露透明，投资门槛低，适合普通投资者参与。"
    aliases: ["公募基金", "公开募集", "公募产品"]
    usage_context: "普通投资者最常用的投资工具，涵盖股票型、债券型、混合型和货币型等多种风险等级的产品"
    related_terms: ["私募", "基金净值", "理财"]

  - term: "保险资管"
    category: "金融产品"
    definition: "保险公司或保险资产管理公司运用保险资金进行专业化投资管理的业务，投资范围涵盖债券、股票、不动产和基础设施项目等多元资产。"
    aliases: ["保险资产管理", "保险资管产品", "保险资金运用"]
    usage_context: "保险公司资产端的重要业务，管理规模大、投资周期长，注重资产负债匹配和稳健投资收益"
    related_terms: ["公募", "信托", "资产配置"]

  - term: "银行理财"
    category: "金融产品"
    definition: "商业银行向个人和机构客户发行的资产管理产品，在资管新规后全面向净值化转型，产品风险等级从R1到R5不等，投资起点灵活。"
    aliases: ["银行理财产品", "银行理财", "银行资管"]
    usage_context: "普通个人投资者最熟悉的理财产品类型，购买前需完成风险测评并在风险等级匹配范围内选择产品"
    related_terms: ["净值型理财", "风险测评", "适当性管理"]

  - term: "FOF"
    category: "金融产品"
    definition: "基金中的基金（Fund of Funds），以其他基金为主要投资标的的组合投资产品，通过分散投资多只基金实现风险的二次分散。"
    aliases: ["基金中的基金", "FOF基金", "组合基金"]
    usage_context: "适合希望通过单一产品实现多元化资产配置的投资者，FOF管理人对底层基金进行筛选和组合管理"
    related_terms: ["公募", "资产配置", "基金净值"]

  # --- 数据指标类（5 条） ---
  - term: "IRR"
    category: "数据指标"
    definition: "内部收益率（Internal Rate of Return），使项目投资的净现值等于零的折现率，衡量投资项目的预期年化回报水平。"
    aliases: ["内部收益率", "IRR回报", "内含报酬率"]
    usage_context: "投资经理评估项目和资产收益水平的核心指标，IRR越高意味着投资回报越高但同时也需评估对应的风险水平"
    related_terms: ["年化收益", "投资策略分析", "资产配置"]

  - term: "DPI"
    category: "数据指标"
    definition: "已分配收益与实缴资本之比（Distributed to Paid-In），衡量私募股权基金已向LP分配的实际现金回报与LP已出资额的比例。"
    aliases: ["已分配收益倍数", "DPI倍数", "现金回报倍数"]
    usage_context: "LP评估私募基金实际现金回报水平的指标，DPI>1表示LP已收回超过出资额的实际现金分配"
    related_terms: ["私募", "IRR", "投资策略分析"]

  - term: "夏普比率"
    category: "数据指标"
    definition: "衡量投资组合每承担一单位风险所获得的超额回报的指标，等于（组合收益率 - 无风险利率）除以组合收益率的标准差。"
    aliases: ["Sharpe Ratio", "夏普值", "风险调整收益"]
    usage_context: "投资经理评估策略风险调整后收益水平的标准化指标，夏普比率越高说明策略在同等风险下获取的回报越高"
    related_terms: ["波动率", "回撤", "资产配置"]

  - term: "PB"
    category: "数据指标"
    definition: "市净率（Price-to-Book Ratio），股价与每股净资产的比率，衡量股票市值相对于账面价值的估值水平。"
    aliases: ["市净率", "PB Ratio", "市账率"]
    usage_context: "基本面分析中用于评估银行、保险等重资产行业的估值指标，PB<1通常意味着股价低于净资产"
    related_terms: ["市盈率", "基本面分析", "投资策略分析"]

  - term: "久期"
    category: "数据指标"
    definition: "衡量固定收益资产价格对利率变化敏感度的指标，以年为单位表示，久期越长意味着债券价格对利率变动的敏感度越高、利率风险越大。"
    aliases: ["Duration", "债券久期", "利率敏感度"]
    usage_context: "债券投资经理管理利率风险的核心工具，通过匹配资产和负债的久期来控制利率波动对组合的影响"
    related_terms: ["市场风险", "波动率", "投资策略分析"]

# ============================================
# 3. tasks — 任务场景定义（12 个场景）
# ============================================
tasks:
  - name: "投资分析报告"
    description: >
      撰写专业的投资分析报告，对投资标的（股票、基金、债券、衍生品等）
      进行全面分析，包含基本面分析、技术面分析或量化分析，形成明确的
      投资观点和建议。报告需包含风险提示和免责声明，不构成投资建议。
    typical_output: >
      投资分析报告，包含市场概况、标的分析、估值评估、风险因素分析、
      投资观点、风险提示和免责声明、压力测试情景
    complexity: "high"
    frequency: "high"
    follow_up_tree: "investment_analysis_report"

  - name: "风险评估报告"
    description: >
      编制风险评估报告，对金融机构的信用风险、市场风险、操作风险、
      流动性风险等进行系统性识别、度量和评估，提出风险控制建议。
      覆盖风险识别、风险量化、压力测试和应对措施的完整框架。
    typical_output: >
      风险评估报告，包含风险识别矩阵、风险量化分析、压力测试结果、
      风险限额建议、风险缓释措施和持续监控方案
    complexity: "high"
    frequency: "high"
    follow_up_tree: "risk_assessment_report"

  - name: "贷前尽职调查"
    description: >
      对借款企业或个人的资质、经营状况、财务情况和担保条件进行
      全面的尽职调查，形成贷前调查报告作为授信审批的核心依据。
    typical_output: >
      贷前尽职调查报告，包含企业基本情况、财务分析、行业与经营分析、
      资金用途与还款来源分析、担保评估、风险提示和授信建议
    complexity: "high"
    frequency: "high"
    follow_up_tree: "pre_loan_due_diligence"

  - name: "保险理赔处理"
    description: >
      根据保险合同约定和被保险人提供的理赔材料，对保险事故进行
      责任认定、损失核定和赔款计算，出具理赔处理意见或理赔报告。
    typical_output: >
      理赔处理报告，包含出险情况概述、保险责任认定、损失核定明细、
      赔款计算过程、免赔额扣除说明和赔付结论
    complexity: "medium"
    frequency: "high"
    follow_up_tree: "insurance_claims_processing"

  - name: "理财产品设计方案"
    description: >
      设计净值型理财产品的投资策略、资产配置方案和产品要素，
      包括产品类型定位、目标客群分析、投资范围、风险控制措施
      和收益分配机制。注：方案注明不构成投资建议，
      业绩基准不代表实际收益，产品需符合适当性管理要求。
    typical_output: >
      理财产品设计方案，包含产品类型与定位、目标客群与风险等级匹配、
      投资策略与资产配置方案、风险控制措施、业绩比较基准设定说明
      （不构成收益承诺）、产品要素表
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "wealth_product_design"

  - name: "合规检查报告"
    description: >
      对金融机构的业务活动、内部制度和操作流程进行合规性检查，
      识别合规风险点和违规问题，提出整改建议和合规改进方案。
    typical_output: >
      合规检查报告，包含检查范围与依据、检查发现的问题清单、
      合规风险评估、整改建议和跟踪落实计划、合规缺陷汇总表
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "compliance_review_report"

  - name: "反洗钱可疑交易分析"
    description: >
      对监测系统中触发的可疑交易预警进行分析研判，评估交易行为
      的洗钱风险特征，形成可疑交易分析报告，为是否上报可疑交易
      报告（SAR）提供决策依据。
    typical_output: >
      反洗钱可疑交易分析报告，包含交易背景概述、客户身份信息
      与风险评估、交易行为特征分析、可疑指标匹配情况、分析结论
      与处置建议
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "aml_suspicious_transaction"

  - name: "客户适当性评估"
    description: >
      对个人或机构客户进行全面的适当性评估，包括风险承受能力
      测评、投资经验评估、财务状况分析和投资目标确认，确保
      投资建议和产品推荐与客户的风险承受能力相匹配。
    typical_output: >
      客户适当性评估报告，包含客户基本信息与身份认定、风险测评
      结果与分析、投资经验评估、财务状况评估、适当性匹配结论和
      风险揭示确认书
    complexity: "medium"
    frequency: "high"
    follow_up_tree: "client_suitability_assess"

  - name: "资产配置方案"
    description: >
      根据客户的风险测评结果、投资目标和时间期限，制定个性化的
      大类资产配置方案，在股票、债券、现金、商品等资产类别之间
      进行合理分配。注：配置方案基于风险测评结果，不推荐具体
      产品或个股。
    typical_output: >
      资产配置方案，包含客户风险画像与投资目标、大类资产配置比例、
      配置逻辑与预期风险收益特征、再平衡策略、风险提示和免责声明、
      压力测试情景分析
    complexity: "medium"
    frequency: "high"
    follow_up_tree: "asset_allocation_plan"

  - name: "财务尽调报告"
    description: >
      对目标企业或项目的财务状况进行尽职调查，包括财务报表分析、
      关键财务指标验证、盈利质量评估、现金流分析和潜在财务风险
      识别，为投资决策或并购交易提供财务依据。
    typical_output: >
      财务尽职调查报告，包含公司概况与财务概况、财务报表分析
      （资产负债/利润/现金流）、关键财务指标与同业对比、
      盈利质量与可持续性评估、关联交易与财务风险识别、
      尽调结论与建议
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "financial_due_diligence"

  - name: "监管报送材料"
    description: >
      按照监管机构的要求编制和报送各类监管报表、报告和申报材料，
      包括定期监管报表、专项报告、临时报告和各类合规申报文件，
      确保报送内容的准确性和及时性。
    typical_output: >
      监管报送材料，包含报送说明与依据、业务数据汇总表、合规事项
      说明、风险指标监测表、报送人声明与签章信息
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "regulatory_filing_docs"

  - name: "投资策略分析"
    description: >
      对特定的投资策略（价值投资、成长投资、量化策略、事件驱动
      策略等）进行深入分析，包括策略原理、适用市场环境、历史表现
      归因、风险评估和策略优化建议。包含风险收益特征分析和压力
      测试情景。
    typical_output: >
      投资策略分析报告，包含策略概述与投资哲学、策略逻辑与选股
      框架、历史表现归因分析、风险收益特征评估、压力测试情景
      分析、策略优化建议和风险提示
    complexity: "high"
    frequency: "medium"
    follow_up_tree: "investment_strategy_analysis"

# ============================================
# 4. roles — 角色知识定义（7 个角色）
# ============================================
roles:
  - name: "投资经理"
    kpis:
      - name: "投资回报率"
        description: "管理组合在一定周期内的总回报率，含资本利得和期间收益"
        benchmark: "超越业绩比较基准 200bp 以上"
      - name: "回撤控制"
        description: "管理组合从最高点到最低点的最大回撤幅度控制"
        benchmark: "最大回撤 < 15%"
      - name: "组合夏普比率"
        description: "风险调整后的收益水平，每单位风险获得的超额回报"
        benchmark: "Sharpe Ratio > 0.8"
    pain_points:
      - "市场波动剧烈时投资决策压力大，容易受情绪影响追涨杀跌"
      - "客户短期业绩压力与长期投资理念之间的冲突难以平衡"
      - "信息过载，大量研报和数据中筛选有效信息的效率低"
      - "合规风控约束与投资灵活性的矛盾"
    common_tasks:
      - "投资分析报告"
      - "投资策略分析"
      - "资产配置方案"
      - "投资策略分析"
      - "保险理赔处理"
      - "保险理赔处理"
    responsibilities:
      - "负责投资组合的构建、调整和日常管理"
      - "严格遵守投资纪律和风险限额，不进行超越授权的投资操作"
      - "定期进行投资策略回顾和业绩归因分析"
      - "充分了解持仓标的的基本面和风险特征"
      - "向客户和投委会报告投资业绩和风险状况"

  - name: "风控分析师"
    kpis:
      - name: "风险预警准确率"
        description: "风控模型或人工判断触发的风险预警中实际发生风险的比例"
        benchmark: "> 75%"
      - name: "不良率控制"
        description: "监控范围内的信贷资产不良率控制在目标水平以下"
        benchmark: "低于行业平均水平"
      - name: "模型AUC"
        description: "风控评分模型的区分能力，AUC越高模型效果越好"
        benchmark: "AUC > 0.75"
    pain_points:
      - "历史数据有限或质量差，风控模型训练效果不理想"
      - "宏观经济突变时，基于历史数据的风控模型失效"
      - "业务部门认为风控标准过严影响了业务拓展"
      - "跨部门数据壁垒导致风险评估所需数据获取困难"
    common_tasks:
      - "风险评估报告"
      - "保险理赔处理"
      - "保险理赔处理"
      - "风险评估报告"
      - "保险理赔处理"
    responsibilities:
      - "建立和维护风险管理框架和量化模型"
      - "监测业务风险指标并发布风险预警"
      - "定期开展压力测试并评估极端情景影响"
      - "为业务决策提供独立的风险评估意见"
      - "确保风控政策和流程符合监管要求"

  - name: "信贷审批经理"
    kpis:
      - name: "审批时效"
        description: "从受理到出具审批意见的平均工作日数"
        benchmark: "< 5个工作日"
      - name: "不良率"
        description: "经审批发放的贷款中转为不良的比例"
        benchmark: "< 1.5%"
      - name: "审批通过率控制"
        description: "审批通过率控制在合理区间，既不过紧也不过松"
        benchmark: "65% - 75%"
    pain_points:
      - "企业财务报表数据真实性难以核实，信息不对称突出"
      - "贷前调查时间紧资料多，容易遗漏关键风险点"
      - "抵押物价值评估存在主观性，市场波动时估值偏差大"
      - "信贷政策调整频繁，审批标准难以保持一致"
    common_tasks:
      - "贷前尽职调查"
      - "保险理赔处理"
      - "保险理赔处理"
      - "保险理赔处理"
      - "风险评估报告"
    responsibilities:
      - "负责授信申请的尽职调查和风险评估"
      - "独立出具审批意见，不受业务压力影响"
      - "确保授信方案符合信贷政策和监管规定"
      - "跟踪贷后风险状况，及时采取风险缓释措施"

  - name: "保险理赔师"
    kpis:
      - name: "理赔时效"
        description: "从接到报案到完成理赔结案的平均天数"
        benchmark: "< 15个工作日"
      - name: "理赔准确率"
        description: "理赔结论正确的案件占比（经复核/投诉验证）"
        benchmark: "> 98%"
      - name: "客户满意度"
        description: "客户对理赔服务的满意度评分"
        benchmark: "> 4.5/5.0"
    pain_points:
      - "理赔材料不完整或真实性存疑，核查耗时耗力"
      - "保险责任认定存在争议，条款解释空间大"
      - "骗保和欺诈案件的识别难度大"
      - "复杂案件赔付金额计算涉及多因素综合考量"
    common_tasks:
      - "保险理赔处理"
      - "保险理赔处理"
      - "保险理赔处理"
      - "保险理赔处理"
      - "保险理赔处理"
    responsibilities:
      - "按照保险合同和服务承诺及时处理理赔案件"
      - "准确认定保险责任范围和赔付金额"
      - "识别和防范保险欺诈行为"
      - "维护客户关系并耐心解答理赔疑问"
      - "定期总结理赔数据为产品定价提供参考"

  - name: "合规官"
    kpis:
      - name: "合规检查覆盖率"
        description: "年度合规检查计划覆盖的业务条线和部门比例"
        benchmark: "> 90%"
      - name: "整改完成率"
        description: "合规检查发现问题的按时整改完成比例"
        benchmark: "> 95%"
      - name: "监管处罚次数"
        description: "因合规问题被监管机构处罚的次数"
        benchmark: "0次/年"
    pain_points:
      - "监管政策更新频繁，业务部门理解和执行跟不上"
      - "合规检查被业务部门视为阻碍业务发展的绊脚石"
      - "跨境监管要求复杂多变，合规标准兼顾难度大"
      - "合规资源有限，难以覆盖所有风险领域"
    common_tasks:
      - "合规检查报告"
      - "监管报送材料"
      - "反洗钱可疑交易分析"
      - "保险理赔处理"
      - "合规检查报告"
    responsibilities:
      - "确保业务活动符合法律法规和监管要求"
      - "建立和完善合规管理体系和内控制度"
      - "及时识别和评估新出台法规对业务的影响"
      - "组织开展合规培训和合规文化建设"
      - "及时向监管机构报告合规风险和重大合规事件"

  - name: "理财顾问"
    kpis:
      - name: "客户资产规模"
        description: "名下管理的客户金融资产总规模"
        benchmark: "年增长 > 15%"
      - name: "客户留存率"
        description: "年度流失客户数占年初客户总数的比例"
        benchmark: "< 10%"
      - name: "产品推荐匹配度"
        description: "推荐产品的风险等级与客户风险测评结果的匹配比例"
        benchmark: "> 90%"
    pain_points:
      - "客户对收益期望过高，无法接受合理的风险收益匹配"
      - "缺乏高效的工具快速分析客户需求和生成个性化方案"
      - "复杂产品的解释说明耗时且客户理解困难"
      - "市场波动时安抚客户情绪和维护信任关系压力大"
    common_tasks:
      - "客户适当性评估"
      - "资产配置方案"
      - "理财产品设计方案"
      - "投资分析报告"
      - "客户适当性评估"
    responsibilities:
      - "充分了解客户的财务状况、投资目标和风险承受能力"
      - "充分揭示产品风险，确保客户在充分了解风险后做出投资决策"
      - "严格遵守适当性管理要求，不向客户推荐超出其风险等级的产品"
      - "定期检视客户资产配置并提供调整建议"
      - "持续跟踪市场动态，及时向客户传递重要信息"

  - name: "反洗钱专员"
    kpis:
      - name: "可疑交易识别率"
        description: "系统预警后经人工分析确认为可疑交易的占比"
        benchmark: "> 20%"
      - name: "SAR报送及时率"
        description: "可疑交易报告在规定时限内报送的比例"
        benchmark: "100%"
      - name: "误报率"
        description: "系统预警中经人工分析排除的误报案例比例"
        benchmark: "< 80%（持续优化模型降低）"
    pain_points:
      - "可疑交易判定标准主观性强，不同分析师判断不一致"
      - "大量误报消耗人工审核资源，影响工作效率"
      - "客户身份信息更新不及时，尽职调查信息滞后"
      - "洗钱手法不断翻新，识别模型需持续更新"
    common_tasks:
      - "反洗钱可疑交易分析"
      - "客户适当性评估"
      - "保险理赔处理"
      - "保险理赔处理"
      - "反洗钱可疑交易分析"
    responsibilities:
      - "执行客户身份识别和客户尽职调查程序"
      - "对可疑交易预警进行分析研判并及时上报"
      - "维护反洗钱监测模型和风险评级体系"
      - "确保反洗钱工作符合监管要求"
      - "保管反洗钱工作记录和档案资料"

# ============================================
# 5. workflows — 核心流程定义（3 个流程）
# ============================================
workflows:
  - name: "投资决策全流程"
    category: "投资管理"
    steps:
      - step: 1
        name: "市场研究与信息收集"
        owner: "投资经理/研究员"
        deliverables:
          - "宏观及行业研究报告"
          - "标的初选池"
      - step: 2
        name: "标的深度分析"
        owner: "投资经理"
        deliverables:
          - "投资分析报告"
          - "估值模型"
      - step: 3
        name: "风险评估"
        owner: "风控分析师"
        deliverables:
          - "风险评估意见"
          - "风险限额检查结果"
      - step: 4
        name: "合规审查"
        owner: "合规官"
        deliverables:
          - "合规审查意见"
          - "投资合规性确认"
      - step: 5
        name: "投资决策审批"
        owner: "投资决策委员会"
        deliverables:
          - "投资决策审批单"
          - "授权额度确认"
      - step: 6
        name: "交易执行"
        owner: "交易员"
        deliverables:
          - "交易确认单"
          - "成交报告"
      - step: 7
        name: "投后监控与回顾"
        owner: "投资经理/风控"
        deliverables:
          - "持仓监控报告"
          - "业绩归因分析"
    decision_points:
      - point: "风险评估是否在可接受范围内？"
        yes: "进入合规审查环节"
        no: "返回调整投资方案或放弃投资"
      - point: "合规审查是否通过？"
        yes: "进入投资决策审批"
        no: "禁止投资，退回说明原因"
    failure_modes:
      - name: "跳过合规审查直接决策"
        impact: "投资行为可能违反监管规定或内部政策，面临处罚风险"
        prevention: "合规审查设为投资决策的前置强制环节，系统层面锁定流程"
      - name: "风险评估流于形式"
        impact: "未识别出关键风险因素，投资后出现重大亏损"
        prevention: "风险评估报告标准化，建立风险指标量化门槛"
      - name: "超越授权额度投资"
        impact: "集中度风险超标，单一标的亏损影响整体组合"
        prevention: "交易系统设置硬性额度控制，超限自动拦截"

  - name: "信贷审批全流程"
    category: "信贷管理"
    steps:
      - step: 1
        name: "客户申请受理"
        owner: "客户经理"
        deliverables:
          - "借款申请书"
          - "基础资料清单"
      - step: 2
        name: "客户身份识别与KYC"
        owner: "客户经理"
        deliverables:
          - "客户身份识别记录"
          - "反洗钱初筛结果"
      - step: 3
        name: "贷前尽职调查"
        owner: "信贷审批经理"
        deliverables:
          - "贷前尽职调查报告"
          - "财务分析报告"
      - step: 4
        name: "信用评级与风险定价"
        owner: "风控分析师"
        deliverables:
          - "信用评级结果"
          - "风险定价建议"
      - step: 5
        name: "授信方案设计"
        owner: "信贷审批经理"
        deliverables:
          - "授信方案建议书"
          - "担保条件说明"
      - step: 6
        name: "合规审查"
        owner: "合规官"
        deliverables:
          - "授信合规审查意见"
      - step: 7
        name: "信贷审批决策"
        owner: "信贷审批委员会"
        deliverables:
          - "审批决策意见"
          - "授信额度批复"
      - step: 8
        name: "贷款发放"
        owner: "信贷运营"
        deliverables:
          - "贷款合同"
          - "放款凭证"
      - step: 9
        name: "贷后管理"
        owner: "客户经理/风控"
        deliverables:
          - "贷后检查报告"
          - "风险预警记录"
    decision_points:
      - point: "KYC和反洗钱初筛是否通过？"
        yes: "进入贷前尽职调查"
        no: "拒绝申请或要求补充资料"
      - point: "信用评级是否满足最低准入标准？"
        yes: "进入授信方案设计"
        no: "拒绝或要求增加增信措施"
    failure_modes:
      - name: "KYC信息不完整导致洗钱风险"
        impact: "被监管机构处罚，声誉损失"
        prevention: "KYC信息完整性校验列为放款前置条件，不完整不放过"
      - name: "贷前调查不深入导致信息不对称"
        impact: "借款人真实情况未充分揭示，贷款发放后形成不良"
        prevention: "贷前调查清单标准化，关键财务指标交叉验证"
      - name: "贷后管理缺位"
        impact: "风险恶化未能及时发现，错失风险化解时机"
        prevention: "设置贷后检查频率和触发式预警机制"

  - name: "合规审查全流程"
    category: "合规管理"
    steps:
      - step: 1
        name: "监管政策跟踪"
        owner: "合规官"
        deliverables:
          - "监管动态简报"
          - "政策影响评估"
      - step: 2
        name: "合规差距分析"
        owner: "合规官"
        deliverables:
          - "合规差距分析报告"
          - "整改需求清单"
      - step: 3
        name: "制度与流程更新"
        owner: "合规官/业务部门"
        deliverables:
          - "修订后的内控制度"
          - "更新的操作流程"
      - step: 4
        name: "合规检查执行"
        owner: "合规官"
        deliverables:
          - "合规检查报告"
          - "检查发现记录"
      - step: 5
        name: "问题整改落实"
        owner: "业务部门"
        deliverables:
          - "整改计划"
          - "整改完成确认"
      - step: 6
        name: "整改效果验证"
        owner: "合规官"
        deliverables:
          - "整改验收报告"
      - step: 7
        name: "监管报送"
        owner: "合规官"
        deliverables:
          - "监管报送材料"
          - "报送确认回执"
    decision_points:
      - point: "合规差距是否可接受？"
        yes: "进入制度更新流程"
        no: "立即制定整改计划并上报管理层"
      - point: "整改是否达到预期效果？"
        yes: "关闭问题项并归档"
        no: "重新制定整改方案并设定期限"
    failure_modes:
      - name: "监管政策跟踪滞后"
        impact: "新规实施后业务仍按旧规操作，导致违规风险"
        prevention: "建立监管政策跟踪台账，设置新规生效前倒计时预警"
      - name: "整改停留在纸面"
        impact: "整改报告掩盖了实际执行问题，风险依然存在"
        prevention: "整改验证要求提供实质性证据，开展突击抽查"
      - name: "合规检查走过场"
        impact: "风险和问题被掩盖，小问题演变成大风险"
        prevention: "检查清单标准化，实施交叉检查和独立复核机制"

# ============================================
# 6. docs — 文档规范模板（5 个模板）
# ============================================
docs:
  - name: "投资分析报告模板"
    task_type: "投资分析报告"
    sections:
      - title: "市场概况与背景"
        prompt_hint: "当前宏观经济环境、行业趋势和市场热点分析，报告的时间背景和覆盖范围说明"
      - title: "标的深度分析"
        prompt_hint: "投资标的基本面或技术面分析，核心竞争力和成长逻辑阐述，估值分析"
      - title: "风险因素分析"
        prompt_hint: "识别和评估投资标的面临的主要风险（市场/信用/流动性/政策风险），包括压力测试情景分析"
      - title: "投资观点与建议"
        prompt_hint: "明确的投资观点（看多/看空/中性/观望），建议的操作策略和持仓周期"
      - title: "风险提示与免责声明"
        prompt_hint: "本报告不构成投资建议，投资有风险入市需谨慎，过往业绩不代表未来表现，客户应独立做出投资决策"
    tone: "专业，客观，数据驱动，具备批判性思维"
    common_mistakes:
      - "只讲利好不讲风险，分析缺乏批判性思维"
      - "投资观点模糊不清，没有明确的判断和逻辑支撑"
      - "过度依赖历史数据外推，忽略了结构性变化的影响"
      - "缺少风险提示和免责声明，合规风险高"

  - name: "合规检查报告模板"
    task_type: "合规检查报告"
    sections:
      - title: "检查概述"
        prompt_hint: "检查目的、检查范围、检查依据（法规/监管规定/内部制度）、检查期间和方法说明"
      - title: "检查发现与合规缺陷"
        prompt_hint: "逐项列出检查发现的问题，每项包含问题描述、涉及金额或影响范围、违反的具体规定条款、风险等级评定"
      - title: "合规风险评估"
        prompt_hint: "对发现问题的合规风险进行综合评估，包括风险等级矩阵、可能导致的监管处罚或声誉损失分析"
      - title: "整改建议与计划"
        prompt_hint: "针对每项问题提出具体整改措施、责任部门、整改期限和验收标准"
      - title: "跟踪落实机制"
        prompt_hint: "整改跟踪方式、定期复查安排、未按时整改的上报和升级机制"
    tone: "严谨，客观，依据充分"
    common_mistakes:
      - "检查发现描述笼统，缺少具体事实和数据支撑"
      - "风险等级评定标准不统一，同类问题评级差异大"
      - "整改建议缺乏可操作性，业务部门无法落地执行"
      - "未设置跟踪机制，整改落实无法有效监督"

  - name: "贷前尽职调查报告模板"
    task_type: "贷前尽职调查"
    sections:
      - title: "企业基本情况"
        prompt_hint: "企业基本信息、股权结构、管理层背景、主营业务、经营历史沿革"
      - title: "财务状况分析"
        prompt_hint: "资产负债表/利润表/现金流量表分析，关键财务指标（资产负债率/流动比率/毛利率/净利率），与同行业对比"
      - title: "行业与经营分析"
        prompt_hint: "行业前景、竞争格局、企业在行业中的地位、核心竞争优势和经营风险"
      - title: "资金用途与还款来源分析"
        prompt_hint: "本次贷款的具体用途、还款来源的可靠性和充足性分析、还款计划安排"
      - title: "担保与增信措施评估"
        prompt_hint: "抵质押物类型、价值评估、抵押率、担保人资质和担保能力分析"
      - title: "风险提示与授信建议"
        prompt_hint: "识别的主要风险点、风险缓释措施、授信方案建议（金额/期限/利率/担保条件）"
    tone: "客观，审慎，数据详实"
    common_mistakes:
      - "财务报表数据未经交叉验证直接引用，真实性存疑"
      - "过于依赖抵押物价值而忽视第一还款来源的分析"
      - "行业分析泛泛而谈，缺乏对行业特定风险的深入分析"
      - "风险提示蜻蜓点水，没有实质性的风险评估"

  - name: "资产配置方案模板"
    task_type: "资产配置方案"
    sections:
      - title: "客户风险画像"
        prompt_hint: "客户风险测评结果、投资经验、财务状况、流动性需求和投资目标概述"
      - title: "大类资产配置建议"
        prompt_hint: "股票/债券/现金/商品等各大类资产的配置比例建议，配置逻辑和预期风险收益特征说明"
      - title: "配置逻辑说明"
        prompt_hint: "基于客户风险画像和市场环境判断的配置逻辑，各类资产选择的考量因素"
      - title: "再平衡策略"
        prompt_hint: "定期再平衡的周期和触发条件，偏离阈值设定和调整方式"
      - title: "压力测试与情景分析"
        prompt_hint: "在不同市场情景（牛/熊/震荡/极端事件）下组合的表现预测和风险暴露分析"
      - title: "风险提示与免责声明"
        prompt_hint: "配置方案基于风险测评结果，不推荐具体产品或个股，投资有风险入市需谨慎"
    tone: "专业，贴合客户需求，风险揭示充分"
    common_mistakes:
      - "配置方案模板化，没有考虑客户个性化的实际情况"
      - "忽视流动性需求，配置了过多锁定期的产品"
      - "风险提示流于形式，没有针对客户风险特征的特别说明"
      - "只展示了乐观情景，没有分析不利情景下的风险暴露"

  - name: "反洗钱可疑交易分析报告模板"
    task_type: "反洗钱可疑交易分析"
    sections:
      - title: "交易概述"
        prompt_hint: "交易时间、交易金额、交易对手、交易渠道、交易发生频率等基本信息汇总"
      - title: "客户身份与风险评估"
        prompt_hint: "客户身份信息、职业/经营背景、历史交易特征、客户洗钱风险等级评估结果"
      - title: "交易行为特征分析"
        prompt_hint: "交易模式分析、异常特征描述（大额/分散/频繁/跨境等）、与客户身份和经营范围的匹配度分析"
      - title: "可疑指标匹配分析"
        prompt_hint: "比对的洗钱风险指标类型、触发条件、严重程度、涉及的可疑交易特征清单"
      - title: "分析结论与处置建议"
        prompt_hint: "是否认定为可疑交易的结论、建议类型（上报SAR/加强监控/终止业务关系/提交合规复审）以及依据说明"
    tone: "客观，严谨，依据充分"
    common_mistakes:
      - "分析流于表面，没有深入挖掘交易背景和客户行为模式"
      - "可疑判断缺乏量化依据，主观臆断成分大"
      - "未考虑客户合理解释，直接认定为可疑交易"
      - "报告逻辑链条不完整，从触发条件到结论的推理缺乏说服力"

# ============================================
# 7. follow_up_trees — 追问逻辑树（12 棵树）
# ============================================
follow_up_trees:

  # --- 追问树 1: 投资分析报告 ---
  - task_type: "investment_analysis_report"
    root_node_id: "inv_q1"
    nodes:
      inv_q1:
        node_id: "inv_q1"
        question_text: "需要分析的标的主要属于哪种投资类型？"
        question_type: "single_choice"
        info_key: "inv_type"
        depth: 1
        options:
          - value: "stock"
            label: "股票投资分析"
          - value: "fund"
            label: "基金产品分析"
          - value: "fixed_income"
            label: "固收类产品分析"
          - value: "derivatives"
            label: "衍生品分析"
        children:
          stock: "inv_q2_method"
          fund: "inv_q2_method"
          fixed_income: "inv_q2_method"
          derivatives: "inv_q2_method"
        fallback_node_id: "inv_q2_method"
        is_leaf: false

      inv_q2_method:
        node_id: "inv_q2_method"
        question_text: "分析深度和专业性要求如何？"
        question_type: "single_choice"
        info_key: "inv_depth"
        depth: 2
        options:
          - value: "fundamental"
            label: "基本面深度分析（财务/估值/行业分析）"
          - value: "technical"
            label: "技术面分析（趋势/形态/技术指标）"
          - value: "quantitative"
            label: "量化分析（因子/回测/策略建模）"
          - value: "comprehensive"
