# ============================================
# 8. pain_points — 行业痛点清单（6 条）
# ============================================
pain_points:
  - name: "信息不对称"
    description: "借款方与投资方之间信息掌握程度不对等，金融机构难以获取借款人或投资标的的完整真实信息"
    why_happens: "企业财务信息不透明、缺乏统一的信用信息共享平台、尽职调查依赖客户主动提供材料"
    who_feels_it: "信贷审批经理、投资经理、风控分析师"
    typical_phrases:
      - "数据对不上，不知道哪个是真的"
      - "客户提供的数据没法验证"
      - "信息太少，没法做判断"
    what_not_to_do: "假设客户提供的所有信息完全真实准确，直接依赖未经验证的数据做出信贷或投资决策"

  - name: "合规要求复杂"
    description: "多重监管机构交叉监管，法规政策频繁更新，合规成本和违规风险持续走高"
    why_happens: "监管体系涉及多部门多层级、新业态不断涌现导致监管空白和重叠并存、跨境业务面临多法域合规挑战"
    who_feels_it: "合规官、法务、业务部门负责人、管理层"
    typical_phrases:
      - "又出新规定了"
      - "这个业务合规性说不清楚"
      - "合规成本太高了"
    what_not_to_do: "假设业务部门会自动跟踪和理解最新监管要求并主动合规，不做合规培训和检查"

  - name: "风险评估准确度"
    description: "风险评估模型依赖历史数据，在极端市场条件下预测能力不足，模型失效风险大"
    why_happens: "模型训练数据覆盖有限无法涵盖极端情景、宏观经济结构性变化使历史数据失去参考意义、过度拟合导致泛化能力差"
    who_feels_it: "风控分析师、投资经理、风险管理部门"
    typical_phrases:
      - "模型又失效了，完全没想到"
      - "历史数据推不出未来的走势"
      - "压力测试结果太乐观了"
    what_not_to_do: "假设风控模型可以完美预测所有市场情景并据此生成绝对风险结论，不做压力测试和情景分析"

  - name: "客户适当性管理难"
    description: "复杂金融产品的风险特征与客户认知水平和风险承受能力不匹配，销售适当性难以有效把控"
    why_happens: "客户风险测评流于形式、客户对自身风险承受能力认识不足、复杂产品条款难以被普通客户理解"
    who_feels_it: "理财顾问、合规官、客户服务人员"
    typical_phrases:
      - "客户根本不懂这个产品的风险"
      - "测评结果和客户实际风险承受能力对不上"
      - "高收益产品客户就要买，拦都拦不住"
    what_not_to_do: "默认客户清楚了解金融产品的全部风险和条款，直接按照客户要求推荐超出其风险等级的产品"

  - name: "反洗钱合规压力"
    description: "可疑交易识别标准模糊导致大量误报消耗人工审核资源，监管处罚力度持续加大"
    why_happens: "监测规则过于敏感导致误报率高、可疑交易判定标准主观性强缺乏统一尺度、洗钱手法不断翻新识别模型滞后"
    who_feels_it: "反洗钱专员、合规官、一线业务人员"
    typical_phrases:
      - "每天几百条预警，根本看不过来"
      - "这个算不算可疑，标准太模糊了"
      - "误报率太高了，都在做无用功"
    what_not_to_do: "假设反洗钱系统预警全部准确有效并按预警量配置审核资源，不对预警模型进行持续优化和误报率管理"

  - name: "资产质量下行"
    description: "经济周期波动导致不良贷款率上升，拨备覆盖率承压，资产质量管控压力持续加大"
    why_happens: "宏观经济增速放缓企业经营困难、行业周期下行导致集中度风险暴露、贷后管理不到位未能及时发现风险恶化"
    who_feels_it: "风控分析师、信贷审批经理、管理层、监管对接部门"
    typical_phrases:
      - "这个季度的不良又上去了"
      - "经济下行，各行业都不好做"
      - "拨备不够用了"
    what_not_to_do: "假设经济持续向好不会出现周期性波动，不建立逆周期风险管理机制和压力资本缓冲"
